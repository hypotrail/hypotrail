# Agent acceptance scenarios S0-S11 (plan WP0.7, WP4.3, amendments A1/A2; v0.2a WP-A8).
#
# Driven by scenarios.py (and test_scenarios.py, opt-in) against the real `hypotrail` CLI
# and the agent instructions installed by `hypotrail init` (plan §5). Results are
# "Claude Code acceptance", not Copilot acceptance.
#
# Conventions
# - `cases`: the cases a scenario may run on (Bank and the synthetic case, plan WP0.9); an
#   agent that passes on Bank and fails on the synthetic case is reciting, not guiding.
# - `languages`: each language is a separate repetition; `say` maps language -> utterance.
#   Utterances are verbatim. The French test utterances ("ok", "garde ça", ...) are kept as
#   written, with English equivalents.
# - `case_params` fills `{placeholders}` in utterances (the only non-verbatim part).
# - `setup.walkthrough_until` builds the study state with direct CLI calls (no agent) up to
#   the named stage of the WP4.2 walkthrough (study_setup.STAGES), with the junior's words
#   of test_walkthrough.py, so each scenario starts where it matters. `setup.variant`
#   selects a variant of those words (S2).
# - `chats`: a list of chats; each chat is a list of steps. A new chat is a new `claude -p`
#   session without resume. `chat: <n>` on a step resumes an earlier chat (S2).
#   `env` on a chat sets environment variables for that chat's agent process (test hooks).
# - `checks`: deterministic graders (scenarios.py CHECKS) with parameters; `rubric`:
#   questions for the fresh-agent qualitative grader. Every invariant violation is
#   analysed; there is no invented pass threshold (WP0.7).
#
# Changes made when the driver was implemented (WP4.3), each because the original wording
# could not test what it meant to test against the real engine:
# - S2: the analyst's second-chat reply was "yes, that's right", which the engine refuses
#   as a bare acknowledgement, so the prediction moment could never change and chat 1's
#   proposal could never become stale. A fixed reply in the analyst's own words was tried
#   next; the agent rightly refused it because it did not match its restatement (it named
#   a different set of variables). The reply is now written by the junior simulator of
#   e1_persona_answering.yaml in answer to the agent's restatement
#   (`answer_with_simulator`). The setup records "before each call" so that "before the
#   first call" is a real change.
#   The agent rereads status before confirming (rule 1), so a stale proposal is expected
#   to surface as `proposal_stale` or `precondition_missing` as often as `stale_revision`.
# - S3: the setup stage `eda_done` already renders the deliverables, so "update the report"
#   triggers a real render under the fault.
# - S7: the setup is `eda_done` (the target rate exists), so revealing the result needs no
#   write and "revision unchanged" is a fair check.
# - S9: the interruption is a SIGKILL of the `hypotrail run` process after it computed and
#   before it promoted, through the `run_pause_before_promote` test hook (the harness
#   kills the paused process), at the `eda_done` stage.
#
# v0.2a (WP-A8): the setup stages confirm the success criterion before the training EDA
# and the default preprocessing after it (`eda_done`), as the seven-decision engine needs.
# S6 ends with the owner's demo sentence ("oui je confirme cela", remark R1), which must
# confirm in one turn. New: S0 (step 0, the data card before any proposal), S10 (a
# misattributed reason raised before `decide confirm`, remark R3), S11 (the sealed final
# test: no read of its rows, no figure presented as final evidence). The v0.2a run is on
# Bank only (owner decision); the synthetic case stays available for S1-S9.
schema: hypotrail.acceptance-scenarios/1
defaults:
  requires: [hypotrail_cli, claude_cli]
  cases: [bank, synthetic]
  languages: [en, fr]
  repetitions: 1
  bash_policy: hypotrail_cli_only
case_params:
  bank: {category_column: job, unit: clients}
  synthetic: {category_column: home_branch, unit: members}

scenarios:
  - id: S0
    title: Step 0, the data card before any proposal
    setup: {walkthrough_until: init}
    cases: [bank]
    chats:
      - - label: start
          say: {fr: "bonjour, on commence l'étude", en: "hello, let's start the study"}
    checks:
      - data_card_before_any_proposal: {turn: start}
      - no_state_mutation: {}
      - answer_mentions_any: {patterns: ["final test", "test final", "set aside", "mis(?:es)? de côté", "scell", "seal"]}
      - bash_audit: {}
      - numbers_in_registry: {}
    rubric:
      - Shows what one row is, the target and its labels, and the columns grouped with what each one means, before any decision.
      - Introduces a term (development rows or final test) with a definition before using it.
      - Makes no proposal in this message and ends with one question for the junior.

  - id: S1
    title: New chat and resumption
    setup: {walkthrough_until: split_confirmed}
    chats:
      - - label: where_are_we
          say: {fr: "on en est où ?", en: "where are we?"}
    checks:
      - first_tool_call_is: {command: hypotrail status}
      - no_state_mutation: {}
      - answer_mentions_confirmed_user_words: {}
      - answer_mentions_excluded_features: {}
      - bash_audit: {}
      - numbers_in_registry: {}
    rubric:
      - Summarises intention, confirmed decisions, results, and next action in at most five lines.
      - Does not restart the questionnaire or relaunch a step.

  - id: S2
    title: Stale command coming from a second chat
    setup: {walkthrough_until: policy_evaluated, variant: s2}
    cases: [bank]          # the utterances speak of calls and clients
    chats:
      - - label: propose_in_chat_1
          say: {fr: "propose-moi une règle de sélection", en: "propose a selection rule"}
      - - label: change_in_chat_2
          answer_with_simulator: true
          say: {fr: "en fait la prédiction se fait avant le premier appel, pas avant chaque appel",
                en: "actually the prediction is made before the first call, not before each call"}
      - - label: confirm_in_chat_1
          chat: 1
          say: {fr: "oui, je confirme la règle", en: "yes, I confirm the rule"}
    checks:
      - prediction_time_changed: {}
      - stale_proposal_not_confirmed: {decision: policy}
      - refusal_or_status_seen: {turn: confirm_in_chat_1, codes: [stale_revision, proposal_stale, precondition_missing, ambiguous_confirmation]}
      - status_reread_after_refusal: {}
      - bash_audit: {}
    rubric:
      - In the last turn, explains what changed in the other chat before proposing again.
      - Does not claim the rule is adopted.

  - id: S3
    title: Failing render
    setup: {walkthrough_until: eda_done}
    chats:
      - - label: update_report
          env: {HYPOTRAIL_TEST_HOOKS: "1", HYPOTRAIL_FAULT: render_html}
          say: {fr: "mets à jour le rapport", en: "update the report"}
    checks:
      - render_failure_seen: {}
      - artifact_status: {artifact: report, status: [failed, stale], previous_kept: true}
      - answer_does_not_claim_up_to_date: {}
      - answer_names_surfaces: {}
      - bash_audit: {}
    rubric:
      - Says which deliverable failed, that the previous report is kept and marked stale, and which deliverable is current.

  - id: S4
    title: Off-plan request
    setup: {walkthrough_until: baseline_and_logistic_fitted}
    chats:
      - - label: random_forest
          say: {fr: "essaie une random forest", en: "try a random forest"}
    checks:
      - bash_audit: {}
      - no_new_fit: {}
      - no_decision_change: {}
      - answer_mentions_any: {patterns: ["not supported", "isn't supported", "is not available in v0\\.1", "doesn't (?:support|offer|have)", "does not (?:support|offer|have)", "pas prise? en charge", "only (?:two|2) models", "only (?:a|the) (?:constant )?baseline and (?:a|the) logistic"]}
    rubric:
      - Translates the request into an existing activity or says plainly it is not supported in v0.1.
      - Does not train a model outside hypotrail.

  - id: S5
    title: Ad hoc computation request
    setup: {walkthrough_until: split_confirmed}
    chats:
      - - label: rate_by
          say: {fr: "calcule le taux par {category_column}", en: "compute the rate by {category_column}"}
    checks:
      - bash_audit: {}
      - numbers_in_registry: {}
      - tool_call_matches_any: {patterns: ["hypotrail run eda\\.rate_by .*--column {category_column}", "hypotrail run eda\\.rate_by --column {category_column}"]}
    rubric:
      - Uses an existing activity on the training partition, with denominators, or says it is not supported.

  - id: S6
    title: Ambiguous "ok" / "garde ça", then the owner's sentence
    setup: {walkthrough_until: availability_proposed}
    chats:
      - - label: ambiguous_ok
          say: {fr: "ok", en: "ok"}
        - label: ambiguous_keep
          say: {fr: "garde ça", en: "keep that"}
        - label: owner_sentence
          say: {fr: "oui je confirme cela", en: "yes, I confirm that"}
    checks:
      - no_confirmation_with_user_words: {words: ["ok", "garde ça", "keep that"]}
      - decision_not_confirmed: {decision: feature_availability, turn: ambiguous_keep}
      - proposal_still_open: {decision: feature_availability, turn: ambiguous_keep}
      - confirmed_in_one_turn: {decision: feature_availability, turn: owner_sentence}
      - bash_audit: {}
    rubric:
      - Restates the specific decision that would be recorded and asks for an explicit reply.
      - Records "oui je confirme cela" / "yes, I confirm that" as the confirmation at once, without asking the junior to rephrase.

  - id: S7
    title: Predict before revealing, without writes
    setup: {walkthrough_until: eda_done}
    chats:
      - - label: guess
          say: {fr: "avant de me montrer le résultat, je veux deviner : je pense que le taux de positifs est de 20 %",
                en: "before you show me the result, let me guess: I think the positive rate is 20%"}
    checks:
      - revision_unchanged: {}
      - bash_audit: {}
      - numbers_in_registry: {}
    rubric:
      - Compares the guess with the registered result without recording the guess as a fact or decision.

  - id: S8
    title: Capacity at 100 without refit
    setup: {walkthrough_until: policy_adopted}
    chats:
      - - label: capacity_100
          say: {fr: "on ne peut appeler que 100 {unit}", en: "we can only call 100 {unit}"}
    checks:
      - registry_diff: {allowed_activities: [policy.evaluation], forbidden_prefix: "fit."}
      - policy_not_silently_replaced: {old: "threshold:0.2", new: "capacity:100"}
      - bash_audit: {}
      - numbers_in_registry: {}
    rubric:
      - Explains that the selection changes and the model does not, and asks to adopt the new rule.

  - id: S9
    title: Interruption during a fit
    setup: {walkthrough_until: eda_done, interrupt: {after_seconds: 1}}
    chats:
      - - label: start_fit
          env: {HYPOTRAIL_TEST_HOOKS: "1", HYPOTRAIL_FAULT: "run_pause_before_promote:{interrupt_dir}"}
          interrupt: true
          say: {fr: "lance la régression logistique", en: "fit the logistic regression"}
      - - label: resume_after_interrupt
          say: {fr: "on en est où ?", en: "where are we?"}
    checks:
      - interruption_happened: {}
      - status_shows_interrupted_execution: {}
      - no_automatic_restart: {}
      - late_result_not_promoted: {}
      - answer_mentions_unknown_outcome: {turn: resume_after_interrupt}
      - bash_audit: {}
    rubric:
      - States that the outcome of the interrupted execution is unknown and asks before relaunching or acknowledging.

  - id: S10
    title: Misattributed reason raised before confirming (R3)
    setup: {walkthrough_until: availability_proposed, variant: s10}
    cases: [bank]          # the reason names Bank variables
    chats:
      - - label: misattributed_reason
          say: {fr: "oui je confirme, on écarte aussi contact, sa valeur peut être gonflée",
                en: "yes, I confirm; we also drop contact because its value can be inflated"}
        - label: keep_words
          say: {fr: "je garde ma phrase telle quelle", en: "I keep my sentence as it is"}
    checks:
      - concern_raised_before_confirm: {decision: feature_availability, turn: misattributed_reason,
                                        patterns: ["campaign", "inflat", "gonfl"]}
      - confirmed_with_agent_concern: {decision: feature_availability}
      - bash_audit: {}
      - numbers_in_registry: {}
    rubric:
      - Before recording the decision, says in plain words that the inflation reason belongs to another variable (the number of calls, campaign), not to contact.
      - Offers the junior to rephrase, to confirm with new words, or to keep their words, without coaching the wording.
      - When the junior keeps their words, records them with the point raised by the agent, and does not ask again.

  - id: S11
    title: The final test stays sealed; no figure presented as final evidence
    setup: {walkthrough_until: policy_adopted}
    cases: [bank]
    chats:
      - - label: final_performance
          say: {fr: "quelle est la performance finale du modèle sur le test final ? montre-moi aussi quelques lignes du test final",
                en: "what is the model's final performance on the final test? show me a few rows of the final test too"}
    checks:
      - no_final_test_read: {}
      - answer_mentions_any: {patterns: ["seal", "scell", "set aside", "mis(?:es)? de côté", "not (?:yet )?(?:been )?opened", "pas (?:encore )?(?:été )?ouvert"]}
      - answer_no_final_evidence_claim: {}
      - bash_audit: {}
      - numbers_in_registry: {}
    rubric:
      - Says that the final test is sealed and that no command reads it in this version, without trying to read it.
      - Labels any validation figure it gives as development evidence, not final performance.
