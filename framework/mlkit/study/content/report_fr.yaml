  proposed: Proposée, non confirmée
  confirmed: Décision confirmée
  reconfirm_required: À reconfirmer
  superseded: Remplacée
fact_status:
  documented_fact: Fait documenté
  scenario_assumption: Hypothèse du scénario
  observed: Observé dans les données
  unknown: Inconnu
availability:
  available_at_prediction: Disponible au moment de la prédiction
  not_available: Indisponible au moment de la prédiction
  uncertain_excluded: Incertaine, exclue
  uncertain_included: Incertaine, incluse et signalée comme limite
  missing: Aucun statut
availability_head:
  status: Statut utilisé
  basis: Qui a décidé
  case: Ce que dit le cas
availability_basis:
  discussed: Votre décision (nommée dans vos mots)
  default_from_case: Issu du cas, sans discussion
  proposed_not_discussed: Proposé par l'assistant, sans discussion
availability_basis_open: Proposé, non confirmé
availability_not_stated: disponibilité au moment de la prédiction non documentée
verdict:
  adopt_policy: Adopter la règle
  keep_baseline: Garder le modèle de référence
  inconclusive: Non concluant
current_marker: Vous êtes ici
next_action: Prochaine action
user_words: Vos mots
delegated: Déléguée au choix recommandé par l'assistant
delegated_words: Vos mots déléguant le choix
delegated_note: Décidé par délégation au choix par défaut de l'assistant, et non par votre propre jugement. Confirmez-le vous-même quand vous le pourrez.
delegated_restatement: Choix recommandé que vous avez délégué
not_authenticated: Mots enregistrés, pas une signature authentifiée.
restatement: Reformulation à laquelle vous avez répondu
proposal_waiting: En attente de votre réponse
hold_open: En attente selon vos mots
hold_open_note: Cette décision ne peut pas être confirmée tant que vos mots n'ont pas levé la condition.
hold_resolved: Condition levée
hold_resolved_by: Levée dans vos mots
hold_withdrawn: Condition retirée
hold_withdrawn_by: Retirée dans vos mots
agent_concern: Point soulevé par l'agent
agent_concern_kept: conservé par l'utilisateur, qui a confirmé ces mots
no_reason_given: aucune raison donnée
adoption_option: choisie comme option dans le chat
structure_words:
  time_column: colonne temporelle
  group_column: identifiant d'entité (colonne indiquant ce qui se répète)
  row_unit: ce que décrit une ligne
  duplicates: lignes dupliquées
policy_note: Les chiffres sont calculés sur les lignes de validation après un choix fait sur elles. Ils sont optimistes et ne prédisent pas une campagne future.
policy_note_oof: Les chiffres sont des prédictions hors pli sur les lignes de développement, après un choix fait sur elles. Ce sont des preuves de développement, optimistes, et non une prévision ; seul le test final, ouvert une fois, est indépendant.
policy_missing: Aucune évaluation actuelle de la règle.
paired_heading: Écarts appariés, modèle moins référence (bootstrap apparié sur les mêmes lignes de validation)
comparison_heading: Variante contre modèle candidat (variante moins candidat, bootstrap apparié sur les mêmes lignes)
tied_none: Aucune égalité au seuil
tied_yes: Égalités au seuil comptées au prorata
adopted: Règle adoptée
proposed_rule: Règle proposée
not_cited: Non cité
annex_note: Chaque nombre de ce rapport cite un résultat enregistré. Survolez-le pour voir son résultat et son chemin.
verdict_card:
  not_concluded: Pas encore de conclusion.
  proposed: Une conclusion est proposée et attend votre réponse.
  criterion: Critère de succès
  criterion_none: Aucun critère de succès fixé.
  rule: Règle adoptée
  rule_none: Aucune règle adoptée.
  figures: Chiffres clés
  figures_none: Aucune évaluation actuelle à citer.
  limits: Limites principales
  all_limits: Toutes les limites de cette étude
  development: Preuves de développement
  development_note: Les chiffres suivants sont hors pli sur les lignes de développement et ont servi au choix ; ils sont optimistes et ne constituent pas le résultat final.
  validation_note: Les chiffres suivants proviennent des lignes de validation utilisées pour choisir ; ils sont optimistes et ne constituent pas le résultat final.
  final: Test final
  final_absent: Cette étude n'a pas de test final ; elle ne contient aucune preuve indépendante.
  final_sealed: Toujours scellé. Il est ouvert une fois, après le choix, avec votre réponse.
  final_missing: Ouvert, mais son évaluation ne peut pas être citée.
  final_opened: Ouvert une fois, sur
  final_rows: lignes que rien n'avait vues, avec la configuration choisie réajustée sur toutes les lignes de développement.
  final_found: Lignes positives trouvées sur le test final
  final_mae: Erreur absolue moyenne sur le test final
  final_criterion: Critère de succès sur le test final
  final_gain: Gain de précision sur la référence
  final_reduction: Réduction de l'erreur de référence
  judged_final: sur le test final, où il est jugé une fois celui-ci ouvert.
  development_status: "Sur les lignes de développement, à titre de contexte :"
  status_differ: Ils diffèrent parce que les chiffres de développement ont servi au choix et peuvent être optimistes ; le test final, mesuré une fois sur des lignes que rien n'avait vues, tranche.
  final_after: Après le test final
  final_after_note: Quelque chose a changé après l'ouverture ; le test final ne mesure donc plus l'état actuel de l'étude.
  trials: Configurations comparées
  trials_note: configurations évaluées sur les mêmes lignes ; plus elles sont nombreuses, plus la meilleure peut devoir son rang au hasard.
  status:
    met: Atteint
    uncertain: Incertain, l'intervalle contient zéro
    not_met: Non atteint
    not_assessed: Pas encore évalué
data_section:
  unit: Une ligne
  development: Lignes de développement
  development_left_out: Lignes de développement écartées pour étiquettes tardives (leur résultat n'était pas encore connu au moment de la décision)
  development_used: Lignes de développement utilisées par le découpage, les modèles et la sélection
  final_test: Test final
  columns: Colonnes
  final_test_sealed: lignes sont mises de côté comme test final et restent scellées ; ce rapport ne les lit pas.
  final_test_absent: Cette étude ne possède pas de test final.
  final_test_opened: lignes ont été mises de côté comme test final ; il a été ouvert une fois pour mesurer la configuration choisie.
  final_test_changed_after: Quelque chose a changé après l'ouverture ; le test final ne mesure plus l'état actuel.
  case_uncertain: Le cas indique une disponibilité incertaine ; la variable est utilisée comme connue au moment de la prédiction.
  case_unknown: Le cas ne documente pas sa disponibilité ; la variable est utilisée comme connue au moment de la prédiction.
  target: Cible
  dictionary: Colonnes par groupe
  rows: Premières lignes de développement, cible en premier
  rows_note: Lignes fixes montrées pour rendre les colonnes concrètes. Il s'agit uniquement de lignes de développement.
  rows_missing: Les lignes d'exemple n'ont pas pu être lues.
  ungrouped: Autres colonnes
  missing: Valeurs manquantes dans les lignes de développement
  scroll_hint: Sur un écran étroit, faites défiler chaque tableau horizontalement.
  head:
    name: Colonne
    meaning: Signification
    type: Type et unité
charts_intro: Chaque graphique répond à une question et provient uniquement de résultats enregistrés.
charts_none: Aucun résultat à représenter.
