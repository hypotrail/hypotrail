schema: hypotrail.content.report_fr/1
title: Rapport de l'étude
subtitle: Un rapport évolutif de l'étude. Il décrit l'état enregistré ; il ne prend aucune décision.
authority: Cette page ne se met pas à jour seule. L'état lu avec hypotrail status fait foi.
no_controls: Cette page ne contient aucun contrôle de décision. Les décisions sont prises dans le chat ou avec hypotrail decide, à partir de votre réponse.
theme_toggle: Changer de thème
generated_for_revision: Généré pour la révision de l'étude
generated_by_for_revision: Généré par Hypotrail pour la révision de l'étude
last_written_for_revision: dernière génération pour la révision
companion_origin: Proposée depuis le compagnon.
sections:
  verdict: Conclusion
  objective: Objectif
  data: Données
  charts: Ce que montrent les résultats
  revision: Révision et livrables
  plan: Avancement de l'étude
  decisions: Décisions
  facts: Ce que dit le cas
  evidence: Preuves par étape
  policy: Comparaison des règles
  diagnostics: Diagnostics du modèle
  not_yet_defensible: Ce qui n'est pas encore défendable
  annex: Annexe des résultats
surfaces:
  report: Rapport HTML
  notebook: Notebook généré
  editable: Notebook d'étude éditable
  workbench: Établi
