  ok: À jour pour cette révision
  stale: Obsolète
  failed: Échec de génération
  not_rendered: Pas encore généré
  not_tracked: Créé une fois et jamais écrasé ; ses essais ne sont pas suivis
step_status:
  done: Terminé
  needs_reconfirmation: À confirmer de nouveau
  awaiting_confirmation: En attente de votre réponse
  ready: Prêt
  blocked: Bloqué par une étape précédente
decision_status:
