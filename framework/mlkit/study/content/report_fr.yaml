  train: lignes d'entraînement
  validation: lignes de validation
  development: lignes de développement
  final_test: lignes du test final
  all: toutes les lignes
regression:
  sections:
    policy: Comparaison des modèles
  verdict_card:
    rule: Modèle choisi
    rule_none: Aucun modèle choisi.
  verdict:
    adopt_model: Adopter le modèle linéaire
    keep_baseline: Garder la moyenne de référence
    inconclusive: Non concluant
  chosen_model: Modèle choisi
  proposed_model: Modèle proposé
  model_missing: Aucune comparaison actuelle de modèles.
  model_note: Les erreurs sont calculées sur les lignes de validation après un choix fait sur elles, dans l'unité de la cible. Elles sont optimistes et ne prédisent pas l'erreur sur de futures lignes.
  model_note_oof: Les erreurs sont des prédictions hors pli sur les lignes de développement, après un choix fait sur elles, dans l'unité de la cible. Ce sont des preuves de développement optimistes ; seul le test final, ouvert une fois, est indépendant.
  model_paired_heading: Écarts appariés, modèle linéaire moins moyenne de référence (un écart négatif indique une erreur plus faible ; bootstrap apparié sur les mêmes lignes de validation)
  residuals_heading: Résidus sur les lignes de validation (valeur observée moins prédiction)
  residuals_by_heading: Résidus par période
  model_names:
    fit.baseline: Moyenne de référence
  not_yet_defensible_extra:
    grouped_split_unsupported: Le résultat du découpage indique combien de valeurs de groupe les deux partitions partagent et combien de lignes de validation elles contiennent.
    no_causality: L'étude compare des prédictions ; elle ne montre pas que modifier une variable modifierait la cible.
    validation_is_not_independent: Un modèle choisi sur les lignes de validation rend son erreur de validation optimiste.
    workbench_not_tracked: Les essais dans l'établi ne changent rien et ne prouvent rien.
  cross_validation:
    model_note: Les erreurs sont des prédictions hors pli sur les lignes de développement, après un choix fait sur elles, dans l'unité de la cible. Ce sont des preuves de développement optimistes ; seul le test final, ouvert une fois, est indépendant.
    model_paired_heading: Écarts appariés, modèle linéaire moins moyenne de référence (un écart négatif indique une erreur plus faible ; bootstrap apparié sur les mêmes prédictions hors pli)
    residuals_heading: Résidus des prédictions hors pli (valeur observée moins prédiction)
    not_yet_defensible_extra:
      grouped_split_unsupported: Le résultat du découpage indique combien de valeurs de groupe les plis partagent.
      validation_is_not_independent: Un modèle choisi sur les prédictions hors pli rend son erreur hors pli optimiste ; seul le test final, ouvert une fois, est indépendant.
cross_validation:
  charts_intro: Chaque graphique répond à une question et provient de résultats enregistrés. Les lignes de développement sont explorées et leurs prédictions hors pli servent à comparer et choisir ; le test final reste à part.
  rows_label:
    train: lignes de développement
    validation: lignes de développement prédites hors pli
  capacity_population:
    after: lignes de développement prédites hors pli (une capacité conserve sa part dans chaque pli), qui représentent une part des lignes scorées et non une population entière. Reportez le taux de volume sur une autre population avant d'en donner un nombre.
  looks:
    summary: Regards sur le résultat dans les lignes de développement
    note: Chaque exploration qui lit la cible sur les lignes de développement compte comme un regard. Plus il y en a, plus un motif trouvé peut être dû au hasard.
  motivation:
    contingent: Choisi après avoir regardé le résultat sur les lignes de développement ; les chiffres hors pli peuvent donc être légèrement optimistes.
    not_contingent: Choisi avant tout regard sur le résultat dans les lignes de développement.
  paired_heading: Écarts appariés, modèle moins référence (bootstrap apparié sur les mêmes prédictions hors pli, rééchantillonnées dans chaque pli)
  policy_note: Chiffres issus de prédictions hors pli sur les lignes de développement, après un choix fait sur elles. Ce sont des preuves de développement optimistes, pas une prévision ; seul le test final, ouvert une fois, est indépendant.
  slot_labels:
    eda.single_feature_signal: Signal de chaque variable seule sur les lignes de développement
  not_yet_defensible_extra:
    validation_is_not_independent: Un seuil ou une capacité choisi sur des prédictions hors pli rend ces chiffres optimistes ; seul le test final, ouvert une fois, est indépendant.

capacity_population:
  before: Une règle de capacité sélectionne ici ce nombre parmi les
  after: lignes de validation, qui représentent une part des lignes scorées et non une population entière. Reportez son taux de volume sur une autre population avant d'en donner un nombre.
contradiction:
  title: Les mots et la valeur se contredisent
  exclude: Vos mots excluent {variable}, mais la valeur la conserve.
  keep: Vos mots conservent {variable}, mais la valeur l'exclut.
correction: Correction dans vos mots
correction_note: Enregistrée après la confirmation ; la décision n'a pas été reposée.
credit_heading: Qui a décidé quoi
credit_explicit: "Confirmé dans les propres mots de l'analyste :"
credit_delegated: "Choix par défaut recommandé par l'assistant, délégué par l'analyste (et non choisi par l'analyste) :"
motivation:
  contingent: Choisi après avoir regardé le résultat sur les lignes d'entraînement ; les chiffres de validation peuvent donc être légèrement optimistes.
  not_contingent: Choisi avant tout regard sur le résultat dans les lignes d'entraînement.
  not_current: Une analyse antérieure qui n'est plus actuelle.
  looks: L'étude avait {n} regard{s} sur le résultat avant cette proposition.
  questions: "Questions à l'origine de cette préparation :"
roles:
  target: La cible
  time: Colonne temporelle, ordonne le découpage
  group_id: Identifiant de groupe, pas une variable du modèle
  id: Identifiant de ligne, pas une variable du modèle
slot_labels:
  eda.quality: Qualité des lignes de développement (sans lire la cible)
  eda.single_feature_signal: Signal de chaque variable seule sur les lignes d'entraînement
not_yet_defensible_extra:
  capacity_exceeds_validation: Tout sélectionner ne dit rien sur la qualité du classement ; choisissez une capacité inférieure au nombre de lignes de validation.
  delegated_decisions: Vous avez laissé l'assistant choisir. Le choix est enregistré, mais ses raisons sont celles de l'assistant, pas les vôtres.
  high_cardinality_grouping: Relancez l'exploration avec un --max-groups plus grand pour voir davantage de groupes.
  no_causality: L'étude classe les lignes ; elle ne montre pas qu'agir modifierait le résultat.
  no_time_or_entity_identifier: Sans colonne temporelle ni identifiant d'entité, la dérive et les entités répétées ne peuvent pas être vérifiées.
  open_holds: Vous avez demandé d'attendre. Rien de ce qui est en attente n'est confirmé tant que vos propres mots n'ont pas levé la condition.
  public_data_already_explored: Ces données publiques peuvent déjà avoir été explorées par vous, par d'autres ou par le modèle qui vous assiste.
  small_validation_partition: Avec si peu de lignes de validation, une ou deux lignes peuvent changer un chiffre ; comparez les modèles avec prudence.
  uncertain_features_included: Des variables dont la disponibilité est incertaine sont incluses et peuvent contenir de l'information postérieure au moment de la prédiction.
  validation_is_not_independent: Un seuil ou une capacité choisi sur les lignes de validation rend les chiffres de validation optimistes.
  workbench_not_tracked: Les essais avec les curseurs de l'établi ne changent rien et ne prouvent rien.
notebook:
  banner_current: Généré à cette révision. Les nombres sont figés par identifiant de résultat.
  banner_stale: L'étude a changé depuis la génération de ce notebook. Générez-le à nouveau avant de vous y fier.
  read_only: Lecture seule. Écrivez vos notes dans study_editable.py ou workbench.py ; ce fichier est régénéré et ses modifications sont archivées.
  source_changed: Le module a changé après le calcul de ce résultat ; le code affiché n'est pas celui qui a été exécuté.
  source_label: Source de l'activité (affichée, non exécutée)
diagnostics:
  intro: Où le modèle se trompe et jusqu'où ses scores peuvent se lire comme des probabilités. Chaque partie répond à une question à partir des prédictions enregistrées.
  pending: Aucun diagnostic pour le moment. Ils sont calculés à partir des prédictions après ajustement et comparaison des modèles.
  stale: Ces diagnostics ne décrivent plus les modèles ou la règle actuels ; ils ne sont pas cités avant un nouveau calcul.
  before_opening: Calculé avant l'ouverture du test final.
  after_opening: Calculé après l'ouverture du test final, uniquement sur les lignes de développement ; cela n'ajoute aucune preuve finale.
  development: Preuves de développement
  development_note: Calculé sur les prédictions des lignes de développement qui ont servi à choisir le modèle et la règle. Elles décrivent le choix ; seul le test final est indépendant.
  final: Preuves finales
  final_absent: Cette étude n'a pas de test final.
  final_sealed: Le test final est encore scellé et n'a donc aucun diagnostic. Ils ne sont calculés qu'après son ouverture.
  final_pending: Le test final est ouvert ; ses diagnostics ne sont pas encore calculés.
  final_note: Calculé une fois le test final ouvert, à partir des prédictions de son unique évaluation, uniquement pour la configuration choisie.
  model: Modèle affiché
  rule: Règle de ces chiffres
  models_heading: Modèles côte à côte
  confusion_heading: Matrice de confusion à la règle
  confusion_rows: Résultat observé
  confusion_selected: Sélectionnée par la règle
  confusion_not_selected: Non sélectionnée
  confusion_positive: Positive
  confusion_negative: Négative
  confusion_expected: Une égalité à la limite est comptée au prorata ; ces effectifs sont donc attendus.
  gain_heading: Courbe de gain
  roc_heading: Qualité du classement
  calibration_heading: Calibration
  calibration_table: Tranches de calibration (même nombre de lignes, dans l'ordre des scores)
  coefficients_heading: Coefficients avec intervalles bootstrap
  coefficients_note: Plus grands coefficients en valeur absolue. Ce sont des associations conditionnelles aux autres variables, pas les effets d'une modification.
  segments_heading: Précision et rappel à la règle, par segment
  segments_note: Segments choisis par le moteur ; une cellule avec peu de lignes ou de lignes sélectionnées est signalée et ne doit pas être lue seule.
  examples_heading: Exemples d'erreurs
  examples_none: Aucune à cette règle.
  false_negatives: Non sélectionnées alors que le résultat est positif (scores croissants)
  false_positives: Sélectionnées alors que le résultat est négatif (scores décroissants)
  residuals_heading: Résidus
  residual_summary: Distribution des résidus (valeur observée moins prédiction)
  by_feature_heading: Résidus par variable
  hetero_heading: L'erreur augmente-t-elle avec la prédiction ?
  hetero_yes: Signalé
  hetero_no: Non signalé
  largest_heading: Plus grandes erreurs
  smearing: Transformation de la cible
  rule_source:
    adopted: la règle que vous avez adoptée
    proposed: la règle proposée au moment du calcul
    scenario_default: la part du scénario pédagogique, avant toute proposition de règle
    engine_default: une part par défaut, avant toute proposition de règle
