    grouped_split_unsupported: Le résultat du découpage indique combien de valeurs de groupe les deux partitions partagent et combien de lignes de validation elles contiennent.
    no_causality: L'étude compare des prédictions ; elle ne montre pas que modifier une variable modifierait la cible.
    validation_is_not_independent: Un modèle choisi sur les lignes de validation rend son erreur de validation optimiste.
    workbench_not_tracked: Les essais dans l'établi ne changent rien et ne prouvent rien.
  cross_validation:
