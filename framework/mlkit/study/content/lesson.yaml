# R41, R48, R52, R53 (owner remarks 2026-10-28): the evidence table, the dots, the criterion
# judged on the final test, the method diagrams (render_evidence).
evidence:
  interval: {en: " [{low}, {high}]", fr: " [{low} ; {high}]"}
  chosen: {en: chosen, fr: choisi}
  col_config: {en: Configuration, fr: Configuration}
  col_dev: {en: "Development (out of fold, used to choose)", fr: "Développement (hors pli, a servi à choisir)"}
  col_final: {en: "Final test (read once)", fr: "Test final (lu une fois)"}
