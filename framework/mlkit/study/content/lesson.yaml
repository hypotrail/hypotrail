prereq:
  label: {en: What you need to read this report, fr: Ce qu'il faut pour lire ce rapport}
  items:
    - {en: "<b>A mean and a gap.</b> An error, a rate or a difference is always given with the rows it was computed on, and with an interval when the study has one.", fr: "<b>Une moyenne et un écart.</b> Une erreur, un taux ou une différence est toujours donné avec les lignes sur lesquelles il a été calculé, et avec un intervalle quand l'étude en a un."}
    - {en: "<b>The four evidence marks.</b> ○ nothing was read; ◇ the structure was read, without the target; ◐ a development result, which was used to choose and is therefore optimistic; ● the final test, sealed, opened only once.", fr: "<b>Les quatre marques de preuve.</b> ○ rien n'a été lu ; ◇ la structure a été lue, sans la cible ; ◐ un résultat de développement, qui a servi à choisir et reste donc optimiste ; ● le test final, scellé, ouvert une seule fois."}
    - {en: "<b>The code is optional.</b> The \"Code\" blocks reproduce cells of the generated notebook, which recompute recorded figures with pandas and scikit-learn and check the equality with assert. nv and RESULT_IDS are the notebook's helpers for reading the study.", fr: "<b>Le code est facultatif.</b> Les blocs « Code » reprennent des cellules du notebook généré, qui recalculent les chiffres enregistrés avec pandas et scikit-learn et vérifient l'égalité par assert. nv et RESULT_IDS sont les aides du notebook pour lire l'étude."}
    - {en: "<b>Every number is cited.</b> Hover a number to see the recorded result and the path it comes from; the appendix lists every result.", fr: "<b>Chaque nombre est cité.</b> Survolez un nombre pour voir le résultat enregistré et le chemin dont il vient ; l'annexe liste chaque résultat."}
    - {en: "<b>Where you are.</b> The line pinned at the top of the screen gives the chapter being read and what remains; the buttons on the right switch the report to the other language and to the whiteboard theme, for this visit only.", fr: "<b>Où vous êtes.</b> La ligne collée en haut de l'écran donne le chapitre lu et ce qui reste ; les boutons à droite passent le rapport dans l'autre langue et en tableau blanc, pour cette visite seulement."}
  marks_heading: {en: The evidence marks, fr: Les marques de preuve}
  marks:
    none: {en: "The chapter reads no row: it fixes a rule, a frame, a decision on paper.", fr: "Le chapitre ne lit aucune ligne : il fixe une règle, un cadre, une décision sur papier."}
    structural: {en: "Development rows were read, but not the target: counts, missing cells, out-of-range values, associations between predictors.", fr: "Des lignes de développement ont été lues, mais pas la cible : comptes, cellules manquantes, valeurs hors plage, liens entre prédicteurs."}
    development: {en: "A result computed on the development rows. It was used to explore or to choose, so it is slightly optimistic.", fr: "Un résultat calculé sur les lignes de développement. Il a servi à explorer ou à choisir : il est donc un peu optimiste."}
    final: {en: "A result measured on the sealed final test, opened only once after the choice.", fr: "Un résultat mesuré sur le test final scellé, ouvert une seule fois après le choix."}
    status: {en: "The chapter's step was carried out and recorded, is in progress, or has not run yet.", fr: "L'étape du chapitre a été menée et enregistrée, est en cours, ou n'a pas encore tourné."}
  stamps_heading: {en: The stamps, fr: Les tampons}
  stamps:
    real: {en: "Numbers cited from the results recorded by the engine, each traceable to its result and path.", fr: "Des nombres cités depuis les résultats enregistrés par le moteur, chacun traçable jusqu'à son résultat et son chemin."}
    state: {en: "Counts recorded in the study state rather than computed by an activity (the sealed rows, the looks, the trials).", fr: "Des comptes enregistrés dans l'état de l'étude plutôt que calculés par une activité (les lignes scellées, les regards, les essais)."}
    text: {en: "Sentences recorded by the engine, quoted as they are.", fr: "Des phrases enregistrées par le moteur, citées telles quelles."}
    auto: {en: "A decision recorded by the automatic mode chosen at launch, with the engine's value. It is not yours until you adopt or change it in the chat.", fr: "Une décision enregistrée par le mode automatique choisi au lancement, avec la valeur du moteur. Elle n'est pas la vôtre tant que vous ne l'avez pas adoptée ou changée dans le chat."}
    sealed: {en: "The final test: set aside at creation, not read until it is opened once.", fr: "Le test final : mis de côté à la création, non lu jusqu'à son unique ouverture."}
    scenario: {en: "A statement made by the case, not a decision.", fr: "Un énoncé posé par le cas, pas une décision."}
    creation: {en: "An action taken by the engine when the study was created.", fr: "Un geste fait par le moteur au moment où l'étude a été créée."}
    words: {en: "A decision in your own words, recorded in the chat.", fr: "Une décision prise avec vos propres mots, enregistrée dans le chat."}
    marker: {en: "Words recorded in the other language (yours, or the assistant's restatement), shown as they were written.", fr: "Des mots enregistrés dans l'autre langue (les vôtres, ou la reformulation de l'assistant), montrés tels qu'ils ont été écrits."}
  abbr_heading: {en: Abbreviations and notation, fr: Les abréviations et notations}
  abbr:
    - {term: {en: "[a, b] · interval", fr: "[a ; b] · intervalle"}, def: {en: "A bootstrap interval: most resamples of the rows fall between a and b. It expresses the uncertainty that comes from which rows were drawn.", fr: "Un intervalle bootstrap : la plupart des rééchantillonnages des lignes tombent entre a et b. Il dit l'incertitude due au tirage des lignes."}}
    - {term: {en: "out of fold", fr: "hors pli"}, def: {en: "A prediction made by a model fitted without the predicted row.", fr: "Une prédiction faite par un modèle ajusté sans la ligne prédite."}}
    - {term: {en: "n", fr: "n"}, def: {en: "A number of rows.", fr: "Un nombre de lignes."}}
    - {term: {en: "rev. · revision", fr: "rév. · révision"}, def: {en: "Each recorded change to the study increases its revision number; the report describes one revision.", fr: "Chaque changement enregistré de l'étude augmente son numéro de révision ; le rapport décrit une révision."}}
    - {term: {en: "−  · decimals", fr: "−  · décimales"}, def: {en: "Negative numbers carry a true minus sign; decimals follow the language (a decimal point in English, a decimal comma in French).", fr: "Les nombres négatifs portent un vrai signe moins ; les décimales suivent la langue (un point en anglais, une virgule en français)."}}

