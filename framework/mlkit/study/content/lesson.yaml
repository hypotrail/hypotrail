  dots_note: {en: "Open dot: out-of-fold error on the development rows; filled dot: error on the final test; line: bootstrap interval. The dashed line is the criterion's bound on the final test (the reference's final error reduced by the criterion's share), drawn only.", fr: "Point creux : erreur hors pli sur les lignes de développement ; point plein : erreur sur le test final ; trait : intervalle bootstrap. Le pointillé est la borne du critère sur le test final (l'erreur finale de la référence diminuée de la part du critère), seulement dessinée."}
  dot_dev: {en: development, fr: développement}
  dot_final: {en: final test, fr: test final}
  key_dev: {en: "development (out of fold)", fr: "développement (hors pli)"}
  key_final: {en: "final test", fr: "test final"}
  key_ci: {en: bootstrap interval, fr: intervalle bootstrap}
