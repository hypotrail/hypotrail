  exposure_question: {en: "When was the target read, and when was the final test opened?", fr: "Quand la cible a-t-elle été lue, et quand le test final a-t-il été ouvert ?"}
  exposure_note: {en: "One dot per recorded result, at the revision it started, on the lane of what it read. Everything left of the dashed line was decided without the final test.", fr: "Un point par résultat enregistré, à la révision où il a commencé, sur la ligne de ce qu'il a lu. Tout ce qui est à gauche du pointillé a été décidé sans le test final."}
  partition_how: {en: "How the sealed rows were drawn: {method}, a share of {fraction} of the file, at the study's creation, before any look.", fr: "Comment les lignes scellées ont été tirées : {method}, une part de {fraction} du fichier, à la création de l'étude, avant tout regard."}
  methods:
    quantile_stratified: {en: "stratified by quantiles of the target", fr: "stratifiées par quantiles de la cible"}
    temporal: {en: "the latest rows in time order", fr: "les lignes les plus récentes dans l'ordre du temps"}
    random: {en: "at random", fr: "au hasard"}
    stratified: {en: "stratified by the target", fr: "stratifiées sur la cible"}
  established: {en: "What the study establishes", fr: "Ce que l'étude établit"}
  not_established: {en: "What it does not establish", fr: "Ce qu'elle n'établit pas"}
  next: {en: "And then", fr: "Et après"}
  established_regression: {en: "On the {n} final-test rows, read once, {model} errs by {mae} on average against {base} for the reference (predict the mean): the error on the final test is reduced by {gain}{interval}, against a minimum of {minimum} fixed before any model.", fr: "Sur les {n} lignes du test final, lues une fois, {model} se trompe de {mae} en moyenne contre {base} pour la référence (prédire la moyenne) : l'erreur sur le test final est réduite de {gain}{interval}, face à un minimum de {minimum} fixé avant tout modèle."}
  established_none: {en: "The final test is not opened: the study establishes no independent figure yet. The development figures are in the verdict and in chapter seven.", fr: "Le test final n'est pas ouvert : l'étude n'établit encore aucun chiffre indépendant. Les chiffres de développement sont dans le verdict et au chapitre sept."}
  no_chart: {en: "No chart for these points: the engine does not record the values they need.", fr: "Pas de graphique pour ces points : le moteur n'enregistre pas les valeurs qu'il leur faut."}
  no_chart_observed: {en: "Observed against predicted on the final rows: the final evaluation records summaries (errors, residual quantiles), not the predictions row by row.", fr: "Valeurs observées contre prédites sur les lignes finales : l'évaluation finale enregistre des résumés (erreurs, quantiles des résidus), pas les prédictions ligne par ligne."}
  no_chart_by_year: {en: "Error by period on the final rows: the final evaluation records no error by period, and its rows were drawn without time order.", fr: "Erreur par période sur les lignes finales : l'évaluation finale n'enregistre aucune erreur par période, et ses lignes ont été tirées sans ordre de temps."}

# Guided readings, one per figure kind (R30). ``why`` answers "why this figure"; ``frame``
# names the evidence, the rows and the model; ``read`` is the step-by-step reading;
# ``conclude`` and ``attention`` take cited values. A kind may hold variants
# (``conclude_<variant>``) that the renderer picks from the recorded values.
figures:
  parts:
    title: {en: "The rows of the file, in parts", fr: "Les lignes du fichier, par parts"}
    why: {en: "It answers \"which rows does the study work on, and which are off limits?\". Every figure in this report concerns one of the parts: they must be seen before reading any result.", fr: "Elle répond à « sur quelles lignes l'étude travaille-t-elle, et lesquelles lui sont interdites ? ». Tout chiffre de ce rapport porte sur l'une des parts : il faut les voir avant de lire le moindre résultat."}
    read:
      - {en: "Read the length of each part: development rows on the left, the sealed final test on the right.", fr: "Lisez la longueur de chaque part : les lignes de développement à gauche, le test final scellé à droite."}
      - {en: "Compare the counts written at the end of each part.", fr: "Comparez les comptes écrits au bout de chaque part."}
    conclude: {en: "{sealed} of the {total} rows are sealed; every analysis of the exploration and model chapters concerns the other {dev}.", fr: "{sealed} des {total} lignes sont scellées ; toutes les analyses des chapitres d'exploration et de modèles portent sur les {dev} autres."}
    conclude_absent: {en: "All {total} rows are development rows: nothing is kept apart.", fr: "Les {total} lignes sont toutes des lignes de développement : rien n'est gardé à part."}
    conclude_opened: {en: "{sealed} of the {total} rows were set aside as the final test and opened once; every analysis of the exploration and model chapters concerns the other {dev}.", fr: "{sealed} des {total} lignes ont été mises à part comme test final, puis ouvertes une fois ; toutes les analyses des chapitres d'exploration et de modèles portent sur les {dev} autres."}
    attention: {en: "The bar does not show which rows are sealed: the draw is recorded by the engine, not drawn here.", fr: "La barre ne montre pas quelles lignes sont scellées : le tirage est enregistré par le moteur, il n'est pas dessiné ici."}
    attention_opened: {en: "The bar does not show which rows were set aside: the draw is recorded by the engine, not drawn here.", fr: "La barre ne montre pas quelles lignes ont été mises à part : le tirage est enregistré par le moteur, il n'est pas dessiné ici."}
  columns:
    title: {en: "The columns, with their meaning and status", fr: "Les colonnes, avec leur sens et leur statut"}
    why: {en: "Before predicting, we need to know what each column says, in which unit, how many cells are missing, and what the study may do with it. The second table makes these columns concrete on a few rows.", fr: "Avant de prédire, il faut savoir ce que dit chaque colonne, dans quelle unité, combien de cases manquent, et ce que l'étude a le droit d'en faire. Le second tableau rend ces colonnes concrètes sur quelques lignes."}
    read:
      - {en: "Read the last column of the first table: it says what the study does with each column.", fr: "Lisez la dernière colonne du premier tableau : elle dit ce que l'étude fait de chaque colonne."}
      - {en: "Spot the missing counts: they are counted on the development rows only.", fr: "Repérez les cases manquantes : elles sont comptées sur les lignes de développement seulement."}
      - {en: "In the second table, read one row from left to right: it is one observation.", fr: "Dans le second tableau, lisez une ligne de gauche à droite : c'est une observation."}
    conclude: {en: "{n_columns} columns in all: the target, the candidate variables with their status, and the columns that order or group the rows.", fr: "{n_columns} colonnes en tout : la cible, les variables candidates avec leur statut, et les colonnes qui ordonnent ou regroupent les lignes."}
    conclude_generic: {en: "The card says what one row describes, how many development rows the study reads, and what stays sealed.", fr: "La fiche dit ce que décrit une ligne, combien de lignes de développement l'étude lit, et ce qui reste scellé."}
    attention: {en: "A few first rows are not representative: they show the columns, not the data.", fr: "Quelques premières lignes ne sont pas représentatives : elles montrent les colonnes, pas les données."}
  availability:
    title: {en: "Each variable and its status at the moment of prediction", fr: "Chaque variable et son statut au moment de la prédiction"}
    why: {en: "It answers \"which variables may the model see, and who decided it?\", one line per variable, with what the case states.", fr: "Il répond à « quelles variables le modèle peut-il voir, et qui l'a décidé ? », une ligne par variable, avec ce que dit le cas."}
    read:
      - {en: "Read the status used: only the variables available at prediction time enter a model.", fr: "Lisez le statut retenu : seules les variables disponibles au moment de la prédiction entrent dans un modèle."}
      - {en: "Read who decided: your words, the case, or the automatic mode.", fr: "Lisez qui a décidé : vos mots, le cas, ou le mode automatique."}
    conclude: {en: "{n_available} variables enter the model; {n_excluded} are excluded.", fr: "{n_available} variables entrent dans le modèle ; {n_excluded} sont exclues."}
    attention: {en: "What the case states is not proof: a variable the case calls available may still be known too late in practice.", fr: "Ce que dit le cas n'est pas une preuve : une variable que le cas dit disponible peut encore être connue trop tard en pratique."}
  signal:
    title: {en: "The signal of each variable alone", fr: "Le signal de chaque variable seule"}
    why: {en: "A variable that predicts the outcome almost alone is the classic trace of a column known too late. The chart asks the question for each variable; it never selects variables.", fr: "Une variable qui prédit presque seule la cible est la trace classique d'une colonne connue trop tard. Le graphique pose la question pour chaque variable ; il ne sélectionne jamais de variables."}
    read:
      - {en: "Find the dashed line: chance. A bar starts there.", fr: "Repérez la ligne pointillée : le hasard. Une barre part de là."}
      - {en: "Look for a flagged bar: strong enough to question.", fr: "Cherchez une barre signalée : assez forte pour être questionnée."}
    conclude_flagged: {en: "A signal strong enough to question the availability: {flagged}.", fr: "Un signal assez fort pour questionner la disponibilité : {flagged}."}
    conclude: {en: "No variable alone is strong enough to question its availability.", fr: "Aucune variable seule n'est assez forte pour questionner sa disponibilité."}
    attention: {en: "A weak signal alone does not make a variable useless: it may matter together with others.", fr: "Un signal faible seul ne rend pas une variable inutile : elle peut compter avec les autres."}
  folds:
    title: {en: "Fold by fold", fr: "Pli par pli"}
    why: {en: "It answers \"how are the development rows divided, and which rows does each model predict?\". Every out-of-fold figure of the model chapters comes from these blocks.", fr: "Elle répond à « comment les lignes de développement sont-elles réparties, et quelles lignes chaque modèle prédit-il ? ». Chaque chiffre hors pli des chapitres des modèles vient de ces blocs."}
    read:
      - {en: "Each block is one fold, with its rows; under a time order, its range of the time column.", fr: "Chaque bloc est un pli, avec ses lignes ; sous un ordre temporel, sa plage de la colonne de temps."}
      - {en: "The rows of one block are predicted by a model fitted on all the other blocks.", fr: "Les lignes d'un bloc sont prédites par un modèle ajusté sur tous les autres blocs."}
    conclude: {en: "{folds} folds cover the {dev} development rows; each row gets exactly one out-of-fold prediction.", fr: "{folds} plis couvrent les {dev} lignes de développement ; chaque ligne reçoit exactement une prédiction hors pli."}
    conclude_holdout: {en: "{train} rows fit the models and {validation} rows judge them; the two sets never mix.", fr: "{train} lignes ajustent les modèles et {validation} lignes les jugent ; les deux ensembles ne se mélangent jamais."}
    conclude_generic: {en: "The split is recorded; every model of the next chapters is judged on the rows it assigns.", fr: "Le découpage est enregistré ; chaque modèle des chapitres suivants est jugé sur les lignes qu'il attribue."}
    attention: {en: "{shared} groups appear in several folds ({shared_rows} rows): a model may recognise a group it has seen, so the error on a new group may be larger.", fr: "{shared} groupes apparaissent dans plusieurs plis ({shared_rows} lignes) : un modèle peut reconnaître un groupe déjà vu, donc l'erreur sur un groupe nouveau peut être plus grande."}
    attention_temporal: {en: "Blocks in time order are fitted on later rows too: a fold is predicted with knowledge of the future of the file, unlike in use.", fr: "Des blocs dans l'ordre du temps sont aussi ajustés sur des lignes plus récentes : un pli est prédit avec une connaissance de la suite du fichier, contrairement à l'usage."}
  quality:
    title: {en: "The quality of the development rows", fr: "La qualité des lignes de développement"}
    why: {en: "Missing cells, repeated rows and out-of-range values decide how the variables must be prepared; they are read without the target.", fr: "Les cellules manquantes, les lignes répétées et les valeurs hors plage décident de la préparation des variables ; elles sont lues sans la cible."}
    read:
      - {en: "Read the missing cells by column.", fr: "Lisez les cellules manquantes par colonne."}
      - {en: "Then the duplicated rows and the ranges against what the case declares.", fr: "Puis les lignes dupliquées et les plages comparées à ce que déclare le cas."}
    conclude: {en: "{rows_missing} development rows hold at least one missing cell, out of {rows}.", fr: "{rows_missing} lignes de développement ont au moins une cellule manquante, sur {rows}."}
    attention: {en: "A value coded as a marker (a question mark, a sentinel) is missing even when the cell is not empty.", fr: "Une valeur codée par un marqueur (un point d'interrogation, une valeur sentinelle) est manquante même quand la case n'est pas vide."}
  target_summary:
    title: {en: "The target on the development rows", fr: "La cible sur les lignes de développement"}
    why: {en: "The mean of the target is the reference's prediction: every model is judged against it. The box shows how spread the target is.", fr: "La moyenne de la cible est la prédiction de la référence : chaque modèle est jugé face à elle. La boîte montre à quel point la cible est étalée."}
    read:
      - {en: "The box holds the middle half of the rows; the thick line is the median.", fr: "La boîte contient la moitié centrale des lignes ; le trait épais est la médiane."}
      - {en: "The circle is the mean, with its interval.", fr: "Le cercle est la moyenne, avec son intervalle."}
    conclude: {en: "The target has a mean of {mean} and a standard deviation of {sd}: a model must err less than the reference (predict the mean) to be useful.", fr: "La cible a une moyenne de {mean} et un écart-type de {sd} : un modèle doit se tromper moins que la référence (prédire la moyenne) pour être utile."}
    attention: {en: "This is a look at the target: it is counted.", fr: "C'est un regard sur la cible : il est compté."}
  target_balance:
    title: {en: "The outcome on the development rows", fr: "La cible sur les lignes de développement"}
    why: {en: "The share of positive rows is what a model that does not rank would find: every rule is compared with it.", fr: "La part de lignes positives est ce que trouverait un modèle qui ne classe pas : chaque règle est comparée à elle."}
    read:
      - {en: "Compare the two bars: positive and other outcome.", fr: "Comparez les deux barres : positive et autre issue."}
    conclude: {en: "The positive outcome occurs in {rate} of the rows.", fr: "L'issue positive survient dans {rate} des lignes."}
    attention: {en: "This is a look at the target: it is counted.", fr: "C'est un regard sur la cible : il est compté."}
  special_values:
    title: {en: "The special values", fr: "Les valeurs spéciales"}
    why: {en: "A special value (a code that means \"unknown\" or \"never\") is not an ordinary number: the table says how often each occurs and what the target looks like there.", fr: "Une valeur spéciale (un code qui veut dire « inconnu » ou « jamais ») n'est pas un nombre ordinaire : le tableau dit combien de fois chacune survient et à quoi ressemble la cible à cet endroit."}
    read:
      - {en: "Read each special value and its count of rows.", fr: "Lisez chaque valeur spéciale et son nombre de lignes."}
    conclude: {en: "The special values become indicator columns in the model, never ordinary numbers.", fr: "Les valeurs spéciales deviennent des colonnes indicatrices dans le modèle, jamais des nombres ordinaires."}
    attention: {en: "A small count is noisy: do not read its target alone.", fr: "Un petit compte est bruité : n'en lisez pas la cible seule."}
  by_group:
    title: {en: "The target by group", fr: "La cible par groupe"}
    why: {en: "It answers \"does the target differ across the groups of one column, more than chance alone would draw?\".", fr: "Il répond à « la cible diffère-t-elle d'un groupe à l'autre d'une colonne, plus que le hasard seul ne le dessinerait ? »."}
    read:
      - {en: "Each dot is a group, with its interval; the shaded band is what shuffling the target draws.", fr: "Chaque point est un groupe, avec son intervalle ; la bande grisée est ce que dessine un mélange de la cible."}
      - {en: "A dot outside its band is unlikely to be chance alone.", fr: "Un point hors de sa bande a peu de chances d'être dû au seul hasard."}
    conclude: {en: "The groups are read against the overall value, the dashed line.", fr: "Les groupes se lisent par rapport à la valeur d'ensemble, la ligne pointillée."}
    attention: {en: "An association between groups, not an effect of the variable; and each such chart is one more look.", fr: "Une association entre groupes, pas un effet de la variable ; et chaque graphique de ce type est un regard de plus."}
  distribution:
    title: {en: "The distribution of one column", fr: "La distribution d'une colonne"}
    why: {en: "The shape of a column decides its preparation: a skewed column may need a logarithm, a special value its own indicator.", fr: "La forme d'une colonne décide de sa préparation : une colonne asymétrique peut demander un logarithme, une valeur spéciale sa propre indicatrice."}
    read:
      - {en: "Each bar is a bin or a group; its length is the share of the rows.", fr: "Chaque barre est une tranche ou un groupe ; sa longueur est la part des lignes."}
    conclude: {en: "The column is read on {rows} development rows, without the target.", fr: "La colonne est lue sur {rows} lignes de développement, sans la cible."}
    attention: {en: "Logarithmic bins are not of equal width: compare counts, not widths.", fr: "Des tranches logarithmiques n'ont pas la même largeur : comparez des comptes, pas des largeurs."}
  correlation:
    title: {en: "The associations between the predictors", fr: "Les liens entre les prédicteurs"}
    why: {en: "Two predictors that carry nearly the same information make the coefficients unstable; the matrix finds them without reading the target.", fr: "Deux prédicteurs qui portent presque la même information rendent les coefficients instables ; la matrice les trouve sans lire la cible."}
    read:
      - {en: "A darker cell is a stronger association; an outlined cell reaches the collinearity level.", fr: "Une case plus foncée est un lien plus fort ; une case encadrée atteint le seuil de colinéarité."}
    conclude: {en: "The flagged pairs are listed under the matrix with their value.", fr: "Les paires signalées sont listées sous la matrice avec leur valeur."}
    attention: {en: "A strong association between predictors says nothing about the target.", fr: "Un lien fort entre prédicteurs ne dit rien de la cible."}
  looks:
    title: {en: "The look counter", fr: "Le compteur de regards"}
    why: {en: "Each reading of the target is a chance to fit these rows only. The counter makes the number of looks visible, activity by activity.", fr: "Chaque lecture de la cible est une occasion de s'ajuster à ces seules lignes. Le compteur rend le nombre de regards visible, activité par activité."}
    read:
      - {en: "Each bar is one activity that read the target; its length is its number of looks.", fr: "Chaque barre est une activité qui a lu la cible ; sa longueur est son nombre de regards."}
    conclude: {en: "{looks} looks at the target in all.", fr: "{looks} regards sur la cible en tout."}
    attention: {en: "The diagnostics of the models count as looks too: they read the target of the development rows.", fr: "Les diagnostics des modèles comptent aussi comme des regards : ils lisent la cible des lignes de développement."}
  models_table:
    title: {en: "The models side by side", fr: "Les modèles côte à côte"}
    why: {en: "It puts the configurations on the same measures, to answer \"by how much does each one do better than the reference, and does it err in one direction rather than the other?\".", fr: "Il met les configurations sur les mêmes mesures, pour répondre à « de combien chacune fait-elle mieux que la référence, et se trompe-t-elle dans un sens plutôt que dans l'autre ? »."}
    read:
      - {en: "Read the first error column: the smaller, the better.", fr: "Lisez la première colonne d'erreur : plus petite, mieux c'est."}
      - {en: "Read the mean residual: near zero, the model is not biased overall.", fr: "Lisez le résidu moyen : près de zéro, le modèle n'est pas biaisé dans l'ensemble."}
    conclude: {en: "The candidate errs by {mae_model} on average, against {mae_base} for the reference.", fr: "Le candidat se trompe de {mae_model} en moyenne, contre {mae_base} pour la référence."}
    conclude_diag: {en: "{model}, shown in detail below, errs by {mae_model} on average; the other rows compare the variants on the same predictions.", fr: "{model}, montré en détail ci-dessous, se trompe en moyenne de {mae_model} ; les autres lignes comparent les variantes sur les mêmes prédictions."}
    conclude_binary: {en: "{model}, shown in detail below, ranks the rows with an AUC of {auc}; the other rows compare the variants on the same predictions.", fr: "{model}, montré en détail ci-dessous, classe les lignes avec une AUC de {auc} ; les autres lignes comparent les variantes sur les mêmes prédictions."}
    attention: {en: "These figures were used to choose: they are optimistic.", fr: "Ces chiffres ont servi à choisir : ils sont optimistes."}
  fits:
    title: {en: "The fitted models", fr: "Les modèles ajustés"}
    why: {en: "It lists each fitted configuration with its recorded figures, so the diagnostics and the choice can be followed back to them.", fr: "Il liste chaque configuration ajustée avec ses chiffres enregistrés, pour que les diagnostics et le choix puissent y être rapportés."}
    read:
      - {en: "One block per model: what it read, then its figures.", fr: "Un bloc par modèle : ce qu'il a lu, puis ses chiffres."}
    conclude: {en: "The candidate errs by {mae_model} on average, against {mae_base} for the reference.", fr: "Le candidat se trompe de {mae_model} en moyenne, contre {mae_base} pour la référence."}
    conclude_binary: {en: "The candidate ranks the rows with an AUC of {auc}; the reference does not rank.", fr: "Le candidat classe les lignes avec une AUC de {auc} ; la référence ne classe pas."}
    conclude_generic: {en: "Each model is recorded with the rows it read and its figures; the comparison comes in the next chapter.", fr: "Chaque modèle est enregistré avec les lignes qu'il a lues et ses chiffres ; la comparaison vient au chapitre suivant."}
    attention: {en: "These figures were used to choose: they are optimistic.", fr: "Ces chiffres ont servi à choisir : ils sont optimistes."}
  residuals_scatter:
    title: {en: "Residuals against the prediction", fr: "Résidus en fonction de la prédiction"}
    why: {en: "An error that grows or shifts with the prediction says where the model is weak; the mean error alone hides it.", fr: "Une erreur qui grandit ou se décale avec la prédiction dit où le modèle est faible ; l'erreur moyenne seule le cache."}
    read:
      - {en: "Each point is a row: above the zero line, the model predicted too low; below, too high.", fr: "Chaque point est une ligne : au-dessus de la ligne zéro, le modèle a prédit trop bas ; en dessous, trop haut."}
      - {en: "The line is the mean residual of each bin of predictions.", fr: "La courbe est le résidu moyen de chaque tranche de prédictions."}
    conclude_flagged: {en: "The size of the error grows with the prediction (rank correlation {corr}): one width of interval would be wrong for every row.", fr: "La taille de l'erreur grandit avec la prédiction (corrélation de rang {corr}) : une même largeur d'intervalle serait fausse pour chaque ligne."}
    conclude: {en: "The size of the error does not clearly change with the prediction (rank correlation {corr}).", fr: "La taille de l'erreur ne change pas nettement avec la prédiction (corrélation de rang {corr})."}
    attention: {en: "Only a sample of the rows is drawn; the line and the correlation use them all.", fr: "Seul un échantillon des lignes est dessiné ; la courbe et la corrélation les utilisent toutes."}
  observed:
    title: {en: "Predicted against observed values", fr: "Valeurs prédites en fonction des valeurs observées"}
    why: {en: "The mean absolute error is the mean distance of these points to the diagonal: this chart makes the figure visible.", fr: "L'erreur absolue moyenne est la distance moyenne de ces points à la diagonale : ce graphique rend le chiffre visible."}
    read:
      - {en: "On the diagonal, a perfect prediction.", fr: "Sur la diagonale, une prédiction parfaite."}
      - {en: "A cloud that bends away from the diagonal shows a shape the model does not follow.", fr: "Un nuage qui s'écarte de la diagonale montre une forme que le modèle ne suit pas."}
    conclude: {en: "On average the points are {mae} away from the diagonal: the mean absolute error.", fr: "En moyenne, les points sont à {mae} de la diagonale : l'erreur absolue moyenne."}
    attention: {en: "A point far from the diagonal is one row: the table of the largest errors names them.", fr: "Un point loin de la diagonale est une ligne : le tableau des plus grandes erreurs les nomme."}
  qq:
    title: {en: "Are the residuals normal?", fr: "Les résidus sont-ils normaux ?"}
    why: {en: "Prediction intervals would assume normal residuals; the mean error and the coefficients do not need it with this many rows.", fr: "Des intervalles de prédiction supposeraient des résidus normaux ; l'erreur moyenne et les coefficients n'en ont pas besoin avec autant de lignes."}
    read:
      - {en: "On the diagonal, residuals as a normal distribution would draw them.", fr: "Sur la diagonale, des résidus tels qu'une loi normale les dessinerait."}
      - {en: "Points that leave the diagonal at the ends show heavier tails.", fr: "Des points qui quittent la diagonale aux extrémités montrent des queues plus lourdes."}
    conclude: {en: "Skewness {skew}, excess kurtosis {kurt}: both near zero for normal residuals.", fr: "Asymétrie {skew}, excès d'aplatissement {kurt} : les deux près de zéro pour des résidus normaux."}
    attention: {en: "This study gives no prediction interval: the chart is a check, not a requirement.", fr: "Cette étude ne donne pas d'intervalle de prédiction : le graphique est un contrôle, pas une exigence."}
  residual_summary:
    title: {en: "The distribution of the residuals", fr: "La distribution des résidus"}
    why: {en: "The mean residual is the bias; the spread says how far a typical error goes.", fr: "Le résidu moyen est le biais ; la dispersion dit jusqu'où va une erreur typique."}
    read:
      - {en: "Read the mean (bias), then the percentiles from left to right.", fr: "Lisez la moyenne (le biais), puis les percentiles de gauche à droite."}
    conclude: {en: "Bias {mean}, standard deviation {sd}.", fr: "Biais {mean}, écart-type {sd}."}
    attention: {en: "A bias near zero overall can hide opposite biases in two groups: read the residuals by variable.", fr: "Un biais proche de zéro dans l'ensemble peut cacher des biais opposés dans deux groupes : lisez les résidus par variable."}
  hetero:
    title: {en: "Does the error grow with the prediction?", fr: "L'erreur grandit-elle avec la prédiction ?"}
    why: {en: "An error that grows with the prediction makes one interval width wrong for every row; the flag summarises the residual chart.", fr: "Une erreur qui grandit avec la prédiction rend une même largeur d'intervalle fausse pour chaque ligne ; le signal résume le graphique des résidus."}
    read:
      - {en: "Read the flag, then its two figures: the rank correlation and the ratio of spreads.", fr: "Lisez le signal, puis ses deux chiffres : la corrélation de rang et le rapport des dispersions."}
    conclude_flagged: {en: "Flagged: the spread of the top third of the predictions is {ratio} times that of the bottom third.", fr: "Signalé : la dispersion du tiers haut des prédictions vaut {ratio} fois celle du tiers bas."}
    conclude: {en: "Not flagged: the spread ratio is {ratio}.", fr: "Non signalé : le rapport des dispersions vaut {ratio}."}
    attention: {en: "The mean error stays a fair summary even when the flag is raised.", fr: "L'erreur moyenne reste un résumé honnête même quand le signal est levé."}
  nonlinearity:
    title: {en: "Does the model follow the shape of {feature}?", fr: "Le modèle suit-il la forme de {feature} ?"}
    why: {en: "A linear model draws a straight line in each variable; when the true shape bends, the error is systematic from one range to the next.", fr: "Un modèle linéaire trace une droite dans chaque variable ; quand la vraie forme se courbe, l'erreur est systématique d'une tranche à l'autre."}
    read:
      - {en: "Each bar is one range of the variable; its length is the gap between the observed value and the mean prediction there.", fr: "Chaque barre est une tranche de la variable ; sa longueur est l'écart entre la valeur observée et la prédiction moyenne à cet endroit."}
      - {en: "The line spans plus or minus two standard errors: a bar whose line misses zero is a real gap.", fr: "Le trait couvre plus ou moins deux erreurs types : une barre dont le trait ne touche pas zéro est un vrai écart."}
    conclude: {en: "The shape of {feature} is flagged: the linear model does not follow it, which motivates a variant of another family.", fr: "La forme de {feature} est signalée : le modèle linéaire ne la suit pas, ce qui motive une variante d'une autre famille."}
    attention: {en: "A gap by range is an association given the model, not the effect of changing the variable.", fr: "Un écart par tranche est une association, pas l'effet d'un changement de la variable."}
  by_feature:
    title: {en: "Residuals by variable", fr: "Résidus par variable"}
    why: {en: "It answers \"is the error larger, or biased, in one group of a variable?\".", fr: "Il répond à « l'erreur est-elle plus grande, ou biaisée, dans un groupe d'une variable ? »."}
    read:
      - {en: "For each variable, read the mean residual of each group: far from zero is a bias in that group.", fr: "Pour chaque variable, lisez le résidu moyen de chaque groupe : loin de zéro, c'est un biais dans ce groupe."}
      - {en: "Skip the groups flagged as too small.", fr: "Laissez de côté les groupes signalés comme trop petits."}
    conclude: {en: "The largest bias in a group large enough to read is {bias} ({column} = {group}).", fr: "Le plus grand biais dans un groupe assez grand pour être lu vaut {bias} ({column} = {group})."}
    attention: {en: "Many groups, many chances: one extreme group among many can be chance.", fr: "Beaucoup de groupes, beaucoup de chances : un groupe extrême parmi beaucoup peut être dû au hasard."}
  coefficients:
    title: {en: "The model's weights, with their interval", fr: "Les poids du modèle, avec leur intervalle"}
    why: {en: "It answers \"which variables weigh most in the prediction, and is the sign of each weight certain?\".", fr: "Il répond à « quelles variables pèsent le plus dans la prédiction, et le signe de chaque poids est-il certain ? »."}
    read:
      - {en: "Each dot is a coefficient, its line the interval; the vertical line is zero.", fr: "Chaque point est un coefficient, son trait l'intervalle ; la ligne verticale est zéro."}
      - {en: "A line that does not cross zero gives a certain sign.", fr: "Un trait qui ne coupe pas zéro donne un signe certain."}
    conclude_excludes: {en: "The largest weight in size is {term}, {value} [{low}, {high}]: its interval excludes zero, so its sign is certain on these rows.", fr: "Le plus grand poids en taille est {term}, {value} [{low} ; {high}] : son intervalle exclut zéro, son signe est donc certain sur ces lignes."}
    conclude_includes: {en: "The largest weight in size is {term}, {value} [{low}, {high}]: its interval includes zero, so even its sign is uncertain.", fr: "Le plus grand poids en taille est {term}, {value} [{low} ; {high}] : son intervalle contient zéro, même son signe est donc incertain."}
    attention: {en: "Associations given the other variables, never effects of changing a variable; correlated predictors share their weight.", fr: "Des associations à variables égales, jamais des effets d'un changement de variable ; des prédicteurs liés se partagent leur poids."}
  largest:
    title: {en: "The largest errors", fr: "Les plus grandes erreurs"}
    why: {en: "The mean figures say how much the model errs; the largest errors say on which rows. The table answers \"who are the rows the model misses most, and do they have something in common?\".", fr: "Les chiffres moyens disent combien le modèle se trompe ; les plus grandes erreurs disent sur quelles lignes. Le tableau répond à « quelles sont les lignes que le modèle rate le plus, et ont-elles quelque chose en commun ? »."}
    read:
      - {en: "Read observed, predicted and the residual of each row; then its values.", fr: "Lisez observé, prédit et le résidu de chaque ligne ; puis ses valeurs."}
    conclude: {en: "The largest error is {residual}, on row {row}.", fr: "La plus grande erreur vaut {residual}, sur la ligne {row}."}
    attention: {en: "A few large errors weigh more in the RMSE than in the MAE.", fr: "Quelques grandes erreurs pèsent plus dans la RMSE que dans la MAE."}
  confusion:
    title: {en: "The confusion matrix at the rule", fr: "La matrice de confusion à la règle"}
    why: {en: "It counts, at the rule, the positive rows found, the positive rows missed, and the selected rows that were not positive.", fr: "Elle compte, à la règle, les lignes positives trouvées, les positives manquées, et les lignes sélectionnées qui n'étaient pas positives."}
    read:
      - {en: "Read the selected column: positive rows found, then negative rows selected.", fr: "Lisez la colonne sélectionnée : les positives trouvées, puis les négatives sélectionnées."}
    conclude: {en: "Precision {precision}, recall {recall} at the rule.", fr: "Précision {precision}, rappel {recall} à la règle."}
    attention: {en: "A tie at the cut is counted pro rata: some counts are expected counts.", fr: "Un ex aequo au seuil est compté au prorata : certains comptes sont des comptes attendus."}
  gain:
    title: {en: "The gain curve", fr: "La courbe de gain"}
    why: {en: "If the team acts on the best-scored rows first, what share of all positive rows does it find? The curve answers for every share acted on.", fr: "Si l'équipe agit d'abord sur les lignes les mieux notées, quelle part de toutes les positives trouve-t-elle ? La courbe répond pour chaque part traitée."}
    read:
      - {en: "The diagonal is acting at random; the higher the curve, the better the ranking.", fr: "La diagonale correspond à agir au hasard ; plus la courbe est haute, meilleur est le classement."}
    conclude: {en: "AUC {auc}: the chance that a positive row is scored above a negative one.", fr: "AUC {auc} : la chance qu'une ligne positive soit notée au-dessus d'une négative."}
    attention: {en: "A good ranking overall does not say the rule is well placed.", fr: "Un bon classement dans l'ensemble ne dit pas que la règle est bien placée."}
  calibration:
    title: {en: "Calibration", fr: "Calibration"}
    why: {en: "When the model gives rows a score, do about that share of them turn out positive?", fr: "Quand le modèle donne un score à des lignes, à peu près cette part d'entre elles est-elle positive ?"}
    read:
      - {en: "On the diagonal, a score that reads as a probability.", fr: "Sur la diagonale, un score qui se lit comme une probabilité."}
    conclude: {en: "Brier score {brier}, against {brier_base} for the constant base rate (lower is better).", fr: "Score de Brier {brier}, contre {brier_base} pour le taux de base constant (plus bas, mieux c'est)."}
    attention: {en: "A ranking can be good with scores that are not probabilities.", fr: "Un classement peut être bon avec des scores qui ne sont pas des probabilités."}
  segments:
    title: {en: "Precision and recall by segment", fr: "Précision et rappel par segment"}
    why: {en: "It answers \"does the rule work as well in every segment?\".", fr: "Il répond à « la règle marche-t-elle aussi bien dans chaque segment ? »."}
    read:
      - {en: "Read each segment's precision and recall with its interval; skip the small cells.", fr: "Lisez la précision et le rappel de chaque segment avec son intervalle ; laissez de côté les petites cases."}
    conclude: {en: "The segments are chosen by the engine; their intervals say how far each figure can move.", fr: "Les segments sont choisis par le moteur ; leurs intervalles disent jusqu'où chaque chiffre peut bouger."}
    attention: {en: "Many segments, many chances: an extreme one among many can be chance.", fr: "Beaucoup de segments, beaucoup de chances : un segment extrême parmi beaucoup peut être dû au hasard."}
  examples:
    title: {en: "Examples of errors", fr: "Exemples d'erreurs"}
    why: {en: "Average figures hide the rows; the examples show the rows the rule got wrong.", fr: "Les chiffres moyens cachent les lignes ; les exemples montrent les lignes que la règle a ratées."}
    read:
      - {en: "Read the score and the values of each row.", fr: "Lisez le score et les valeurs de chaque ligne."}
    conclude: {en: "The examples are listed in score order.", fr: "Les exemples sont listés dans l'ordre des scores."}
    attention: {en: "A few examples are not a pattern.", fr: "Quelques exemples ne font pas un motif."}
  fold_lines:
    title: {en: "The configurations, fold by fold", fr: "Les configurations, pli par pli"}
    why: {en: "A mean over folds hides how each configuration does fold by fold; comparing the lines on the same folds shows whether a gap is steady or the work of one fold.", fr: "Une moyenne sur les plis cache ce que fait chaque configuration pli par pli ; comparer les lignes sur les mêmes plis montre si un écart est régulier ou l'œuvre d'un seul pli."}
    read:
      - {en: "Each line is one configuration; each point its score on one fold.", fr: "Chaque ligne est une configuration ; chaque point son score sur un pli."}
      - {en: "Lines that keep their order on every fold show a steady gap.", fr: "Des lignes qui gardent leur ordre sur chaque pli montrent un écart régulier."}
    conclude: {en: "The best mean is {best} ({best_mean}); the candidate's is {candidate_mean}.", fr: "La meilleure moyenne est celle de {best} ({best_mean}) ; celle du candidat vaut {candidate_mean}."}
    attention: {en: "A gap in the mean can be the work of one fold: the noise between folds is the scale to judge it, and the paired differences of the choice chapter are sharper.", fr: "Un écart de moyenne peut être l'œuvre d'un seul pli : le bruit entre les plis est l'échelle pour le juger, et les écarts appariés du chapitre du choix sont plus fins."}
    attention_noise: {en: "The gaps between the configurations stay within the noise between folds (the advice of the comparison): no configuration is told apart from the candidate on these folds.", fr: "Les écarts entre les configurations restent dans le bruit entre les plis (le conseil de la comparaison) : aucune configuration ne se distingue du candidat sur ces plis."}
  variants:
    title: {en: "The configurations compared", fr: "Les configurations comparées"}
    why: {en: "It answers \"which configuration has the best mean, and is the gap larger than the noise between folds?\".", fr: "Il répond à « quelle configuration a la meilleure moyenne, et l'écart dépasse-t-il le bruit entre les plis ? »."}
    read:
      - {en: "Read the mean and its standard error, then the difference with the candidate and its interval.", fr: "Lisez la moyenne et son erreur type, puis l'écart avec le candidat et son intervalle."}
      - {en: "The last column says whether each configuration is within one standard error of the best.", fr: "La dernière colonne dit si chaque configuration est à moins d'une erreur type de la meilleure."}
    conclude: {en: "The one-standard-error rule keeps {pick}; the best mean is {best}.", fr: "La règle d'une erreur type retient {pick} ; la meilleure moyenne est celle de {best}."}
    conclude_generic: {en: "Each configuration is listed with what it asks; the comparison fold by fold appears once the variants are evaluated.", fr: "Chaque configuration est listée avec ce qu'elle demande ; la comparaison pli par pli apparaît une fois les variantes évaluées."}
    attention: {en: "Each variant is one more trial on the same rows: the best one owes a little to chance (the approximate optimism).", fr: "Chaque variante est un essai de plus sur les mêmes lignes : la meilleure doit un peu au hasard (l'optimisme approximatif)."}
  errors_bar:
    title: {en: "The errors, and the criterion's bar", fr: "Les erreurs, et la barre du critère"}
    why: {en: "The verdict comes down to one question: do the models get under the bar fixed before seeing them? This figure puts the mean errors on one ruler, with the bar, so the answer can be read at a glance.", fr: "Le verdict tient en une question : les modèles passent-ils sous la barre fixée avant de les voir ? Cette figure pose les erreurs moyennes sur une même règle, avec la barre, pour que la réponse se lise d'un coup d'œil."}
    read:
      - {en: "Find the dashed red line: the bar. To its left, in the green, a model meets the criterion.", fr: "Repérez le pointillé rouge : la barre. À sa gauche, dans le vert, un modèle atteint le critère."}
      - {en: "Read each dot: the further left, the smaller the mean error.", fr: "Lisez chaque point : plus il est à gauche, plus l'erreur moyenne est petite."}
      - {en: "Look at the lines: if they overlap, the models are not clearly told apart on this chart alone.", fr: "Regardez les traits : s'ils se chevauchent, les modèles ne se distinguent pas nettement sur ce seul graphique."}
    conclude: {en: "The candidate errs by {mae_model} against {mae_base} for the reference; the criterion ({criterion}) is {status}.", fr: "Le candidat se trompe de {mae_model} contre {mae_base} pour la référence ; le critère ({criterion}) est {status}."}
    attention: {en: "These figures were used to choose. Overlapping intervals do not prove two models are equal: the paired differences of the model choice chapter are sharper.", fr: "Ces chiffres ont servi à choisir. Des intervalles qui se chevauchent ne prouvent pas que deux modèles se valent : les écarts appariés du chapitre du choix sont plus fins."}
    bar_note: {en: "The bar is drawn at the reference's error reduced by the criterion's share; its position is computed for the drawing only.", fr: "La barre est dessinée à l'erreur de la référence diminuée de la part du critère ; sa position est calculée pour le dessin seulement."}
  paired:
    title: {en: "The paired differences", fr: "Les écarts appariés"}
    why: {en: "Two models are compared on the same rows: the difference of their errors, row by row, with a bootstrap interval, is the sharpest evidence of the choice.", fr: "Deux modèles sont comparés sur les mêmes lignes : l'écart de leurs erreurs, ligne par ligne, avec un intervalle bootstrap, est la preuve la plus fine du choix."}
    read:
      - {en: "Left of zero, the first model errs less; right of zero, more.", fr: "À gauche de zéro, le premier modèle se trompe moins ; à droite, plus."}
      - {en: "An interval that does not cross zero is a gap the drawing of the rows does not explain.", fr: "Un intervalle qui ne coupe pas zéro est un écart que le tirage des lignes n'explique pas."}
    conclude: {en: "Against the reference, the candidate's difference is {delta} [{low}, {high}].", fr: "Face à la référence, l'écart du candidat vaut {delta} [{low} ; {high}]."}
    attention: {en: "A gap can be real and small: compare it with the size of the error, not only with zero.", fr: "Un écart peut être réel et petit : comparez-le à la taille de l'erreur, pas seulement à zéro."}
    tension: {en: "Tension: the one-standard-error rule keeps {pick} for its simplicity, while the paired difference shows {other} better by {gap} with an interval [{low}, {high}] that excludes zero. Both are true: the gap is real on these rows but smaller than the noise between folds. The choice is a trade-off to state in your words.", fr: "Tension : la règle d'une erreur type garde {pick} pour sa simplicité, alors que l'écart apparié montre {other} meilleure de {gap}, avec un intervalle [{low} ; {high}] qui exclut zéro. Les deux sont vrais : l'écart est réel sur ces lignes mais plus petit que le bruit entre les plis. Le choix est un arbitrage à dire avec vos mots."}
  residual_boxes:
    title: {en: "The distribution of each model's residuals", fr: "La distribution des résidus de chaque modèle"}
    why: {en: "Two models with close mean errors can err differently: the boxes show, model by model, how wide and how shifted the errors are.", fr: "Deux modèles d'erreurs moyennes proches peuvent se tromper différemment : les boîtes montrent, modèle par modèle, la largeur et le décalage des erreurs."}
    read:
      - {en: "The box holds the middle half of the residuals, the thick line is the median, the whiskers go from the fifth to the ninety-fifth percentile.", fr: "La boîte contient la moitié centrale des résidus, le trait épais est la médiane, les moustaches vont du cinquième au quatre-vingt-quinzième percentile."}
      - {en: "A box away from the zero line is a biased model on these rows.", fr: "Une boîte écartée de la ligne zéro est un modèle biaisé sur ces lignes."}
    conclude: {en: "The candidate's middle half of the residuals spans {q25} to {q75}; the reference's spans {base_q25} to {base_q75}.", fr: "La moitié centrale des résidus du candidat va de {q25} à {q75} ; celle de la référence va de {base_q25} à {base_q75}."}
    attention: {en: "A narrower box does not mean a smaller mean error when the tails differ: read the boxes with the paired differences.", fr: "Une boîte plus étroite ne veut pas dire une erreur moyenne plus petite quand les queues diffèrent : lisez les boîtes avec les écarts appariés."}
  residual_by_period:
    title: {en: "Does the error drift with {column}?", fr: "L'erreur dérive-t-elle avec {column} ?"}
    why: {en: "A model fitted on all the periods can still err in one direction on the recent ones: the mean residual by period shows a drift.", fr: "Un modèle ajusté sur toutes les périodes peut encore se tromper dans un sens sur les plus récentes : le résidu moyen par période montre une dérive."}
    read:
      - {en: "One row per period, one bar per model: to the right, the model predicted too low.", fr: "Une ligne par période, une barre par modèle : à droite, le modèle a prédit trop bas."}
      - {en: "Bars that move steadily from one side to the other across periods show a drift.", fr: "Des barres qui passent régulièrement d'un côté à l'autre au fil des périodes montrent une dérive."}
    conclude: {en: "The candidate's mean residual goes from {first} in the first period to {last} in the last.", fr: "Le résidu moyen du candidat passe de {first} sur la première période à {last} sur la dernière."}
    attention: {en: "A period with few rows is noisy; and a final test drawn without order cannot confirm a drift.", fr: "Une période avec peu de lignes est bruitée ; et un test final tiré sans ordre ne peut pas confirmer une dérive."}
  comparison:
    title: {en: "The comparison table", fr: "Le tableau de comparaison"}
    why: {en: "It gathers the recorded comparison: the errors with their intervals and the paired differences, every number cited.", fr: "Il rassemble la comparaison enregistrée : les erreurs avec leurs intervalles et les écarts appariés, chaque nombre cité."}
    read:
      - {en: "Read each model's error and interval, then the paired differences below.", fr: "Lisez l'erreur de chaque modèle et son intervalle, puis les écarts appariés dessous."}
    conclude: {en: "The candidate's difference with the reference is {delta}.", fr: "L'écart du candidat avec la référence vaut {delta}."}
    attention: {en: "Every figure here was used to choose.", fr: "Chaque chiffre ici a servi à choisir."}
  policy:
    title: {en: "The rules compared", fr: "Les règles comparées"}
    why: {en: "A rule turns scores into actions; the table compares, at each rule, what the model finds against the baseline, with intervals.", fr: "Une règle transforme les scores en actions ; le tableau compare, à chaque règle, ce que le modèle trouve face à la référence, avec des intervalles."}
    read:
      - {en: "Read the precision of the model and of the baseline at each rule.", fr: "Lisez la précision du modèle et de la référence à chaque règle."}
      - {en: "Then the paired gain, with its interval.", fr: "Puis le gain apparié, avec son intervalle."}
    conclude: {en: "At the rule of the criterion, the model's precision is {precision} against {base_precision} for the baseline.", fr: "À la règle du critère, la précision du modèle vaut {precision} contre {base_precision} pour la référence."}
    attention: {en: "The rule was chosen on these rows: its figures are optimistic.", fr: "La règle a été choisie sur ces lignes : ses chiffres sont optimistes."}
  selection:
    title: {en: "Positive rows found at each rule", fr: "Lignes positives trouvées à chaque règle"}
    why: {en: "Among the rows each rule selects, how many positive rows does the model find, compared with the baseline?", fr: "Parmi les lignes que chaque règle sélectionne, combien de positives le modèle trouve-t-il, face à la référence ?"}
    read:
      - {en: "For each rule, compare the model's bar with the baseline's.", fr: "Pour chaque règle, comparez la barre du modèle à celle de la référence."}
    conclude: {en: "The gap between the bars is what ranking adds over acting at random.", fr: "L'écart entre les barres est ce que le classement ajoute par rapport à agir au hasard."}
    attention: {en: "The counts are optimistic: the rule was chosen on these rows.", fr: "Les comptes sont optimistes : la règle a été choisie sur ces lignes."}
  final_state:
    title: {en: "What is sealed, and what the opening will fill", fr: "Ce qui est scellé, et ce que l'ouverture remplira"}
    title_opened: {en: "The final test, opened once", fr: "Le test final, ouvert une fois"}
    why: {en: "It answers \"what does the study know about the final test right now?\".", fr: "Il répond à « que sait l'étude du test final en ce moment ? »."}
    read:
      - {en: "Read the rows set aside, then the rows read so far.", fr: "Lisez les lignes mises de côté, puis les lignes lues jusqu'ici."}
    read_opened:
      - {en: "Read the rows set aside, then the one evaluation that read them.", fr: "Lisez les lignes mises de côté, puis la seule évaluation qui les a lues."}
    conclude_sealed: {en: "{sealed} rows are sealed and none is read: no final figure exists yet.", fr: "{sealed} lignes sont scellées et aucune n'est lue : aucun chiffre final n'existe encore."}
    conclude_opened: {en: "The final test was opened once, on {n} rows.", fr: "Le test final a été ouvert une fois, sur {n} lignes."}
    attention: {en: "The automatic mode never opens the final test, except in the demonstration mode, marked as such for good.", fr: "Le mode automatique n'ouvre jamais le test final, sauf en mode démonstration, marqué comme tel pour de bon."}
  versus:
    title: {en: "Development evidence and final evidence, side by side", fr: "Preuve de développement et preuve finale, côte à côte"}
    why: {en: "The development figures helped choose; the final figure did not. Side by side, they show how much the choice flattered itself.", fr: "Les chiffres de développement ont aidé à choisir ; le chiffre final non. Côte à côte, ils montrent combien le choix s'est flatté."}
    read:
      - {en: "Compare each measure across the two columns.", fr: "Comparez chaque mesure entre les deux colonnes."}
    conclude: {en: "The final column is the only independent evidence.", fr: "La colonne finale est la seule preuve indépendante."}
    attention: {en: "A final test of few rows has a wide interval: a gap between the columns can be chance.", fr: "Un test final de peu de lignes a un intervalle large : un écart entre les colonnes peut être dû au hasard."}
  limits:
    title: {en: "What is not yet defensible", fr: "Ce qui n'est pas encore défendable"}
    why: {en: "Before concluding, we need to know what is missing. The list answers \"what prevents defending this study today, and what will remain a limit even after?\".", fr: "Avant de conclure, il faut savoir ce qui manque. La liste répond à « qu'est-ce qui empêche aujourd'hui de défendre cette étude, et qu'est-ce qui restera une limite même après ? »."}
    read:
      - {en: "Read each item: some disappear with a decision in your words, others stay attached to the conclusion.", fr: "Lisez chaque point : certains disparaissent avec une décision prise avec vos mots, d'autres restent attachés à la conclusion."}
    conclude: {en: "{n} limits are recorded.", fr: "{n} limites sont enregistrées."}
    attention: {en: "An empty list would not make the study causal: it ranks or estimates, nothing more.", fr: "Une liste vide ne rendrait pas l'étude causale : elle classe ou estime, rien de plus."}
  evidence_table:
    title: {en: "Development and final test, configuration by configuration", fr: "Développement et test final, configuration par configuration"}
    why: {en: "The development figures helped choose; the final figure did not. One table puts each configuration on the same line in both frames, so the gap between them reads at a glance.", fr: "Les chiffres de développement ont aidé à choisir ; le chiffre final non. Un seul tableau met chaque configuration sur la même ligne dans les deux cadres, pour lire l'écart d'un coup d'œil."}
    read:
      - {en: "Find the highlighted row: the configuration carried to the final test.", fr: "Repérez la ligne surlignée : la configuration portée au test final."}
      - {en: "Compare its two columns: development (used to choose, optimistic) and final test (read once).", fr: "Comparez ses deux colonnes : développement (a servi à choisir, optimiste) et test final (lu une fois)."}
      - {en: "Read the last two rows: the paired difference with the reference, then the criterion judged on the final test.", fr: "Lisez les deux dernières lignes : l'écart apparié avec la référence, puis le critère jugé sur le test final."}
    conclude: {en: "On the final test, the chosen configuration errs by {final} against {base} for the reference; the criterion is {status}.", fr: "Sur le test final, la configuration choisie se trompe de {final} contre {base} pour la référence ; le critère est {status}."}
    conclude_sealed: {en: "The final test is still sealed: only the development column is filled, and it is not a final result.", fr: "Le test final est encore scellé : seule la colonne de développement est remplie, et ce n'est pas un résultat final."}
    attention: {en: "The other configurations have no final figure on purpose: measuring them there would turn the final test into a second selection.", fr: "Les autres configurations n'ont pas de chiffre final, exprès : les y mesurer ferait du test final une seconde sélection."}
  evidence_dots:
    title: {en: "Development and final errors on one scale", fr: "Erreurs de développement et finales sur une même échelle"}
    why: {en: "The table's values drawn: each configuration's error in development and, for the chosen one and the reference, on the final test, with the criterion's bound on the final test.", fr: "Les valeurs du tableau dessinées : l'erreur de chaque configuration en développement et, pour la configuration choisie et la référence, sur le test final, avec la borne du critère sur le test final."}
    read:
      - {en: "Find the dashed line: left of it, an error meets the criterion on the final test.", fr: "Repérez le pointillé : à sa gauche, une erreur atteint le critère sur le test final."}
      - {en: "For each configuration, compare the open dot (development) with the filled dot (final test).", fr: "Pour chaque configuration, comparez le point creux (développement) au point plein (test final)."}
      - {en: "Look at the lines: overlapping intervals are not told apart on this chart alone.", fr: "Regardez les traits : des intervalles qui se chevauchent ne se distinguent pas sur ce seul graphique."}
    conclude: {en: "The chosen configuration errs by {dev} in development and {final} on the final test, the reference by {base}.", fr: "La configuration choisie se trompe de {dev} en développement et de {final} sur le test final, la référence de {base}."}
    attention: {en: "A final test of few rows has a wide interval: a gap between development and final can be chance.", fr: "Un test final de peu de lignes a un intervalle large : un écart entre développement et final peut être dû au hasard."}
  criterion_final:
    title: {en: "The criterion, judged on the final test", fr: "Le critère, jugé sur le test final"}
    why: {en: "The conclusion rests on one question fixed before any model: does the chosen model reduce the reference's error on the final test by at least the minimum?", fr: "La conclusion repose sur une question fixée avant tout modèle : le modèle choisi réduit-il l'erreur de la référence sur le test final d'au moins le minimum ?"}
    read:
      - {en: "Find the dashed line: the minimum fixed before any model.", fr: "Repérez le pointillé : le minimum fixé avant tout modèle."}
      - {en: "Read the dot and its line: the reduction on the final test and its interval.", fr: "Lisez le point et son trait : la réduction sur le test final et son intervalle."}
    conclude: {en: "The error on the final test is reduced by {gain} [{low}, {high}] against a minimum of {minimum}: the criterion is {status}.", fr: "L'erreur sur le test final est réduite de {gain} [{low} ; {high}] face à un minimum de {minimum} : le critère est {status}."}
    attention: {en: "Met on the final test does not promise the same error on future rows: the final rows come from the same file and the same period.", fr: "Atteint sur le test final ne promet pas la même erreur sur de futures lignes : les lignes finales viennent du même fichier et de la même période."}
  cv_rotation:
    title: {en: "Each fold, predicted by a model fitted on the others", fr: "Chaque pli, prédit par un modèle ajusté sur les autres"}
    why: {en: "It shows how cross-validation reuses the rows: each fold is predicted once, by a model that never saw it.", fr: "Il montre comment la validation croisée réutilise les lignes : chaque pli est prédit une fois, par un modèle qui ne l'a jamais vu."}
    read:
      - {en: "Read one line: the green block is predicted, the blue blocks fit the model.", fr: "Lisez une ligne : le bloc vert est prédit, les blocs bleus ajustent le modèle."}
      - {en: "Go down the lines: the green block moves, so every row is predicted once.", fr: "Descendez les lignes : le bloc vert se déplace, donc chaque ligne est prédite une fois."}
    conclude: {en: "{folds} models are fitted, each predicting one fold of the {dev} development rows.", fr: "{folds} modèles sont ajustés, chacun prédisant un pli des {dev} lignes de développement."}
    attention: {en: "Under a time order, the early folds are predicted by models fitted on later years too: a forecast would only use the past.", fr: "Sous un ordre temporel, les premiers plis sont prédits par des modèles ajustés aussi sur des années postérieures : une prévision n'utiliserait que le passé."}
  column_view:
    title: {en: "The quality check, column by column", fr: "Le contrôle de qualité, colonne par colonne"}
    why: {en: "The preparation is decided from these figures: missing cells, extreme values and skewed columns. A column left unchanged is backed by the same figures as a column transformed.", fr: "La préparation se décide sur ces chiffres : cellules manquantes, valeurs extrêmes et colonnes asymétriques. Une colonne laissée telle quelle s'appuie sur les mêmes chiffres qu'une colonne transformée."}
    read:
      - {en: "Read the missing column: a bar only where cells are missing.", fr: "Lisez la colonne des manquantes : une barre seulement là où des cellules manquent."}
      - {en: "Read each range: a median far from the middle of the band means a skewed column.", fr: "Lisez chaque étendue : une médiane loin du milieu de la bande signale une colonne asymétrique."}
      - {en: "Compare the skewness bars: the longest is the most skewed column.", fr: "Comparez les barres d'asymétrie : la plus longue est la colonne la plus asymétrique."}
    conclude: {en: "{rows_missing} development rows have at least one missing cell, out of {rows}.", fr: "{rows_missing} lignes de développement ont au moins une cellule manquante, sur {rows}."}
    attention: {en: "A value coded by a marker (a question mark, a sentinel value) is missing even when the cell is not empty.", fr: "Une valeur codée par un marqueur (un point d'interrogation, une valeur sentinelle) est manquante même quand la case n'est pas vide."}
  pipeline:
    title: {en: "The preparation, step by step", fr: "La préparation, étape par étape"}
    why: {en: "It answers \"what happens to each column before the model sees it, and from which rows is each step learnt?\".", fr: "Il répond à « qu'arrive-t-il à chaque colonne avant que le modèle la voie, et sur quelles lignes chaque étape est-elle apprise ? »."}
    read:
      - {en: "Follow the arrows: a column goes through each step in this order.", fr: "Suivez les flèches : une colonne passe par chaque étape dans cet ordre."}
      - {en: "Read the verdicts below: each numeric column with what was done and the skewness behind it.", fr: "Lisez les verdicts dessous : chaque colonne numérique avec ce qui a été fait et l'asymétrie qui le fonde."}
    conclude: {en: "The preparation recorded: {preparation}.", fr: "La préparation enregistrée : {preparation}."}
    attention: {en: "A preparation chosen after reading the development rows makes the out-of-fold figures slightly optimistic; the final test is not affected.", fr: "Une préparation choisie après lecture des lignes de développement rend les chiffres hors pli un peu optimistes ; le test final n'est pas touché."}
  one_se:
    title: {en: "The one-standard-error rule, drawn", fr: "La règle d'une erreur type, dessinée"}
    why: {en: "The choice of the model follows a rule fixed in advance: among the configurations not told apart from the best, keep the simplest.", fr: "Le choix du modèle suit une règle fixée d'avance : parmi les configurations qu'on ne distingue pas de la meilleure, garder la plus simple."}
    read:
      - {en: "Find the green band: from the best mean to the best plus one standard error.", fr: "Repérez la bande verte : de la meilleure moyenne à la meilleure plus une erreur type."}
      - {en: "See which dots fall in it, then the ringed one: the simplest of them.", fr: "Voyez quels points y tombent, puis le point cerclé : le plus simple d'entre eux."}
    conclude: {en: "The best mean is {best}'s; the rule keeps {pick}, inside the band.", fr: "La meilleure moyenne est celle de {best} ; la règle garde {pick}, dans la bande."}
    attention: {en: "The fold standard errors ignore the overlap of the folds' fitting rows: the band is narrower than the true noise.", fr: "Les erreurs types des plis ignorent le recouvrement des lignes d'ajustement des plis : la bande est plus étroite que le vrai bruit."}
  exposure_timeline:
    title: {en: "What was read, and when", fr: "Ce qui a été lu, et quand"}
    why: {en: "The exposure ledger records every reading of the data. As a timeline, it shows that every choice came before the final test was opened.", fr: "Le registre d'exposition enregistre chaque lecture des données. En frise, il montre que chaque choix a précédé l'ouverture du test final."}
    read:
      - {en: "Read the lanes from top to bottom: structure, looks at the target, models, final test.", fr: "Lisez les lignes de haut en bas : structure, regards sur la cible, modèles, test final."}
      - {en: "Find the dashed line: the opening of the final test.", fr: "Repérez le pointillé : l'ouverture du test final."}
    conclude: {en: "The target was looked at {looks} times on the development rows, all before the final test was opened.", fr: "La cible a été regardée {looks} fois sur les lignes de développement, toutes avant l'ouverture du test final."}
    conclude_sealed: {en: "The target was looked at {looks} times on the development rows; the final test is still sealed.", fr: "La cible a été regardée {looks} fois sur les lignes de développement ; le test final est encore scellé."}
    attention: {en: "Changing the split later does not make the rows already read unseen.", fr: "Changer le découpage plus tard ne rend pas non vues les lignes déjà lues."}

# The words of the lesson report's own charts (render_charts).
charts:
  unit: {en: "Unit:", fr: "Unité :"}
  residual_boxes_question: {en: "How far from the observed value are the predictions of each model?", fr: "À quelle distance de la valeur observée sont les prédictions de chaque modèle ?"}
  residual_boxes_note: {en: "Residual: observed minus predicted. Line: from the fifth to the ninety-fifth percentile; box: the middle half; thick line: the median, cited at the right. A box away from the zero line means the model is biased on these rows.", fr: "Résidu : valeur observée moins prédiction. Trait : du cinquième au quatre-vingt-quinzième percentile ; boîte : la moitié centrale ; trait épais : la médiane, citée à droite. Une boîte écartée de la ligne zéro signifie que le modèle est biaisé sur ces lignes."}
  residual_period_question: {en: "Does the error drift across the values of {column}?", fr: "L'erreur dérive-t-elle d'une valeur de {column} à l'autre ?"}
  residual_period_note: {en: "Mean residual (observed minus predicted) of the rows of each period, one bar per model; the number at the right is the candidate's. A period with few rows is noisy.", fr: "Résidu moyen (valeur observée moins prédiction) des lignes de chaque période, une barre par modèle ; le nombre à droite est celui du candidat. Une période avec peu de lignes est bruitée."}
  errors_question: {en: "Do the models get under the bar fixed before seeing them?", fr: "Les modèles passent-ils sous la barre fixée avant de les voir ?"}
  errors_label: {en: "Each model's figure with its interval, and the criterion's bar", fr: "Le chiffre de chaque modèle avec son intervalle, et la barre du critère"}
  errors_dot: {en: "the model's figure", fr: "le chiffre du modèle"}
  errors_ci: {en: "its bootstrap interval", fr: "son intervalle bootstrap"}
  errors_bar: {en: "the criterion's bar", fr: "la barre du critère"}
  paired_question: {en: "Is the gap between two models larger than the noise of drawing the rows?", fr: "L'écart entre deux modèles dépasse-t-il le bruit du tirage des lignes ?"}
  paired_label: {en: "Paired differences with their bootstrap intervals", fr: "Écarts appariés avec leurs intervalles bootstrap"}
  paired_excludes: {en: "interval excludes zero", fr: "l'intervalle exclut zéro"}
  paired_includes: {en: "interval includes zero", fr: "l'intervalle contient zéro"}
  paired_note: {en: "Each row is one model minus another on the same rows; the number at the right is the difference. A filled dot: its interval excludes zero; an open dot: it includes zero.", fr: "Chaque ligne est un modèle moins un autre sur les mêmes lignes ; le nombre à droite est l'écart. Un point plein : son intervalle exclut zéro ; un point creux : il contient zéro."}
  parts_question: {en: "On which rows does the study work, and which are sealed?", fr: "Sur quelles lignes l'étude travaille-t-elle, et lesquelles sont scellées ?"}
  parts_label: {en: "The rows of the file in two parts", fr: "Les lignes du fichier en deux parts"}
  parts_dev: {en: "development rows", fr: "lignes de développement"}
  parts_sealed: {en: "sealed final test", fr: "test final scellé"}
  parts_opened: {en: "final test, opened once", fr: "test final, ouvert une fois"}
  fold: {en: one fold, fr: un pli}
  folds_question: {en: "How are the development rows divided into folds?", fr: "Comment les lignes de développement sont-elles réparties en plis ?"}
  folds_label: {en: "The folds of the split", fr: "Les plis du découpage"}
  folds_note: {en: "One block per fold, its number above, its rows inside; under a time order, the range of the time column below.", fr: "Un bloc par pli, son numéro au-dessus, ses lignes dedans ; sous un ordre temporel, la plage de la colonne de temps dessous."}
  folds_order: {en: "Order column:", fr: "Colonne d'ordre :"}
  coefficients_question: {en: "Which variables weigh most, and is the sign of each weight certain?", fr: "Quelles variables pèsent le plus, et le signe de chaque poids est-il certain ?"}
  coefficients_excludes: {en: "interval excludes zero", fr: "l'intervalle exclut zéro"}
  coefficients_includes: {en: "interval includes zero", fr: "l'intervalle contient zéro"}
  looks_question: {en: "How many times was the target read, and by which activity?", fr: "Combien de fois la cible a-t-elle été lue, et par quelle activité ?"}
  looks_label: {en: "Looks at the target by activity", fr: "Regards sur la cible par activité"}

# Regression: the overlay for a numeric target.
regression:
  prereq:
    items:
      - {en: "<b>An error and a gap.</b> An error or a difference is always given with the rows it was computed on, in the unit of the target, and with an interval when the study has one.", fr: "<b>Une erreur et un écart.</b> Une erreur ou une différence est toujours donnée avec les lignes sur lesquelles elle a été calculée, dans l'unité de la cible, et avec un intervalle quand l'étude en a un."}
      - {en: "<b>The four evidence marks.</b> ○ nothing was read; ◇ the structure was read, without the target; ◐ a development result, which was used to choose and is therefore optimistic; ● the final test, sealed, opened only once.", fr: "<b>Les quatre marques de preuve.</b> ○ rien n'a été lu ; ◇ la structure a été lue, sans la cible ; ◐ un résultat de développement, qui a servi à choisir et reste donc optimiste ; ● le test final, scellé, ouvert une seule fois."}
      - {en: "<b>The code is optional.</b> The \"Code\" blocks reproduce cells of the generated notebook, which recompute recorded figures with pandas and scikit-learn and check the equality with assert. nv and RESULT_IDS are the notebook's helpers for reading the study.", fr: "<b>Le code est facultatif.</b> Les blocs « Code » reprennent des cellules du notebook généré, qui recalculent les chiffres enregistrés avec pandas et scikit-learn et vérifient l'égalité par assert. nv et RESULT_IDS sont les aides du notebook pour lire l'étude."}
      - {en: "<b>Every number is cited.</b> Hover a number to see the recorded result and the path it comes from; the appendix lists every result.", fr: "<b>Chaque nombre est cité.</b> Survolez un nombre pour voir le résultat enregistré et le chemin dont il vient ; l'annexe liste chaque résultat."}
      - {en: "<b>Where you are.</b> The line pinned at the top of the screen gives the chapter being read and what remains; the buttons on the right switch the report to the other language and to the whiteboard theme, for this visit only.", fr: "<b>Où vous êtes.</b> La ligne collée en haut de l'écran donne le chapitre lu et ce qui reste ; les boutons à droite passent le rapport dans l'autre langue et en tableau blanc, pour cette visite seulement."}
    abbr_task:
      - {term: {en: "MAE", fr: "MAE"}, def: {en: "Mean absolute error: the mean of the absolute gap between observed and predicted, in the unit of the target.", fr: "Erreur absolue moyenne : la moyenne de l'écart absolu entre l'observé et le prédit, dans l'unité de la cible."}}
      - {term: {en: "RMSE", fr: "RMSE"}, def: {en: "Root mean squared error, in the unit of the target; it weighs large errors more.", fr: "La racine de la moyenne des erreurs au carré, dans l'unité de la cible ; elle pèse davantage les grandes erreurs."}}
      - {term: {en: "residual", fr: "résidu"}, def: {en: "Observed minus predicted: positive when the model predicted too low.", fr: "Observé moins prédit : positif quand le modèle a prédit trop bas."}}
      - {term: {en: "EBM", fr: "EBM"}, def: {en: "Explainable Boosting Machine: a readable non-linear model, one curve per variable.", fr: "Explainable Boosting Machine : un modèle non linéaire lisible, une courbe par variable."}}
      - {term: {en: "ridge · alpha", fr: "ridge · alpha"}, def: {en: "Penalised linear regression; alpha is the strength of the penalty.", fr: "Régression linéaire pénalisée ; alpha est la force de la pénalité."}}
  chapters:
    ch3:
      terms: [cross_validation, out_of_fold, success_criterion]
    ch4:
      terms: [target_look, target_distribution, special_value]
    ch6:
      terms: [baseline, linear_regression, mae, residual]
      here:
        baseline: {en: "The reference (predict the mean) predicts the mean of the fitted rows for every row; its mean absolute error is {mae_base}.", fr: "La référence (prédire la moyenne) prédit, pour chaque ligne, la moyenne des lignes d'ajustement ; son erreur absolue moyenne vaut {mae_base}."}
      keep: {en: "Out of fold, the candidate errs by {mae_model} on average, the reference by {mae_base}.", fr: "Hors pli, le candidat se trompe en moyenne de {mae_model}, la référence de {mae_base}."}
    ch7:
      intro: {en: "This step chooses the model the study will carry to the final test, among the reference, the linear model and the variants. The evidence is the out-of-fold errors, compared pair by pair on the same rows with a bootstrap interval, and the one-standard-error rule over the folds. The final test is still apart: the choice is made without it.", fr: "Cette étape choisit le modèle que l'étude portera au test final, parmi la référence, le modèle linéaire et les variantes. La preuve est faite des erreurs hors pli, comparées deux à deux sur les mêmes lignes avec un intervalle bootstrap, et de la règle d'une erreur type sur les plis. Le test final reste à part : le choix se fait sans lui."}
      terms: [paired_bootstrap, paired_difference, one_se]
      here:
        one_se: {en: "Here the rule keeps {pick}; the best mean is {best}.", fr: "Ici, la règle retient {pick} ; la meilleure moyenne est celle de {best}."}
      keep: {en: "{chosen} is chosen; against the reference its paired difference is {delta} [{low}, {high}].", fr: "{chosen} est choisi ; face à la référence, son écart apparié vaut {delta} [{low} ; {high}]."}
  figures:
    nonlinearity:
      read:
        - {en: "Each bar is one range of the variable; its length is the observed value minus the mean prediction there, in the unit of the target.", fr: "Chaque barre est une tranche de la variable ; sa longueur est la valeur observée moins la prédiction moyenne à cet endroit, dans l'unité de la cible."}
        - {en: "To the right, the model predicts too low in that range; to the left, too high. The line spans plus or minus two standard errors.", fr: "À droite, le modèle prédit trop bas dans cette tranche ; à gauche, trop haut. Le trait couvre plus ou moins deux erreurs types."}
    fold_lines:
      read:
        - {en: "Each line is one configuration; each point its mean absolute error on one fold. Lower is better.", fr: "Chaque ligne est une configuration ; chaque point son erreur absolue moyenne sur un pli. Plus bas, mieux c'est."}
        - {en: "Lines that keep their order on every fold show a steady gap.", fr: "Des lignes qui gardent leur ordre sur chaque pli montrent un écart régulier."}

# Binary: the overlay for a yes/no outcome.
binary:
  prereq:
    abbr_task:
      - {term: {en: "precision", fr: "précision"}, def: {en: "Among the rows a rule selects, the share that are positive.", fr: "Parmi les lignes qu'une règle sélectionne, la part qui est positive."}}
      - {term: {en: "recall", fr: "rappel"}, def: {en: "Among all positive rows, the share the rule selects.", fr: "Parmi toutes les lignes positives, la part que la règle sélectionne."}}
      - {term: {en: "AUC", fr: "AUC"}, def: {en: "Area under the ROC curve: the chance that a positive row is scored above a negative one.", fr: "Aire sous la courbe ROC : la chance qu'une ligne positive soit notée au-dessus d'une négative."}}
      - {term: {en: "points", fr: "points"}, def: {en: "Percentage points: the difference of two percentages.", fr: "Points de pourcentage : la différence de deux pourcentages."}}
  chapters:
    ch3:
      terms: [cross_validation, out_of_fold, success_criterion]
    ch4:
      terms: [target_look, base_rate, special_value]
    ch6:
      terms: [baseline, logistic_regression, auc]
      here:
        baseline: {en: "The baseline does not rank: at any rule it finds positive rows at the base rate.", fr: "La référence ne classe pas : à toute règle, elle trouve des lignes positives au taux de base."}
      keep: {en: "Out of fold, the candidate ranks the rows with an AUC of {auc}.", fr: "Hors pli, le candidat classe les lignes avec une AUC de {auc}."}
    ch7:
      intro: {en: "This step turns the scores into actions: a rule selects the rows the team acts on. The evidence is what each rule finds compared with the baseline, on the same out-of-fold predictions, with paired intervals. The final test is still apart: the rule is chosen without it.", fr: "Cette étape transforme les scores en actions : une règle sélectionne les lignes sur lesquelles l'équipe agit. La preuve est ce que chaque règle trouve face à la référence, sur les mêmes prédictions hors pli, avec des intervalles appariés. Le test final reste à part : la règle se choisit sans lui."}
      terms: [policy, precision, paired_bootstrap]
      keep: {en: "The rule recorded: {rule}; the model's precision there is {precision} against {base_precision} for the baseline.", fr: "La règle enregistrée : {rule} ; la précision du modèle y vaut {precision} contre {base_precision} pour la référence."}
  figures:
    errors_bar:
      title: {en: "The precision at the rule, and the criterion's bar", fr: "La précision à la règle, et la barre du critère"}
      why: {en: "The verdict comes down to one question: at the rule, does the model's precision clear the bar fixed before seeing it? This figure puts the precisions on one ruler, with the bar.", fr: "Le verdict tient en une question : à la règle, la précision du modèle franchit-elle la barre fixée avant de le voir ? Cette figure pose les précisions sur une même règle, avec la barre."}
      read:
        - {en: "Find the dashed red line: the bar. To its right, in the green, a model meets the criterion.", fr: "Repérez le pointillé rouge : la barre. À sa droite, dans le vert, un modèle atteint le critère."}
        - {en: "Read each dot: the further right, the higher the precision.", fr: "Lisez chaque point : plus il est à droite, plus la précision est haute."}
      conclude: {en: "At {rule}, the model's precision is {precision} against {base} for the baseline; the criterion ({criterion}) is {status}.", fr: "À la règle « {rule} », la précision du modèle vaut {precision} contre {base} pour la référence ; le critère ({criterion}) est {status}."}
      bar_note: {en: "The bar is drawn at the baseline's precision raised by the criterion's points; its position is computed for the drawing only.", fr: "La barre est dessinée à la précision de la référence augmentée des points du critère ; sa position est calculée pour le dessin seulement."}
    paired:
      why: {en: "The model and the baseline are compared at the same rule on the same rows: the paired gain of precision, with a bootstrap interval, is the evidence of the rule.", fr: "Le modèle et la référence sont comparés à la même règle sur les mêmes lignes : le gain apparié de précision, avec un intervalle bootstrap, est la preuve de la règle."}
      read:
        - {en: "Right of zero, the model's precision beats the baseline's.", fr: "À droite de zéro, la précision du modèle dépasse celle de la référence."}
        - {en: "An interval that does not cross zero is a gain the drawing of the rows does not explain.", fr: "Un intervalle qui ne coupe pas zéro est un gain que le tirage des lignes n'explique pas."}
      conclude: {en: "At the rule, the paired gain of precision is {delta} points [{low}, {high}].", fr: "À la règle, le gain apparié de précision vaut {delta} points [{low} ; {high}]."}
    fold_lines:
      read:
        - {en: "Each line is one configuration; each point its AUC on one fold. Higher is better.", fr: "Chaque ligne est une configuration ; chaque point son AUC sur un pli. Plus haut, mieux c'est."}
        - {en: "Lines that keep their order on every fold show a steady gap.", fr: "Des lignes qui gardent leur ordre sur chaque pli montrent un écart régulier."}
