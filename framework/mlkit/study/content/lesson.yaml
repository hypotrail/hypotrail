  pipe_columns: {en: Columns, fr: Colonnes}
  pipe_indicators: {en: Missing-value indicators, fr: Indicateurs de valeur manquante}
  pipe_rare: {en: Rare categories grouped, fr: Catégories rares regroupées}
  pipe_caps: {en: Caps, fr: Plafonds}
