    not_met: {en: "not met on the final test", fr: "non atteint sur le test final"}
    uncertain: {en: "uncertain on the final test", fr: "incertain sur le test final"}
    not_assessed: {en: "not assessed", fr: "non évalué"}
  table_note: {en: "Mean absolute error, in {unit}; in brackets, the bootstrap interval of each value. The highlighted row is the configuration carried to the final test; the reference predicts the mean of the rows it is fitted on.", fr: "Erreur absolue moyenne, en {unit} ; entre crochets, l'intervalle bootstrap de chaque valeur. La ligne surlignée est la configuration portée au test final ; la référence prédit la moyenne des lignes sur lesquelles elle est ajustée."}
