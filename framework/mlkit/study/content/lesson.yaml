  se_band: {en: "best mean to best plus one standard error", fr: "de la meilleure moyenne à la meilleure plus une erreur type"}
  se_bound: {en: "best + one SE", fr: "meilleure + une ET"}
  se_pick: {en: picked by the rule, fr: retenue par la règle}
