# The lesson-style study report (owner decision 2026-10-27, R25 to R30): every text of the
# page shell, the chapters and the guided reading of each figure, in English and in French
# side by side ({en, fr}). The report holds both languages in one file (R27); a text is
# picked in the language of the edition being written (mlkit.study.texts.lesson).
#
# No digits: every number is a placeholder ({name}) the renderer fills with a cited registry
# value or a recorded literal. Placeholders are named; a missing one fails the render.
# ``regression`` and ``binary`` are overlays merged over the shared texts for that task.
schema: hypotrail.content.lesson/1

ui:
  h1: {en: "the study, end to end", fr: "l'étude, de bout en bout"}
  crumb: {en: "study report · revision {revision}", fr: "rapport de l'étude · révision {revision}"}
  sub:
    en: "This report tells the study in the order it was carried out: the question, the framing, the evaluation, the exploration, the preparation, the models, the choice, the final test and the conclusion. Each chapter first says what the step does, introduces the statistical term, explains it on the rows of this study, states the choice and why, shows the evidence where the argument needs it, and ends with what remains uncertain. Each figure says why it is there and how to read it through to its conclusion; the top line always says where you are and what remains. The report describes the recorded state; it takes no decision."
    fr: "Ce rapport raconte l'étude dans l'ordre où elle a été menée : la question, le cadrage, l'évaluation, l'exploration, la préparation, les modèles, le choix, le test final et la conclusion. Chaque chapitre dit d'abord ce que fait l'étape, introduit le terme statistique, puis l'explique sur les lignes de cette étude, dit le choix et pourquoi, montre la preuve à l'endroit où l'argument en a besoin, et termine par ce qui reste incertain. Chaque figure dit pourquoi elle est là et comment la lire jusqu'à sa conclusion ; la ligne du haut dit toujours où vous êtes et ce qui reste. Le rapport décrit l'état enregistré ; il ne prend aucune décision."
  legend_folds: {en: "▸ foldable blocks: example, why it holds, code, where it breaks, what remains uncertain, learn more", fr: "▸ blocs à déplier : exemple, pourquoi ça tient, code, où ça casse, ce qui reste incertain, en savoir plus"}
