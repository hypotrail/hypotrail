  tuned_binary: {en: "Penalised variant (penalty chosen by nested cross-validation)", fr: "Variante pénalisée (pénalité choisie par validation croisée imbriquée)"}
  ebm: {en: "EBM variant (readable non-linear model)", fr: "Variante EBM (modèle non linéaire lisible)"}
  hgb: {en: "Gradient boosting variant", fr: "Variante gradient boosting"}
  other: {en: "Variant: {words}", fr: "Variante : {words}"}
