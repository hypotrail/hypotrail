  cv_note: {en: "One line per fold: the green block is predicted by a model fitted on the blue blocks; the number is its rows. Every development row is predicted once.", fr: "Une ligne par pli : le bloc vert est prédit par un modèle ajusté sur les blocs bleus ; le nombre est son nombre de lignes. Chaque ligne de développement est prédite une fois."}
  cv_note_temporal: {en: "One line per fold, in time order: the green block is predicted by a model fitted on the blue blocks, later years included; the number is its rows. Every development row is predicted once.", fr: "Une ligne par pli, dans l'ordre du temps : le bloc vert est prédit par un modèle ajusté sur les blocs bleus, années postérieures comprises ; le nombre est son nombre de lignes. Chaque ligne de développement est prédite une fois."}
  cv_col: {en: column, fr: colonne}
