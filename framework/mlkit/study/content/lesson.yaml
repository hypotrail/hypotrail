# Glossary entries the glossary (glossary.yaml) does not hold: the term first, then its
# definition.
terms:
  observation_unit:
    term: {en: Unit of observation, fr: Unité d'observation}
    def: {en: "What one row of the table describes. Everything depends on it: what we predict, what we count, and what can repeat from one row to another.", fr: "Ce que décrit une ligne du tableau. Tout en dépend : ce qu'on prédit, ce qu'on compte, et ce qui peut se répéter d'une ligne à l'autre."}
  one_se:
    term: {en: One-standard-error rule, fr: Règle d'une erreur type}
    def: {en: "Among configurations compared on the same folds, keep the simplest one whose mean error is within one standard error of the best mean: a smaller gap is not told apart from the noise between folds.", fr: "Parmi des configurations comparées sur les mêmes plis, garder la plus simple dont l'erreur moyenne est à moins d'une erreur type de la meilleure moyenne : un écart plus petit ne se distingue pas du bruit entre les plis."}
  exposure:
    term: {en: Exposure, fr: Exposition}
    def: {en: "The record of which rows were read, by which activity and why. Changing the split does not make rows already read unseen.", fr: "L'enregistrement des lignes lues, par quelle activité et pourquoi. Changer le découpage ne rend pas non vues des lignes déjà lues."}

# One entry per chapter. ``terms``: glossary ids (or ``terms`` above), each followed by its
# "In this study" sentence: the glossary's cited example when it is computable, else
# ``here.<term>`` below. ``here``, ``example``, ``keep`` and ``plus`` take placeholders.
chapters:
  ch1:
    intro: {en: "This step opens the study: before any computation, it fixes what the study must help decide, what one row of the file describes, and which rows are set aside unseen. It comes first because everything else depends on it: the target to predict, the errors to count, the rows that will judge the choice. You see the file and its parts; no decision is asked of you here, as the engine sealed the final test when the study was created.", fr: "Cette étape ouvre l'étude : avant tout calcul, elle fixe ce que l'étude doit aider à décider, ce que décrit une ligne du fichier, et quelles lignes sont mises de côté sans être regardées. Elle vient en premier parce que tout le reste en dépend : la cible à prédire, les erreurs à compter, les lignes qui jugeront le choix. Vous y voyez le fichier et ses parts ; aucune décision ne vous est demandée ici, le moteur a scellé le test final à la création de l'étude."}
    terms: [observation_unit, development_rows, final_test]
    here:
      observation_unit: {en: "One row is: {unit}. The study estimates the target for each row: {target}.", fr: "Une ligne est : {unit}. L'étude estime la cible pour chaque ligne : {target}."}
      development_rows: {en: "Of the {total} rows of the file, {dev} are development rows: they feed the exploration, the fits and the comparison.", fr: "Sur les {total} lignes du fichier, {dev} sont des lignes de développement : elles nourrissent l'exploration, les ajustements et la comparaison."}
      final_test: {en: "{sealed} rows were sealed when the study was created. This report does not read them while the final test is sealed.", fr: "{sealed} lignes ont été scellées à la création de l'étude. Ce rapport ne les lit pas tant que le test final est scellé."}
      final_test_absent: {en: "This study has no final test: it was created before the final test existed, so every row is a development row.", fr: "Cette étude n'a pas de test final : elle a été créée avant que le test final existe, donc chaque ligne est une ligne de développement."}
      final_test_opened: {en: "{sealed} rows were set aside as the final test when the study was created. It has been opened once to measure the chosen configuration; only that evaluation and its diagnostics read its rows.", fr: "{sealed} lignes ont été mises à part comme test final à la création de l'étude. Il a été ouvert une fois pour mesurer la configuration choisie ; seules cette évaluation et ses diagnostics lisent ses lignes."}
    example:
      - {en: "<b>The first development row.</b> Read it from left to right in the table of figure {fig}: its target comes first, then the columns the model may use. The model must find its target without seeing it.", fr: "<b>La première ligne de développement.</b> Lisez-la de gauche à droite dans le tableau de la figure {fig} : sa cible vient d'abord, puis les colonnes que le modèle peut utiliser. Le modèle devra retrouver sa cible sans la voir."}
      - {en: "<b>What repeats.</b> The case names a column that groups related rows: {group}. It flags rows that may repeat one another; it does not predict.", fr: "<b>Ce qui se répète.</b> Le cas nomme une colonne qui regroupe des lignes apparentées : {group}. Elle repère des lignes qui peuvent se répéter ; elle ne prédit pas."}
      - {en: "<b>What orders.</b> The case names a time column, {time}: it places the rows in time, and the evaluation can follow it (the evaluation chapter).", fr: "<b>Ce qui ordonne.</b> Le cas nomme une colonne temporelle, {time} : elle range les lignes dans le temps, et l'évaluation peut la suivre (le chapitre de l'évaluation)."}
    example_keys: [first_row, group, time]
    why:
      - {en: "Anything we look at can steer a choice: a shape seen in a chart, a model that \"works better\" on these rows. A set of rows that no activity has read cannot have steered the choice; it is the only measure of the choice that the choice does not flatter. It must therefore be set aside <b>before</b> any look, and the engine did so when the study was created.", fr: "Tout ce qu'on regarde peut orienter un choix : une forme vue dans un graphique, un modèle qui « marche mieux » sur ces lignes. Un ensemble de lignes qu'aucune activité n'a lu ne peut pas avoir orienté le choix ; c'est la seule mesure du choix qui ne soit pas flattée par lui. Il faut donc le mettre de côté <b>avant</b> tout regard, et le moteur l'a fait à la création de l'étude."}
      - {en: "The unit of observation fixes what an error means: the mean error on one row as the file describes it. A row that stands for many cases counts as much as a rare one.", fr: "L'unité d'observation fixe ce que veut dire une erreur : l'erreur moyenne sur une ligne telle que le fichier la décrit. Une ligne qui représente beaucoup de cas compte autant qu'une ligne rare."}
    breaks:
      - {en: "<b>A row is not always independent of the others.</b> When a group column exists, the model may recognise a group rather than generalise (the evaluation chapter).", fr: "<b>Une ligne n'est pas toujours indépendante des autres.</b> Quand une colonne de groupe existe, le modèle peut « reconnaître » un groupe plutôt que généraliser (le chapitre de l'évaluation)."}
      - {en: "<b>What the case does not document.</b> A statement of unknown status stays a doubt, whatever the model does with the column.", fr: "<b>Ce que le cas ne documente pas.</b> Un énoncé de statut inconnu reste un doute, quoi que le modèle fasse de la colonne."}
    keep: {en: "One row is: {unit}. {dev} development rows are used to learn and choose everything; {sealed} stay sealed to judge once.", fr: "Une ligne est : {unit}. {dev} lignes de développement servent à tout apprendre et à tout choisir ; {sealed} restent scellées pour juger une fois."}
    keep_absent: {en: "One row is: {unit}. Every one of the {dev} rows is a development row; nothing is kept apart to judge the choice.", fr: "Une ligne est : {unit}. Chacune des {dev} lignes est une ligne de développement ; rien n'est gardé à part pour juger le choix."}
    keep_opened: {en: "One row is: {unit}. {dev} development rows are used to learn and choose everything; {sealed} rows, set aside, were opened once to judge the choice.", fr: "Une ligne est : {unit}. {dev} lignes de développement servent à tout apprendre et à tout choisir ; {sealed} lignes, mises à part, ont été ouvertes une fois pour juger le choix."}
    done: {en: "we know what a row describes, what we predict, and which rows stay sealed.", fr: "on sait ce que décrit une ligne, ce qu'on prédit, et quelles lignes restent scellées."}
    done_opened: {en: "we know what a row describes, what we predict, and which rows were set aside to judge once.", fr: "on sait ce que décrit une ligne, ce qu'on prédit, et quelles lignes ont été mises à part pour juger une fois."}
    next: {en: "when the prediction would be made, and with which columns.", fr: "à quel moment la prédiction serait faite, et avec quelles colonnes."}
    question: {en: "What does one row describe, and which rows does the study never read before the choice?", fr: "Que décrit une ligne, et quelles lignes l'étude ne lit-elle jamais avant le choix ?"}
    plus:
      parts: {en: "All the rows of the file; the development rows; the sealed rows.", fr: "Toutes les lignes du fichier ; les lignes de développement ; les lignes scellées."}
      missing: {en: "Missing cells are counted on the development rows only (the exploration chapter).", fr: "Les cellules manquantes sont comptées sur les lignes de développement seulement (le chapitre de l'exploration)."}
  ch2:
    intro: {en: "Here we fix when the prediction would be made, and therefore which columns the model may see. This comes before any look at the data, because a column known too late would make the model look better than it will be. Two decisions are at stake: the moment and the availability of the variables.", fr: "On fixe ici quand la prédiction serait faite, et donc quelles colonnes le modèle a le droit de voir. Cela vient avant tout regard sur les données, parce qu'une colonne connue trop tard ferait paraître le modèle meilleur qu'il ne le sera. Deux décisions sont en jeu : le moment et la disponibilité des variables."}
    terms: [prediction_time, feature_availability, leakage]
    here:
      prediction_time: {en: "The moment recorded for this study: {moment}.", fr: "Le moment enregistré pour cette étude : {moment}."}
      prediction_time_open: {en: "The moment is not decided yet; the case proposes: {moment}.", fr: "Le moment n'est pas encore décidé ; le cas propose : {moment}."}
      feature_availability: {en: "{n_available} variables are used by the model: {available}.", fr: "{n_available} variables sont utilisées par le modèle : {available}."}
      feature_availability_excluded: {en: "Excluded: {excluded}.", fr: "Exclues : {excluded}."}
      feature_availability_open: {en: "The availability of the variables is not decided yet.", fr: "La disponibilité des variables n'est pas encore décidée."}
      leakage: {en: "A variable excluded here never enters a model, whatever its signal.", fr: "Une variable exclue ici n'entre jamais dans un modèle, quel que soit son signal."}
    example:
      - {en: "<b>A column known too late.</b> A measurement taken after the moment of prediction would let the model read part of the answer: its error on the development rows would look smaller than it can be in use.", fr: "<b>Une colonne connue trop tard.</b> Une mesure prise après le moment de la prédiction laisserait le modèle lire une partie de la réponse : son erreur sur les lignes de développement paraîtrait plus petite qu'elle ne peut l'être en usage."}
      - {en: "<b>A doubtful column.</b> When the case does not say when a value becomes known, the cautious choice is to exclude it and to list the doubt as a limit.", fr: "<b>Une colonne douteuse.</b> Quand le cas ne dit pas quand une valeur devient connue, le choix prudent est de l'exclure et de noter le doute comme une limite."}
    why:
      - {en: "The data cannot prove that a column is known in time: availability is a decision about the use, taken before any model, so that no result can steer it.", fr: "Les données ne peuvent pas prouver qu'une colonne est connue à temps : la disponibilité est une décision sur l'usage, prise avant tout modèle, pour qu'aucun résultat ne puisse l'orienter."}
    breaks:
      - {en: "<b>A moment stated too vaguely</b> lets a late column slip in.", fr: "<b>Un moment énoncé trop vaguement</b> laisse passer une colonne tardive."}
      - {en: "<b>A strong single-variable signal</b> is a question, not a proof: is this column truly known at the moment of prediction?", fr: "<b>Un signal fort d'une seule variable</b> est une question, pas une preuve : cette colonne est-elle vraiment connue au moment de la prédiction ?"}
    keep: {en: "The prediction is made at the recorded moment; only the variables known then enter the model: {available}.", fr: "La prédiction est faite au moment enregistré ; seules les variables connues à ce moment entrent dans le modèle : {available}."}
    keep_open: {en: "The moment of prediction and the variables it allows are not decided yet.", fr: "Le moment de la prédiction et les variables qu'il autorise ne sont pas encore décidés."}
    done: {en: "we know when the prediction would be made and which columns it may use.", fr: "on sait quand la prédiction serait faite et quelles colonnes elle peut utiliser."}
    next: {en: "how the rows are used to compare models, and the bar a model must clear.", fr: "comment les lignes servent à comparer les modèles, et la barre qu'un modèle doit franchir."}
    question: {en: "At what moment is the prediction made, and why is a column known later excluded?", fr: "À quel moment la prédiction est-elle faite, et pourquoi exclut-on une colonne connue plus tard ?"}
    plus:
      available: {en: "The number of variables the model may use, after the exclusions.", fr: "Le nombre de variables que le modèle peut utiliser, après les exclusions."}
  ch3:
    intro: {en: "This step fixes how the development rows are used to compare models, and the bar a model must clear to be worth adopting. Both come before any model, so that no result can bend them. You see how the rows are divided and the criterion as recorded.", fr: "Cette étape fixe comment les lignes de développement servent à comparer les modèles, et la barre qu'un modèle doit franchir pour valoir la peine. Les deux viennent avant tout modèle, pour qu'aucun résultat ne puisse les plier. Vous voyez comment les lignes sont réparties et le critère tel qu'il est enregistré."}
    terms: [cross_validation, out_of_fold, success_criterion]
    here:
      cross_validation: {en: "{split}.", fr: "{split}."}
      cross_validation_open: {en: "The split is not decided yet.", fr: "Le découpage n'est pas encore décidé."}
      out_of_fold: {en: "Each of the {dev} development rows gets one prediction from a model that did not see it; every error of the model chapters is computed on these predictions.", fr: "Chacune des {dev} lignes de développement reçoit une prédiction d'un modèle qui ne l'a pas vue ; toutes les erreurs des chapitres des modèles sont calculées sur ces prédictions."}
      success_criterion: {en: "The criterion recorded: {criterion}.", fr: "Le critère enregistré : {criterion}."}
      success_criterion_open: {en: "No success criterion is fixed yet.", fr: "Aucun critère de succès n'est encore fixé."}
    example:
      - {en: "<b>One fold.</b> In figure {fig}, take the first block: its rows are predicted by a model fitted on the other blocks only. Then the next block takes its turn, until every row has its out-of-fold prediction.", fr: "<b>Un pli.</b> Dans la figure {fig}, prenez le premier bloc : ses lignes sont prédites par un modèle ajusté sur les autres blocs seulement. Puis le bloc suivant prend son tour, jusqu'à ce que chaque ligne ait sa prédiction hors pli."}
      - {en: "<b>The criterion before the result.</b> The bar is written down before any model is fitted, so a disappointing result cannot lower it afterwards.", fr: "<b>Le critère avant le résultat.</b> La barre est écrite avant tout ajustement, si bien qu'un résultat décevant ne peut pas l'abaisser après coup."}
    why:
      - {en: "A model judged on the rows it was fitted on looks better than it is. Predicting each row with a model that never saw it gives an honest development error on every row, without spending the sealed final test.", fr: "Un modèle jugé sur les lignes sur lesquelles il a été ajusté paraît meilleur qu'il ne l'est. Prédire chaque ligne avec un modèle qui ne l'a jamais vue donne une erreur de développement honnête sur chaque ligne, sans dépenser le test final scellé."}
      - {en: "Choosing among models on these same predictions still flatters the chosen one a little: the out-of-fold figures stay development evidence.", fr: "Choisir entre des modèles sur ces mêmes prédictions flatte encore un peu celui qu'on retient : les chiffres hors pli restent des preuves de développement."}
    breaks:
      - {en: "<b>Groups across folds.</b> When related rows sit in several folds, a model may recognise a group it saw: the error looks smaller than for a new group.", fr: "<b>Des groupes à cheval sur les plis.</b> Quand des lignes apparentées sont dans plusieurs plis, un modèle peut reconnaître un groupe déjà vu : l'erreur paraît plus petite que pour un groupe nouveau."}
      - {en: "<b>A criterion fixed after seeing results</b> would no longer test anything.", fr: "<b>Un critère fixé après avoir vu les résultats</b> ne testerait plus rien."}
    keep: {en: "{split}. The bar was fixed before any model: {criterion}.", fr: "{split}. La barre a été fixée avant tout modèle : {criterion}."}
    keep_open: {en: "How the rows are divided, or the criterion, is not decided yet.", fr: "La façon de répartir les lignes, ou le critère, n'est pas encore décidée."}
    done: {en: "we know how each row gets an honest prediction and what bar a model must clear.", fr: "on sait comment chaque ligne reçoit une prédiction honnête et quelle barre un modèle doit franchir."}
    next: {en: "what the development rows look like, without and then with the target.", fr: "à quoi ressemblent les lignes de développement, sans puis avec la cible."}
    question: {en: "Why is every development row predicted by a model that did not see it, and why is the criterion fixed first?", fr: "Pourquoi chaque ligne de développement est-elle prédite par un modèle qui ne l'a pas vue, et pourquoi fixe-t-on le critère d'abord ?"}
    plus:
      folds: {en: "The number of folds and the rows in each; the rows of a fold are predicted by a model fitted on the others.", fr: "Le nombre de plis et les lignes de chacun ; les lignes d'un pli sont prédites par un modèle ajusté sur les autres."}
  ch4:
    intro: {en: "The exploration reads the development rows: first their structure, without the target, then the target itself. Each reading of the target is counted as a look, because the more we look, the more a pattern can be chance. You see what each exploration found; no decision is made here.", fr: "L'exploration lit les lignes de développement : d'abord leur structure, sans la cible, puis la cible elle-même. Chaque lecture de la cible est comptée comme un regard, parce que plus on regarde, plus un motif peut être dû au hasard. Vous voyez ce que chaque exploration a trouvé ; aucune décision n'est prise ici."}
    terms: [target_look, distribution, special_value]
    here:
      target_look: {en: "The study has had {looks} looks at the target so far.", fr: "L'étude a eu {looks} regards sur la cible jusqu'ici."}
      target_look_none: {en: "No look at the target is recorded yet.", fr: "Aucun regard sur la cible n'est encore enregistré."}
    example:
      - {en: "<b>Structure first.</b> Missing cells, rare categories and out-of-range values are counted without reading the target: these readings cannot steer a choice towards what works on these rows.", fr: "<b>La structure d'abord.</b> Les cellules manquantes, les catégories rares et les valeurs hors plage sont comptées sans lire la cible : ces lectures ne peuvent pas orienter un choix vers ce qui marche sur ces lignes."}
      - {en: "<b>Then the target.</b> Each chart that reads the target adds one look to the count of figure {fig}.", fr: "<b>Puis la cible.</b> Chaque graphique qui lit la cible ajoute un regard au compteur de la figure {fig}."}
    why:
      - {en: "Exploring is how we learn the data, but every look at the target is also a chance to fit a pattern of these rows only. Counting the looks makes that risk visible; reading the structure without the target removes it for the preparation.", fr: "Explorer est la façon d'apprendre les données, mais chaque regard sur la cible est aussi une occasion de s'ajuster à un motif propre à ces lignes. Compter les regards rend ce risque visible ; lire la structure sans la cible le supprime pour la préparation."}
    breaks:
      - {en: "<b>A difference between groups is an association,</b> not an effect of the variable.", fr: "<b>Une différence entre groupes est une association,</b> pas un effet de la variable."}
      - {en: "<b>Many looks</b> make one striking pattern less convincing.", fr: "<b>Beaucoup de regards</b> rendent un motif frappant moins convaincant."}
    keep: {en: "The structure was read before the target; the target was looked at {looks} times, each look counted.", fr: "La structure a été lue avant la cible ; la cible a été regardée {looks} fois, chaque regard compté."}
    keep_none: {en: "No exploration of the target is recorded yet.", fr: "Aucune exploration de la cible n'est encore enregistrée."}
    done: {en: "we know what the development rows look like and how many looks the target had.", fr: "on sait à quoi ressemblent les lignes de développement et combien de regards la cible a eus."}
    next: {en: "how the variables are prepared for the model, and which readings motivated it.", fr: "comment les variables sont préparées pour le modèle, et quelles lectures l'ont motivé."}
    question: {en: "Why is the structure read before the target, and why are the looks at the target counted?", fr: "Pourquoi lit-on la structure avant la cible, et pourquoi compte-t-on les regards sur la cible ?"}
    plus:
      looks: {en: "Each exploration that read the target on the development rows counts as one look, and so does each diagnostic of the models.", fr: "Chaque exploration qui a lu la cible sur les lignes de développement compte comme un regard, de même que chaque diagnostic des modèles."}
  ch5:
    intro: {en: "This step decides how the model prepares the variables: missing values, rare categories, extreme values, skewed variables. It comes after the structure is read and is learnt on the rows each model is fitted on only. You see the preparation recorded and the readings that motivated it.", fr: "Cette étape décide comment le modèle prépare les variables : valeurs manquantes, catégories rares, valeurs extrêmes, variables asymétriques. Elle vient après la lecture de la structure et n'est apprise que sur les lignes sur lesquelles chaque modèle est ajusté. Vous voyez la préparation enregistrée et les lectures qui l'ont motivée."}
    terms: [data_contingent_decision, imputation, standardisation]
    here:
      data_contingent_decision: {en: "The preparation recorded: {preparation}. {contingent}", fr: "La préparation enregistrée : {preparation}. {contingent}"}
      data_contingent_decision_open: {en: "The preparation is not decided yet.", fr: "La préparation n'est pas encore décidée."}
    contingent_yes: {en: "It was chosen after a look at the target, so the development figures may be slightly optimistic.", fr: "Elle a été choisie après un regard sur la cible : les chiffres de développement peuvent être un peu optimistes."}
    contingent_no: {en: "It was chosen before any look at the target.", fr: "Elle a été choisie avant tout regard sur la cible."}
    example:
      - {en: "<b>A logarithm.</b> A variable whose values pile up on the left and stretch to the right is spread more evenly by its logarithm: a linear model then follows its shape better.", fr: "<b>Un logarithme.</b> Une variable dont les valeurs s'entassent à gauche et s'étirent vers la droite est étalée plus régulièrement par son logarithme : un modèle linéaire suit alors mieux sa forme."}
      - {en: "<b>A missing value.</b> A missing cell becomes an indicator column and an imputed value, learnt on the fitted rows only, never an ordinary number.", fr: "<b>Une valeur manquante.</b> Une cellule manquante devient une colonne indicatrice et une valeur imputée, apprises sur les lignes d'ajustement seulement, jamais un nombre ordinaire."}
    why:
      - {en: "Each parameter of the preparation (a median, a cap, a category list) is learnt on the rows a model is fitted on, then applied unchanged to the rows it predicts: the prediction never borrows from the rows it is judged on.", fr: "Chaque paramètre de la préparation (une médiane, un plafond, une liste de catégories) est appris sur les lignes d'ajustement d'un modèle, puis appliqué tel quel aux lignes qu'il prédit : la prédiction n'emprunte jamais aux lignes sur lesquelles elle est jugée."}
    breaks:
      - {en: "<b>A preparation tuned after looking at the target</b> makes the development figures optimistic; the report stamps it as such.", fr: "<b>Une préparation réglée après avoir regardé la cible</b> rend les chiffres de développement optimistes ; le rapport la marque comme telle."}
    keep: {en: "{preparation}.", fr: "{preparation}."}
    keep_open: {en: "The preparation is not decided yet.", fr: "La préparation n'est pas encore décidée."}
    done: {en: "we know how each variable is prepared, learnt on the fitted rows only.", fr: "on sait comment chaque variable est préparée, apprise sur les lignes d'ajustement seulement."}
    next: {en: "the models, fitted and compared on the same out-of-fold predictions.", fr: "les modèles, ajustés et comparés sur les mêmes prédictions hors pli."}
    question: {en: "Why is the preparation learnt on the fitted rows only?", fr: "Pourquoi la préparation est-elle apprise seulement sur les lignes d'ajustement ?"}
    plus: {}
  ch6:
    intro: {en: "This step fits a reference model, the candidate model and the variants, and compares them on the same predictions. The reference says what an error looks like without any model; the diagnostics say where the candidate errs. You see the models side by side and what their diagnostics flagged.", fr: "Cette étape ajuste un modèle de référence, le modèle candidat et les variantes, et les compare sur les mêmes prédictions. La référence dit à quoi ressemble une erreur sans modèle ; les diagnostics disent où le candidat se trompe. Vous voyez les modèles côte à côte et ce que leurs diagnostics ont signalé."}
    terms: [baseline, overfitting]
    here:
      baseline: {en: "The reference of this study: {baseline}.", fr: "La référence de cette étude : {baseline}."}
    example:
      - {en: "<b>Reading one error.</b> In the table of the largest errors, the first row shows an observed value, a prediction, and their difference: the residual.", fr: "<b>Lire une erreur.</b> Dans le tableau des plus grandes erreurs, la première ligne montre une valeur observée, une prédiction, et leur différence : le résidu."}
      - {en: "<b>A variant.</b> A variant answers one question (a penalty, another family) and costs one trial of the budget.", fr: "<b>Une variante.</b> Une variante répond à une question (une pénalité, une autre famille) et coûte un essai du budget."}
    why:
      - {en: "Every model is compared on the same out-of-fold predictions of the same rows, so a difference between two models is not a difference between two sets of rows.", fr: "Chaque modèle est comparé sur les mêmes prédictions hors pli des mêmes lignes : un écart entre deux modèles n'est donc pas un écart entre deux ensembles de lignes."}
    breaks:
      - {en: "<b>More variants, more optimism.</b> The best of several trials owes a little to chance; the study counts the trials.", fr: "<b>Plus de variantes, plus d'optimisme.</b> La meilleure de plusieurs tentatives doit un peu au hasard ; l'étude compte les essais."}
      - {en: "<b>A coefficient is an association</b> given the other variables, never the effect of changing a variable.", fr: "<b>Un coefficient est une association</b> à variables égales, jamais l'effet d'un changement de variable."}
    keep_none: {en: "No model is fitted yet.", fr: "Aucun modèle n'est encore ajusté."}
    done: {en: "we know how far each model is from the observed values, and where the candidate errs.", fr: "on sait à quelle distance chaque modèle est des valeurs observées, et où le candidat se trompe."}
    next: {en: "the choice among the models, on paired differences.", fr: "le choix entre les modèles, sur des écarts appariés."}
    question: {en: "Why compare every model on the same out-of-fold predictions, and what does the reference model tell?", fr: "Pourquoi comparer chaque modèle sur les mêmes prédictions hors pli, et que dit le modèle de référence ?"}
    plus:
      trials: {en: "Configurations fitted and compared on the same rows so far (a disclosure: the more there are, the more the best one may owe to chance).", fr: "Configurations ajustées et comparées sur les mêmes lignes jusqu'ici (une transparence : plus il y en a, plus la meilleure peut devoir au hasard)."}
  ch7:
    intro: {en: "This step chooses what the study will carry to the final test. The evidence is the out-of-fold figures of the previous chapter, compared pair by pair on the same rows with a bootstrap interval. The final test is still apart: the choice is made without it.", fr: "Cette étape choisit ce que l'étude portera au test final. La preuve est faite des chiffres hors pli du chapitre précédent, comparés deux à deux sur les mêmes lignes avec un intervalle bootstrap. Le test final reste à part : le choix se fait sans lui."}
    terms: [paired_bootstrap, paired_difference, selection_on_validation]
    example:
      - {en: "<b>A paired difference.</b> For each row, take the error of one model minus the error of the other, then average: the rows that are hard for both cancel out, and the interval shrinks.", fr: "<b>Un écart apparié.</b> Pour chaque ligne, prenez l'erreur d'un modèle moins l'erreur de l'autre, puis faites la moyenne : les lignes difficiles pour les deux s'annulent, et l'intervalle se resserre."}
    why:
      - {en: "Two intervals that overlap do not prove that two models are equal: the paired difference, computed on the same rows, is sharper. An interval of the difference that excludes zero says the gap is not the noise of drawing the rows.", fr: "Deux intervalles qui se chevauchent ne prouvent pas que deux modèles se valent : l'écart apparié, calculé sur les mêmes lignes, est plus fin. Un intervalle de l'écart qui exclut zéro dit que l'écart n'est pas le bruit du tirage des lignes."}
    breaks:
      - {en: "<b>Chosen on these rows.</b> The figures that drove the choice are optimistic for the chosen one; only the final test is independent.", fr: "<b>Choisi sur ces lignes.</b> Les chiffres qui ont guidé le choix sont optimistes pour le modèle retenu ; seul le test final est indépendant."}
    keep_none: {en: "Nothing is chosen yet.", fr: "Rien n'est encore choisi."}
    done: {en: "we know what is chosen and on which paired evidence.", fr: "on sait ce qui est choisi et sur quelle preuve appariée."}
    next: {en: "the final test, opened once for the chosen configuration.", fr: "le test final, ouvert une fois pour la configuration choisie."}
    question: {en: "Why compare models with a paired difference rather than two separate intervals?", fr: "Pourquoi comparer les modèles par un écart apparié plutôt que par deux intervalles séparés ?"}
    plus: {}
  ch8:
    intro: {en: "The final test is the set of rows sealed at creation. It is opened once, after the choice and with your answer in the chat, to measure the chosen configuration on rows nothing has seen. It is the only independent evidence of the study.", fr: "Le test final est l'ensemble des lignes scellées à la création. Il s'ouvre une fois, après le choix et avec votre réponse dans le chat, pour mesurer la configuration choisie sur des lignes que rien n'a vues. C'est la seule preuve indépendante de l'étude."}
    terms: [final_test]
    here:
      final_test: {en: "{sealed} rows, {state}.", fr: "{sealed} lignes, {state}."}
    state:
      sealed: {en: "still sealed and never read", fr: "encore scellées et jamais lues"}
      opened: {en: "opened once for the chosen configuration", fr: "ouvertes une fois pour la configuration choisie"}
    example:
      - {en: "<b>Why only once.</b> Opening the final test twice, and changing the model in between, would turn it into one more development set: its figure would be flattered by the second choice.", fr: "<b>Pourquoi une seule fois.</b> Ouvrir le test final deux fois, en changeant le modèle entre-temps, en ferait un ensemble de développement de plus : son chiffre serait flatté par le second choix."}
    why:
      - {en: "Rows that played no part in any choice measure the choice without flattering it. Everything changed after the opening is reported as changed after the final test.", fr: "Des lignes qui n'ont joué aucun rôle dans un choix mesurent ce choix sans le flatter. Tout ce qui change après l'ouverture est signalé comme changé après le test final."}
    breaks:
      - {en: "<b>A small final test</b> gives a wide interval: one figure, honest but imprecise.", fr: "<b>Un petit test final</b> donne un intervalle large : un chiffre honnête mais imprécis."}
    keep_sealed: {en: "{sealed} rows stay sealed; the verdict will be read on them, once.", fr: "{sealed} lignes restent scellées ; le verdict se lira sur elles, une fois."}
    keep_opened: {en: "The final test was opened once, on {n} rows nothing had seen.", fr: "Le test final a été ouvert une fois, sur {n} lignes que rien n'avait vues."}
    keep_absent: {en: "This study has no final test.", fr: "Cette étude n'a pas de test final."}
    done: {en: "we know the state of the only independent evidence.", fr: "on connaît l'état de la seule preuve indépendante."}
    next: {en: "the conclusion and its limits.", fr: "la conclusion et ses limites."}
    question: {en: "Why is the final test opened only once, and only after the choice?", fr: "Pourquoi le test final ne s'ouvre-t-il qu'une fois, et seulement après le choix ?"}
    drift_regression: {en: "The final test was drawn by bins of the target across the whole file, without a declared order: it cannot show a drift of the error towards recent rows. The development residuals by period are the only view of such a drift.", fr: "Le test final a été tiré par tranches de la cible sur tout le fichier, sans ordre déclaré : il ne peut pas montrer une dérive de l'erreur vers les lignes récentes. Les résidus de développement par période sont la seule vue d'une telle dérive."}
    plus: {}
  ch9:
    intro: {en: "The conclusion says what can be claimed, for which use, and with which limits. It is written in your words; keeping the reference or calling the study inconclusive are valid results. You see the conclusion when it exists, and every limit the study records.", fr: "La conclusion dit ce qu'on peut affirmer, pour quel usage, et avec quelles limites. Elle s'écrit avec vos mots ; garder la référence ou déclarer l'étude non concluante sont des résultats valables. Vous voyez la conclusion quand elle existe, et chaque limite que l'étude enregistre."}
    terms: [confirmed_decision]
    example:
      - {en: "<b>A measured conclusion</b> names the evidence (development or final), the criterion and its status, and at least one limit.", fr: "<b>Une conclusion mesurée</b> nomme la preuve (de développement ou finale), le critère et son statut, et au moins une limite."}
    why:
      - {en: "The study ranks or estimates; it does not show what acting would change. A conclusion that stays within that frame can be defended.", fr: "L'étude classe ou estime ; elle ne montre pas ce qu'agir changerait. Une conclusion qui reste dans ce cadre peut se défendre."}
    breaks:
      - {en: "<b>A sentence about acting</b> (\"this variable lowers the target\") says more than the study shows.", fr: "<b>Une phrase causale</b> (« cette variable fait baisser la cible ») dit plus que ce que l'étude montre."}
    keep_open: {en: "The conclusion is not written yet; {n} limits are recorded.", fr: "La conclusion n'est pas encore écrite ; {n} limites sont enregistrées."}
    keep_done: {en: "The conclusion is written; {n} limits stay attached to it.", fr: "La conclusion est écrite ; {n} limites y restent attachées."}
    done: {en: "we know what the study can and cannot say.", fr: "on sait ce que l'étude peut et ne peut pas dire."}
    question: {en: "What can the study claim, for which use, and what can it not say?", fr: "Que peut affirmer l'étude, pour quel usage, et que ne peut-elle pas dire ?"}
    plus: {}

summary:
  intro: {en: "Each line is what one chapter keeps.", fr: "Chaque ligne est ce qu'un chapitre garde."}
  phrase_label: {en: "In one sentence", fr: "En une phrase"}
  phrase_open: {en: "\"The study estimates {target}. On the development rows, {best}. These figures were used to choose; the verdict will come from the final test, and the conclusion is still to be written in my words.\"", fr: "« L'étude estime {target}. Sur les lignes de développement, {best}. Ces chiffres ont servi à choisir ; le verdict viendra du test final, et la conclusion reste à écrire avec mes mots. »"}
  phrase_closed: {en: "\"The study estimates {target}. On the development rows, {best}. The final test, opened once, is the independent evidence; the conclusion lists its limits.\"", fr: "« L'étude estime {target}. Sur les lignes de développement, {best}. Le test final, ouvert une fois, est la preuve indépendante ; la conclusion en liste les limites. »"}
  best_regression: {en: "{model} errs by {mae_model} on average, against {mae_base} for the reference (predict the mean)", fr: "{model} se trompe en moyenne de {mae_model}, contre {mae_base} pour la référence (prédire la moyenne)"}
  best_binary: {en: "{model} ranks the rows with an AUC of {auc}", fr: "{model} classe les lignes avec une AUC de {auc}"}
  phrase_none: {en: "\"The study estimates {target}. No model figure is recorded yet.\"", fr: "« L'étude estime {target}. Aucun chiffre de modèle n'est encore enregistré. »"}
voice:
  intro: {en: "Answer each question out loud before you reveal the answer; the answer is the chapter's \"What we keep\".", fr: "Répondez à voix haute à chaque question avant de dévoiler la réponse ; la réponse est le « Ce qu'on garde » du chapitre."}
decisions:
  intro: {en: "Each decision below carries the engine's value, recorded by the automatic mode chosen at launch. It stays in the review queue, and the study stays not defensible, until you adopt it or change it in the chat. This page holds no decision control.", fr: "Chaque décision ci-dessous porte la valeur du moteur, enregistrée par le mode automatique choisi au lancement. Elle reste dans la file de relecture, et l'étude reste non défendable, jusqu'à ce que vous l'adoptiez ou la changiez dans le chat. Cette page ne contient aucun contrôle de décision."}
  cols: {decision: {en: Decision, fr: Décision}, value: {en: Value recorded, fr: Valeur enregistrée}, basis: {en: Basis, fr: Base}, chapter: {en: Chapter, fr: Chapitre}}
  next: {en: "Next action:", fr: "Prochaine action :"}
annex:
  intro: {en: "For checking a number; reading the reasoning does not need it. Every result the report cites, with its identity; hypotrail evidence with --result and the result's identifier shows every value recorded for it.", fr: "Pour vérifier un nombre ; lire le raisonnement n'en a pas besoin. Chaque résultat que le rapport cite, avec son identité ; hypotrail evidence avec --result et l'identifiant du résultat montre chaque valeur enregistrée pour lui."}

