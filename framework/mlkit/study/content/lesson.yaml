  sealed_cell: {en: "sealed: not read yet", fr: "scellé : pas encore lu"}
  absent_cell: {en: "no final test in this study", fr: "pas de test final dans cette étude"}
  paired: {en: "Paired difference with the reference ({model} − {reference})", fr: "Écart apparié avec la référence ({model} − {reference})"}
  criterion: {en: "Success criterion: an error at least {share} below the reference's", fr: "Critère de succès : une erreur au moins {share} sous celle de la référence"}
  criterion_dev: {en: "{status}, context only", fr: "{status}, pour contexte seulement"}
