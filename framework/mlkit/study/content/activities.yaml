      - {path: partitions.train.column_min, label: "Time column in training, first value", fmt: int}
      - {path: partitions.train.column_max, label: "Time column in training, last value", fmt: int}
      - {path: partitions.validation.column_min, label: "Time column in validation, first value", fmt: int}
      - {path: partitions.validation.column_max, label: "Time column in validation, last value", fmt: int}
      - {path: validation_share, label: Share of rows in validation, fmt: pct1}
      - {path: validation_fraction, label: Validation fraction (decided), fmt: pct0}
      - {path: groups.n_groups, label: Distinct groups, fmt: int}
      - {path: groups.shared_groups, label: Groups in both partitions (no grouped split), fmt: int}
      - {path: groups.validation_rows_in_shared_groups, label: Validation rows of a shared group, fmt: int}
      - {path: groups.validation_share_in_shared_groups, label: Share of validation rows in a shared group, fmt: pct1}
      - {path: overlap.moved, label: Rows that changed partition since the previous split, fmt: int}
      - {path: overlap.previously_exposed.validation.train_eda, label: Validation rows already explored during EDA, fmt: int}
  eda.target_summary:
