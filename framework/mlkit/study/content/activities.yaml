      - {path: bootstrap.replicates, label: Bootstrap replicates, fmt: int}
# Error metrics of a regression model comparison, in display order
# (render_html._model_comparison). Values are in the unit of the target.
regression_metrics:
  - {key: mae, label: MAE, fmt: f2, glossary: mae}
  - {key: rmse, label: RMSE, fmt: f2, glossary: rmse}
  - {key: mean_residual, label: Mean residual (bias), fmt: f2, glossary: bias}
# B6c (M3): a study evaluated by cross-validation has no training or validation rows to
# name: every development row is explored, and each is predicted once, out of fold, by a
# model fitted on the other folds (mlkit.study.texts.activity). ``cv_activities`` replaces
# whole specs; ``cv_labels`` renames the labels of the other specs.
cv_activities:
  split:
    label: Cross-validation folds
    glossary: cross_validation
    highlights:
      - {path: n_rows, label: Development rows in the folds, fmt: int}
      - {path: training_exclusions.n_rows, label: Development rows left out for delayed labels, fmt: int}
      - {path: folds, label: "Folds (each row predicted once, by a model fitted on the other folds)", fmt: int}
      - {path: groups.n_groups, label: Distinct groups, fmt: int}
      - {path: duplicates.n_groups, label: Groups of identical records kept in one fold, fmt: int}
    tables:
      - rows: fold_rows
        columns:
          - {key: fold, label: Fold, fmt: int}
          - {key: n_rows, label: Rows, fmt: int}
          - {key: n_positive, label: Positive rows, fmt: int}
          - {key: rate, label: Positive share, fmt: pct1}
regression_cv_activities:
  split:
    label: Cross-validation folds
    glossary: cross_validation
    highlights:
      - {path: n_rows, label: Development rows in the folds, fmt: int}
      - {path: training_exclusions.n_rows, label: Development rows left out for delayed labels, fmt: int}
      - {path: folds, label: "Folds (each row predicted once, by a model fitted on the other folds)", fmt: int}
      - {path: groups.n_groups, label: Distinct groups, fmt: int}
    tables:
      - rows: fold_rows
        columns:
          - {key: fold, label: Fold, fmt: int}
          - {key: n_rows, label: Rows, fmt: int}
# Review round 4 (E4-5): a plan that chains forward in time (``texts.FORWARD_METHODS``):
# each later window is scored once by models fitted on earlier rows only; the warm-up rows
# train and are never scored.
forward_activities:
  split:
    label: Forward-chaining folds
    glossary: forward_chaining
    highlights:
      - {path: n_rows, label: Development rows in the folds, fmt: int}
      - {path: training_exclusions.n_rows, label: Development rows left out for delayed labels, fmt: int}
      - {path: n_scored, label: "Rows scored out of fold (each once, by a model fitted on earlier rows only)", fmt: int}
      - {path: n_warmup, label: Warm-up rows (they train the first fold and are never scored), fmt: int}
      - {path: folds, label: Folds (each scores a later window of prediction time), fmt: int}
      - {path: partitions.validation.n_positive, label: Positive rows among the rows scored, fmt: int}
      - {path: partitions.validation.rate, label: Positive share among the rows scored, fmt: pct1}
      - {path: groups.n_groups, label: Distinct groups, fmt: int}
      - {path: duplicates.n_groups, label: Groups of identical records kept in one fold, fmt: int}
    tables:
      - rows: fold_rows
        columns:
          - {key: fold, label: Fold, fmt: int}
          - {key: n_train, label: Rows fitted, fmt: int}
          - {key: n_rows, label: Rows scored, fmt: int}
          - {key: n_positive, label: Positive rows, fmt: int}
          - {key: rate, label: Positive share, fmt: pct1}
regression_forward_activities:
  split:
    label: Forward-chaining folds
    glossary: forward_chaining
    highlights:
      - {path: n_rows, label: Development rows in the folds, fmt: int}
      - {path: training_exclusions.n_rows, label: Development rows left out for delayed labels, fmt: int}
      - {path: n_scored, label: "Rows predicted out of fold (each once, by a model fitted on earlier rows only)", fmt: int}
      - {path: n_warmup, label: Warm-up rows (they train the first fold and are never predicted), fmt: int}
      - {path: folds, label: Folds (each predicts a later window of prediction time), fmt: int}
      - {path: groups.n_groups, label: Distinct groups, fmt: int}
    tables:
      - rows: fold_rows
        columns:
          - {key: fold, label: Fold, fmt: int}
          - {key: n_train, label: Rows fitted, fmt: int}
          - {key: n_rows, label: Rows predicted, fmt: int}
# Review round 4 (E4-5): the labels of the split cards in a French report.
