      - {path: n_missing, label: Rows without a target value, fmt: int}
      - {path: mean, label: Mean, fmt: f2}
      - {path: sd, label: Standard deviation, fmt: f2}
      - {path: min, label: Minimum, fmt: f2}
      - {path: q25, label: First quartile, fmt: f2}
      - {path: median, label: Median, fmt: f2}
      - {path: q75, label: Third quartile, fmt: f2}
      - {path: max, label: Maximum, fmt: f2}
  eda.special_values:
