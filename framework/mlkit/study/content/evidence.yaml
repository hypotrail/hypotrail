# Headlines and impact descriptions of the evidence read (CLI-CONTRACT-COMPANION §5, C5, C11).
# No digits here: every number shown is a cited registry value.
#
# ``headlines`` holds one short line per activity, resolved only for a current, verified
# result. ``{{r:@.<path>|<fmt>}}`` cites the result itself (``@`` is its result id, see
# mlkit.study.cite). ``<rule>`` is the first rule the evaluation covers (the adopted one when
# it is among them) and ``<unit>`` the unit of the target. A headline whose path is absent
# from the result is not shown.
#
# ``changes`` describes, in words, each row of the dependency table (plan §3.7) that can
# change a confirmed decision: "if this decision changed in this way, what would go stale?"
schema: hypotrail.content.evidence/1
headlines:
  split: "{{r:@.partitions.train.n_rows|int}} training rows / {{r:@.partitions.validation.n_rows|int}} validation rows"
  eda.target_rate: "Positive rate {{r:@.rate|pct1}} on {{r:@.n_rows|int}} training rows"
  eda.special_values: "Special values counted on {{r:@.n_rows|int}} training rows"
  eda.rate_by: "{{r:@.n_groups|int}} groups on {{r:@.n_rows|int}} training rows"
  eda.distribution: "Distribution on {{r:@.n_rows|int}} training rows"
  fit.baseline: "AUC {{r:@.validation.roc_auc|f3}} on {{r:@.validation.n_rows|int}} validation rows"
  fit.logistic: "AUC {{r:@.validation.roc_auc|f3}} on {{r:@.validation.n_rows|int}} validation rows"
  policy.evaluation: "<rule>: precision {{r:@.rules.[<rule>].models.[fit.logistic].precision|pct1}}, recall {{r:@.rules.[<rule>].models.[fit.logistic].recall|pct1}} on {{r:@.n|int}} validation rows"
  # v0.2b (WP-B4): the diagnostics.
  diag.binary: "Brier score {{r:@.models.[fit.logistic].calibration.brier|f4}}, AUC {{r:@.models.[fit.logistic].roc_auc|f3}} on {{r:@.n|int}} development rows"
  diag.final_test: "Final-test diagnostics on {{r:@.n|int}} rows"
# WP-B6a: under cross-validation (a split with ``scheme: cross_validation``, a fit or an
# evaluation of out-of-fold predictions, or an exploration on such a split) these replace the
# headlines above: there are no validation rows, and the explorations read every
# development row.
cv_headlines:
  split: "{{r:@.folds|int}} folds over {{r:@.n_rows|int}} development rows"
  eda.target_rate: "Positive rate {{r:@.rate|pct1}} on {{r:@.n_rows|int}} development rows"
  eda.special_values: "Special values counted on {{r:@.n_rows|int}} development rows"
  eda.rate_by: "{{r:@.n_groups|int}} groups on {{r:@.n_rows|int}} development rows"
  eda.distribution: "Distribution on {{r:@.n_rows|int}} development rows"
  fit.baseline: "Out-of-fold AUC {{r:@.validation.roc_auc|f3}} on {{r:@.validation.n_rows|int}} development rows"
  fit.logistic: "Out-of-fold AUC {{r:@.validation.roc_auc|f3}} on {{r:@.validation.n_rows|int}} development rows"
  policy.evaluation: "<rule>: precision {{r:@.rules.[<rule>].models.[fit.logistic].precision|pct1}}, recall {{r:@.rules.[<rule>].models.[fit.logistic].recall|pct1}} on the out-of-fold predictions of {{r:@.n|int}} development rows"
regression_cv_headlines:
  split: "{{r:@.folds|int}} folds over {{r:@.n_rows|int}} development rows"
  eda.target_summary: "Mean {{r:@.mean|f2}} <unit>, standard deviation {{r:@.sd|f2}} on {{r:@.n_rows|int}} development rows"
  eda.special_values: "Special values counted on {{r:@.n_rows|int}} development rows"
  eda.mean_by: "{{r:@.n_groups|int}} groups on {{r:@.n_rows|int}} development rows"
  eda.distribution: "Distribution on {{r:@.n_rows|int}} development rows"
  fit.baseline: "Out-of-fold MAE {{r:@.validation.mae|f2}} <unit> on {{r:@.validation.n_rows|int}} development rows"
  fit.linear: "Out-of-fold MAE {{r:@.validation.mae|f2}} <unit> on {{r:@.validation.n_rows|int}} development rows"
  evaluate.regression: "MAE {{r:@.models.[fit.linear].mae|f2}} <unit> for the linear model and {{r:@.models.[fit.baseline].mae|f2}} <unit> for the mean baseline on the out-of-fold predictions of {{r:@.n|int}} development rows"
# A regression study reads these instead (M3: no vocabulary of a decision rule).
regression_headlines:
  split: "{{r:@.partitions.train.n_rows|int}} training rows / {{r:@.partitions.validation.n_rows|int}} validation rows"
  eda.target_summary: "Mean {{r:@.mean|f2}} <unit>, standard deviation {{r:@.sd|f2}} on {{r:@.n_rows|int}} training rows"
  eda.special_values: "Special values counted on {{r:@.n_rows|int}} training rows"
  eda.mean_by: "{{r:@.n_groups|int}} groups on {{r:@.n_rows|int}} training rows"
  eda.distribution: "Distribution on {{r:@.n_rows|int}} training rows"
  fit.baseline: "Validation MAE {{r:@.validation.mae|f2}} <unit> on {{r:@.validation.n_rows|int}} rows"
  fit.linear: "Validation MAE {{r:@.validation.mae|f2}} <unit> on {{r:@.validation.n_rows|int}} rows"
  evaluate.regression: "MAE {{r:@.models.[fit.linear].mae|f2}} <unit> for the linear model and {{r:@.models.[fit.baseline].mae|f2}} <unit> for the mean baseline on {{r:@.n|int}} validation rows"
  diag.regression: "Mean residual {{r:@.models.[fit.linear].residuals.mean|f2}} <unit>, error-size rank correlation with the prediction {{r:@.models.[fit.linear].heteroscedasticity.abs_residual_prediction_correlation|f2}} on {{r:@.n|int}} development rows"
  diag.final_test: "Final-test diagnostics on {{r:@.n|int}} rows"
# L3 (owner session 2026-10-26, remark R4): the headlines of a French study, by the same
