# Glossary of the junior study (plan §9 bis: teaching texts are data, not code).
# Each entry introduces the statistical term first, then explains it.
# No digits here: every number shown to the junior comes from a registry result.
# ``example`` (post-v0.1 fixes, D11): the contextual explanation the agent gives right after
# the definition, at the term's first use. Its placeholders (<N>, <rule>, ...) are
# filled from this study's current results; the report shows the term and definition only.
schema: hypotrail.content.glossary/1
terms:
  prediction_time:
    term: Prediction time
    term_fr: "moment de la prédiction"
    definition: The moment when the score is computed and acted on. Only information known at that moment may enter the model.
  leakage:
    term: Leakage
    term_fr: "fuite d'information (leakage)"
    definition: A variable that carries information from after the prediction time. It makes a model look better on past data than it can be in use. For example, the duration of the last call to a client is known only once the call has ended, so a model that uses it to decide whom to call relies on information it cannot have before the call; it looks excellent on past calls and is useless in a campaign.
  feature_availability:
    term: Feature availability
    term_fr: "disponibilité des variables"
    definition: Whether a variable is known at the prediction time. It is a decision about the use case, not a property the data can prove.
  validation_partition:
    term: Validation set
    term_fr: "jeu de validation"
    definition: Rows held apart from model fitting and used to compare models and choose a policy. Once used to choose, they are no longer independent evidence.
    cited_example: "Here {{slot:split:partitions.validation.n_rows|int}} rows are held apart for validation and {{slot:split:partitions.train.n_rows|int}} rows train the models."
  stratified_split:
    term: Stratified split
    term_fr: "découpage stratifié"
    definition: A random division of the rows that keeps the share of the positive outcome similar in the training and validation partitions.
    example: Here the training partition has <n_positive_train> positive rows out of <n_train> and the validation partition <n_positive_validation> out of <n_validation>, close shares by construction.
    cited_example: "Here the positive outcome occurs in {{slot:split:partitions.train.rate|pct1}} of the training rows and in {{slot:split:partitions.validation.rate|pct1}} of the validation rows, close shares by construction."
  exposure:
    term: Data exposure
    term_fr: "exposition des données"
    definition: The record of which rows were read, by which activity, and why. Changing the split does not make rows already seen unseen.
  distribution:
    term: Distribution
    term_fr: "distribution"
    definition: How the values of one column spread over the rows, read as how often each value occurs or, for a measurement, its range, quartiles, and missing cells. Read on training rows only, it leaves the validation rows unexplored.
  class_imbalance:
    term: Class imbalance
    term_fr: "déséquilibre des classes"
    definition: An outcome that occurs in a small share of the rows. A model can then look accurate by predicting the common outcome everywhere, so it is judged against the base rate.
  base_rate:
    term: Base rate
    term_fr: "taux de base"
    definition: The share of rows with the positive outcome. Any model must be compared with what this share alone would give. For example, when few clients subscribe a term deposit, a model that predicts "no" for everyone is right for most clients and finds no subscriber; the base rate is the bar any call list must beat.
    cited_example: "In this study's training rows the positive outcome occurs in {{slot:eda.target_rate:rate|pct1}} of rows."
  special_value:
    term: Special value
    term_fr: "valeur spéciale"
    definition: A code that stands for something other than a measurement, such as "never" or "unknown". Treating it as an ordinary number distorts a model.
  baseline:
    term: Baseline
    term_fr: "modèle de référence (baseline)"
    definition: The simplest reference model, a constant score equal to the training base rate. Keeping the baseline is a valid conclusion.
    cited_example: "Here the baseline gives every row the training base rate, {{slot:fit.baseline:train_rate|pct1}}, so it cannot rank the rows."
  logistic_regression:
    term: Logistic regression
    term_fr: "régression logistique"
    definition: A model that turns a weighted sum of the features into a score between zero and one. It ranks rows; its scores are not calibrated probabilities unless that is checked.
  score:
    term: Score
    term_fr: "score"
    definition: The number a model gives to each row to rank it. A higher score places the row earlier in the queue.
  policy:
    term: Decision policy
    term_fr: "règle de décision"
    definition: The rule that turns scores into actions, either a threshold on the score, a fixed capacity of rows to act on, or a share of the scored rows.
  threshold:
    term: Threshold rule
    term_fr: "règle de seuil"
    definition: Act on every row whose score is at least the threshold. The number of actions then depends on the data.
  capacity:
    term: Capacity rule
    term_fr: "règle de capacité"
    definition: Act on a fixed number of the highest-scored rows, matching what the team can actually handle. A share rule states the capacity as a share of the scored rows instead (the top tenth, for example), so it carries over to a population of another size.
  precision:
    term: Precision
    term_fr: "précision"
    definition: Among the rows acted on, the share that turned out positive.
    example: Here the logistic model's rule selects <selected> of the <n> validation rows and <true_positives> of them are positive, a precision of <precision>.
    cited_example: "At <rule>, {{slot:policy.evaluation:rules.[<rule>].models.[fit.logistic].precision|pct1}} of the validation rows the logistic model acts on turn out positive."
  recall:
    term: Recall
    term_fr: "rappel"
    definition: Among all positive rows, the share the policy reached.
    example: Here the validation rows hold <n_positive> positive rows and the rule reaches <true_positives> of them, a recall of <recall>. A small capacity keeps recall low even when precision is high.
    cited_example: "At <rule>, the logistic model reaches {{slot:policy.evaluation:rules.[<rule>].models.[fit.logistic].recall|pct1}} of the positive validation rows."
  volume:
    term: Volume
    term_fr: "volume"
    definition: How many rows the policy acts on, also shown as a share of the partition.
  tie_at_cut:
    term: Tie at the cut
    term_fr: "égalité au seuil de coupure"
    definition: Rows with exactly the score at the cut-off. They are counted pro rata, as an expected value, rather than broken arbitrarily.
  paired_bootstrap:
    term: Paired bootstrap
    term_fr: "bootstrap apparié"
    definition: Resampling the same validation rows for both policies at once, so the interval describes their difference rather than each one separately.
    example: Here the validation rows are drawn again with replacement <replicates> times, and each draw scores both models on the same rows.
  paired_difference:
    term: Paired difference
    term_fr: "différence appariée"
    definition: The difference between two models measured on the same rows, such as the logistic model's precision minus the baseline's at one rule. Pairing removes the noise of which rows each model was measured on.
    example: Here the logistic model's precision minus the baseline's at <rule> is <delta>, between <low> and <high> on resamples of the validation rows. An interval that contains zero does not show that one model is better.
    cited_example: "At <rule>, the logistic model's precision minus the baseline's is {{slot:policy.evaluation:rules.[<rule>].deltas.[fit.logistic].precision.point|pct1}}, between {{slot:policy.evaluation:rules.[<rule>].deltas.[fit.logistic].precision.low|pct1}} and {{slot:policy.evaluation:rules.[<rule>].deltas.[fit.logistic].precision.high|pct1}} on resamples of the validation rows."
  confidence_interval:
    term: Confidence interval
    term_fr: "intervalle de confiance"
    definition: A range that shows how much a figure could move if other rows had been drawn. In this study it is a percentile interval of the paired bootstrap, so it describes the variability of these validation rows, not a guaranteed range for a future campaign. For example, a precision interval that runs from close to the base rate to well above it says that the call list may barely beat calling clients at random.
    example: Here the logistic model's precision at <rule> ranges from <low> to <high> on resamples of the <n> validation rows; a wide range means the figure is uncertain.
    cited_example: "At <rule>, the logistic model's precision ranges from {{slot:policy.evaluation:rules.[<rule>].intervals.[fit.logistic].precision.low|pct1}} to {{slot:policy.evaluation:rules.[<rule>].intervals.[fit.logistic].precision.high|pct1}} on resamples of the validation rows."
  percentile_interval:
    term: Percentile interval
    term_fr: "intervalle des percentiles"
    definition: The range between two percentiles of the bootstrap replicates. It shows sampling variability on these rows, not the performance of a future campaign.
  selection_on_validation:
    term: Selection on validation
    term_fr: "sélection sur le jeu de validation"
    definition: Choosing a model, a threshold, or a capacity by looking at validation results. The chosen figures are optimistic for that reason.
  documented_fact:
    term: Documented fact
    term_fr: "fait documenté"
    definition: A statement backed by the dataset documentation, with its source.
  scenario_assumption:
    term: Scenario assumption
    term_fr: "hypothèse du scénario"
    definition: A statement the scenario takes as given without evidence. It can be challenged and is never a decision.
  confirmed_decision:
    term: Confirmed decision
    term_fr: "décision confirmée"
    definition: A choice recorded with the user's own words in reply to a restatement. The engine records the words; it cannot verify who typed them.
  proposal:
    term: Proposal
    term_fr: "proposition"
    definition: A restated choice waiting for the user's answer. It is not a decision until it is confirmed.
  stale_result:
    term: Stale result
    term_fr: "résultat périmé"
    definition: A result computed under decisions that have since changed. It is kept for the record but is not cited.
  # v0.2a (WP-A1): terms a junior meets in model evaluation and preparation. Each definition
  # gives the term first, then explains it with an example of a campaign that calls clients
  # about a term deposit (a regression study reads its own versions below).
  auc:
    term: AUC (area under the ROC curve)
    term_fr: "AUC (aire sous la courbe ROC)"
    definition: The chance that a randomly drawn positive row gets a higher score than a randomly drawn negative row. It judges the ranking over every possible cut-off, not the result of one decision rule. For example, for a campaign that ranks clients before calling them about a term deposit, an AUC of one half means the ranking puts subscribers ahead of non-subscribers no better than chance.
  average_precision:
    term: Average precision (AP)
    term_fr: "average precision (AP, aire sous la courbe précision-rappel)"
    definition: The precision reached each time the ranked list meets a positive row, averaged from the top of the list down. Unlike the AUC, it depends on the base rate, so it suits a rare outcome. For example, when few clients subscribe, average precision tells how pure the top of the call list stays, which is what the calling team feels.
  lift:
    term: Lift
    term_fr: "lift"
    definition: The precision of the rows acted on divided by the base rate. A lift above one means the rule finds positive rows more often than acting at random would. For example, if the clients called first subscribe twice as often as the clients in general, the lift of that call list is two.
  calibration:
    term: Calibration
    term_fr: "calibration"
    definition: Whether a score matches how often the outcome occurs among rows with that score. A model can rank well and still be badly calibrated; the model diagnostics compare the mean score with the observed rate in bins of rows sorted by score. For example, if the clients a model scores at about one in five subscribe far less often than one in five, its scores cannot be read as probabilities, even if the ranking is useful.
  overfitting:
    term: Overfitting
    term_fr: "surapprentissage (overfitting)"
    definition: A model that fits the noise of its training rows as well as their pattern. It looks better on the rows it was fitted on than on new rows. For example, a model that memorises which months of the training clients had many subscriptions can score those clients well and the next campaign badly; the gap between training and validation figures reveals it.
  regularisation:
    term: Regularisation
    term_fr: "régularisation"
    definition: A penalty on large model weights during fitting. It trades a little fit on the training rows for steadier predictions on new rows. For example, in a logistic model of client subscriptions with many job and month categories, regularisation keeps a rare category from getting an extreme weight from a handful of clients.
  one_hot_encoding:
    term: One-hot encoding
    term_fr: "encodage one-hot"
    definition: Turning a category column into one indicator column per category, set for the rows that have that category. A linear model needs it because categories have no order. For example, the job of a client becomes one indicator per job, such as "technician" or "retired", and the model learns a weight for each.
  imputation:
    term: Imputation
    term_fr: "imputation"
    definition: Filling a missing value with a substitute, such as the median of the training rows, before fitting. The substitute is computed on training rows only, and an indicator can record that the value was missing. For example, a client whose account balance is missing would get the median balance of the training clients, never a figure computed with validation clients.
  standardisation:
    term: Standardisation
    term_fr: "standardisation"
    definition: Rescaling a numeric column to a mean of zero and a standard deviation of one, with both computed on training rows. It puts features on one scale, so their weights and a penalty treat them alike. For example, a client's age in years and account balance in euros are rescaled so that the weight on balance is not tiny only because euro amounts are large numbers.
  cross_validation:
    term: k-fold cross-validation
    term_fr: "validation croisée à k plis"
    definition: Dividing the development set into k folds; each fold is in turn the validation fold, measured by a model fitted on the other folds, the training folds. Every development row is measured once, so the estimate rests on more rows than one validation set; a choice made with it is still optimistic. For example, with five folds of the clients, each model is fitted five times and judged each time on clients it did not see.
  # v0.2b (WP-B6a): the vocabulary of a cross-validated study.
  out_of_fold:
    term: Out-of-fold predictions
    term_fr: "prédictions hors pli"
    definition: The score of a development row given by the model fitted on the training folds, the folds other than the row's own validation fold, so by a model that never saw that row. Every development row gets one, and the comparisons and the decision rule are read on them; they are development evidence, because the choice is made on them. For example, a client in the third fold is scored by the model fitted on the other folds' clients.
  fold_spread:
    term: Fold spread
    term_fr: "dispersion entre plis"
    definition: How much a figure moves from one validation fold to another, given as its lowest and highest fold value. It is not a confidence interval, since it describes the folds of this development set, while a confidence interval describes how a figure could move with another sample. A difference between two models smaller than the spread is not a difference this study can see. For example, if the ranking quality of the call list ranges widely across folds, a small gain of the variant over the candidate says little.
  final_test:
    term: Holdout (final test)
    term_fr: "échantillon de test final (holdout)"
    definition: Rows set apart and sealed before any look at the data, opened once, after the model and the decision rule are frozen, to measure them on rows that played no part in any choice. It is the study's only independent evidence. For example, the clients sealed at the start are scored once by the chosen model and call list; any change made after that opening is reported as made after the final test.
  development_rows:
    term: Development set (development rows)
    term_fr: "échantillon de développement"
    definition: Every row outside the sealed final test, the rows the study may explore, split into training and validation rows, and use to choose. What they show is development evidence, not final evidence. For example, the clients in the development rows feed the exploration, the model fits, and the comparison of call lists, while the sealed clients stay unread.
  wilson_interval:
    term: Wilson interval
    term_fr: "intervalle de Wilson"
    definition: An interval for a proportion, such as a positive rate in a group, that stays inside zero and one and remains sensible for small groups and rates close to zero. It shows how much the rate could move with another sample of the same size. For example, a rate computed on a few dozen clients gets a wide interval, the same rate on a thousand clients a narrow one.
  permutation_null_band:
    term: Permutation null band
    term_fr: "bande nulle par permutation"
    definition: The range of a chart's figures after shuffling the outcome among the training rows several times with a fixed seed, which breaks any real link between the variable and the outcome. A pattern that stays inside the band is what chance alone draws; one above every shuffle is unlikely to be chance alone. For example, if the rates by job group differ less than they do after shuffling who subscribed, the differences are not evidence of anything.
  data_contingent_decision:
    term: Data-contingent decision
    term_fr: "décision dépendante des données"
    definition: A decision chosen after looking at the outcome in the data. It is allowed, but it is recorded with the analyses that motivated it, because a choice adapted to the training rows makes the validation figures slightly optimistic. For example, capping a variable because a chart of the outcome looked odd at its extremes is a data-contingent preparation.
  success_criterion:
    term: Success criterion
    term_fr: "critère de succès"
    definition: The smallest gain over the baseline that would make the model worth adopting, fixed before any model is fitted, so the result cannot move the bar. The conclusion is read against it. For example, deciding before the models that the call list must beat the baseline's precision by a given number of points, and keeping the baseline when it does not.
  single_feature_signal:
    term: Single-feature signal
    term_fr: "signal d'une variable seule"
    definition: How well one variable alone predicts the outcome, measured out of fold on the training rows. A variable that predicts far better than the others raises a question about when its value becomes known, because a value recorded at or after the outcome would leak it. It never decides which variables to keep. For example, the length of the last call predicts the answer of that call very well, because it is only known once the call has ended.
  # v0.2b (WP-B4, R9): the terms of the model diagnostics.
  confusion_matrix:
    term: Confusion matrix
    term_fr: "matrice de confusion"
    definition: The four counts of a decision rule against the outcome, selected positive rows, selected negative rows, missed positive rows and correctly left-out negative rows. Precision and recall are read from it. For example, of the clients a call list selects, some subscribe and some do not, and some subscribers are never called; the matrix counts each case.
  gain_curve:
    term: Gain curve
    term_fr: "courbe de gain"
    definition: The share of all positive rows found when acting on the top share of the rows ranked by score, for every share from the top of the list to all of it. A curve above the diagonal finds positive rows faster than acting at random. For example, it tells how many of all subscribers a campaign would reach by calling only the best-ranked tenth, fifth, or half of the clients.
  roc_curve:
    term: ROC curve
    term_fr: "courbe ROC"
    definition: The share of positive rows found against the share of negative rows selected, as the cut-off moves down the ranked list. The area under it is the AUC. For example, it shows how many non-subscribers a call list must also call to reach a given share of the subscribers.
  brier_score:
    term: Brier score
    term_fr: "score de Brier"
    definition: The mean squared difference between a score and the outcome counted as zero or one. Lower is better; giving every row the base rate is the reference to beat, and a model that ranks well can still score worse than it when its scores are not probabilities. For example, scoring every client with the average subscription rate gives the Brier score a model of the clients must improve on.
  heteroscedasticity:
    term: Heteroscedasticity
    term_fr: "hétéroscédasticité"
    definition: Errors whose size changes with the prediction or across groups instead of staying about the same. The mean error stays a fair summary, but one interval width for every row would be wrong. For example, if a model of client deposits errs more for the clients it ranks highest, its errors are heteroscedastic.
  qq_plot:
    term: Quantile-quantile plot
    term_fr: "graphique quantile-quantile (QQ plot)"
    definition: The quantiles of the residuals, rescaled, plotted against the same quantiles of a normal distribution; points on the diagonal mean normal residuals. Normality is a question about the residuals after the fit, never about the raw variables, and it matters for prediction intervals rather than for the mean error. For example, a few clients with very large errors bend the ends of the plot away from the diagonal.
  example_errors:
    term: Example errors
    term_fr: "exemples d'erreurs"
    definition: A few rows where the decision and the outcome disagree, shown with their values so a person can read what the model saw. They are examples to understand, not a sample to count. For example, the called clients with the highest scores who did not subscribe can reveal a variable the model reads too much.
  # v0.3 (WP-C, R15): the standard vocabulary of the partitions, with its usual French term.
  training_set:
    term: Training set
    term_fr: jeu d'entraînement
    definition: The rows a model is fitted on. Under k-fold cross-validation each model's training set is the training folds, every fold but the one it is measured on. For example, with five folds of the clients, each model learns from four folds of clients.
  fold:
    term: Fold
    term_fr: pli
    definition: One of the k parts the development set is divided into for k-fold cross-validation. Each fold is in turn the validation fold, measured by a model fitted on the other folds, the training folds. For example, with five folds the clients of the third fold are scored by a model that learnt from the clients of the four other folds.
  sample:
    term: Sample
    term_fr: échantillon
    definition: A set of rows drawn from the population the study is about; a figure computed on it would move with another sample of the same size. For example, the development set is one sample of the clients, and the holdout another one.
# Regression study (M3). A regression study hides the binary-only terms below and reads
# ``regression_terms`` where its definitions differ or are new (mlkit.study.texts).
binary_only: [base_rate, class_imbalance, stratified_split, logistic_regression, score, policy, threshold, capacity, precision, recall, volume, tie_at_cut, auc, average_precision, lift, calibration, wilson_interval, confusion_matrix, gain_curve, roc_curve, brier_score]
regression_terms:
  success_criterion:
    term: Success criterion
    term_fr: "critère de succès"
    definition: The smallest reduction of the baseline's error that would make the model worth adopting, fixed before any model is fitted, so the result cannot move the bar. The conclusion is read against it. For example, deciding before the models that the linear model must make errors at least a tenth smaller than predicting the training mean for every car, and keeping the mean when it does not.
  prediction_time:
    term: Prediction time
    term_fr: "moment de la prédiction"
    definition: The moment when the prediction is made and used. Only information known at that moment may enter the model.
  validation_partition:
    term: Validation set
    term_fr: "jeu de validation"
    definition: Rows held apart from model fitting and used to compare models and choose one. Once used to choose, they are no longer independent evidence.
    cited_example: "Here {{slot:split:partitions.validation.n_rows|int}} rows are held apart for validation and {{slot:split:partitions.train.n_rows|int}} rows train the models."
  random_split:
    term: Random split
    term_fr: "découpage aléatoire"
    definition: A random division of the rows between training and validation, with a recorded seed. It assumes the rows are exchangeable, which a time order or repeated entities can contradict.
  ordinal_split:
    term: Ordinal (temporal) split
    term_fr: "découpage ordinal (temporel)"
    definition: A split on an ordered column such as a model year. Rows at or after a cutoff are validation rows and earlier rows train the model, so the validation asks whether a model fitted on the past holds on later periods.
  extrapolation:
    term: Extrapolation
    term_fr: "extrapolation"
    definition: Predicting for values outside the range the model was fitted on, such as later years. A model can be accurate inside its training range and biased outside it.
  group_overlap:
    term: Group overlap
    term_fr: "chevauchement des groupes"
    definition: Rows that describe the same entity, such as one name recorded in several years, falling in both partitions. Their validation rows are not independent of the training rows; the study reports how many groups are shared.
  target_distribution:
    term: Target distribution
    term_fr: "distribution de la cible"
    definition: How the values of the target spread, summarised by the mean, the standard deviation, and the quartiles. Any model is compared with the simplest guess, the training mean.
    cited_example: "On this study's training rows the target has a mean of {{slot:eda.target_summary:mean|f2}} <unit> and a standard deviation of {{slot:eda.target_summary:sd|f2}} <unit>."
  baseline:
    term: Baseline
    term_fr: "modèle de référence (baseline)"
    definition: The simplest reference model, here the training mean of the target predicted for every row. Keeping the baseline is a valid conclusion.
    cited_example: "Here the mean baseline predicts {{slot:fit.baseline:train_mean|f2}} <unit> for every row, the mean of the training rows."
  linear_regression:
    term: Linear regression
    term_fr: "régression linéaire"
    definition: A model that predicts the target as a weighted sum of the features, with weights fitted on training rows by least squares. Its weights are associations, not effects.
  prediction:
    term: Prediction
    term_fr: "prédiction"
    definition: The value a model gives for the target of a row, in the unit of the target.
  residual:
    term: Residual
    term_fr: "résidu"
    definition: Observed minus predicted value for one row. A positive residual means the model predicted too low.
  bias:
    term: Bias
    term_fr: "biais"
    definition: The mean residual. A bias far from zero means the model is systematically too low or too high, for example on later periods than the ones it was fitted on.
    cited_example: "Here the mean residual of the linear model on the validation rows is {{slot:evaluate.regression:models.[fit.linear].mean_residual|f2}} <unit>."
  mae:
    term: Mean absolute error (MAE)
    term_fr: "erreur absolue moyenne (MAE)"
    definition: The average size of the residuals, in the unit of the target. It reads directly as the typical error of one prediction.
    cited_example: "Here the linear model's validation MAE is {{slot:evaluate.regression:models.[fit.linear].mae|f2}} <unit>, against {{slot:evaluate.regression:models.[fit.baseline].mae|f2}} <unit> for the mean baseline."
  rmse:
    term: Root mean squared error (RMSE)
    term_fr: "racine de l'erreur quadratique moyenne (RMSE)"
    definition: The square root of the average squared residual, in the unit of the target. Squaring weighs large errors more, so a gap between RMSE and MAE signals a few large errors.
    cited_example: "Here the linear model's validation RMSE is {{slot:evaluate.regression:models.[fit.linear].rmse|f2}} <unit>, against {{slot:evaluate.regression:models.[fit.baseline].rmse|f2}} <unit> for the mean baseline."
  paired_bootstrap:
    term: Paired bootstrap
    term_fr: "bootstrap apparié"
    definition: Resampling the same validation rows for both models at once, so the interval describes their difference rather than each one separately.
    example: Here the validation rows are drawn again with replacement <replicates> times, and each draw measures both models on the same rows.
  paired_difference:
    term: Paired difference
    term_fr: "différence appariée"
    definition: The difference between two models measured on the same rows, such as the linear model's MAE minus the baseline's. Pairing removes the noise of which rows each model was measured on.
    example: Here the linear model's MAE minus the baseline's is <delta> <unit>, between <low> and <high> on resamples of the validation rows. Below zero means the linear model errs less on these rows; an interval that contains zero does not show that one model is better.
    cited_example: "Here the linear model's MAE minus the baseline's is {{slot:evaluate.regression:deltas.[fit.linear].mae.point|f2}} <unit>, between {{slot:evaluate.regression:deltas.[fit.linear].mae.low|f2}} and {{slot:evaluate.regression:deltas.[fit.linear].mae.high|f2}} on resamples of the validation rows."
  confidence_interval:
    term: Confidence interval
    term_fr: "intervalle de confiance"
    definition: A range that shows how much a figure could move if other rows had been drawn. In this study it is a percentile interval of the paired bootstrap, so it describes the variability of these validation rows, not a guaranteed range for future rows.
    example: Here the linear model's MAE ranges from <low> to <high> <unit> on resamples of the <n> validation rows; a wide range means the error is uncertain.
    cited_example: "Here the linear model's MAE ranges from {{slot:evaluate.regression:intervals.[fit.linear].mae.low|f2}} to {{slot:evaluate.regression:intervals.[fit.linear].mae.high|f2}} <unit> on resamples of the validation rows."
  percentile_interval:
    term: Percentile interval
    term_fr: "intervalle des percentiles"
    definition: The range between two percentiles of the bootstrap replicates. It shows sampling variability on these rows, not the error on future rows.
  selection_on_validation:
    term: Selection on validation
    term_fr: "sélection sur le jeu de validation"
    definition: Choosing a model by looking at validation results. The chosen model's validation error is optimistic for that reason.
  # v0.2a (WP-A1): the shared terms with an example on cars and fuel efficiency.
  leakage:
    term: Leakage
    term_fr: "fuite d'information (leakage)"
    definition: A variable that carries information from after the prediction time. It makes a model look better on past data than it can be in use. For example, a fuel consumption measured on a road test would reveal a car's fuel efficiency, but it is known only after the measurement the model is meant to anticipate.
  overfitting:
    term: Overfitting
    term_fr: "surapprentissage (overfitting)"
    definition: A model that fits the noise of its training rows as well as their pattern. It looks better on the rows it was fitted on than on new rows. For example, a model that memorises the fuel efficiency of the car names it was fitted on predicts those cars well and later model years badly; the gap between training and validation errors reveals it.
  regularisation:
    term: Regularisation
    term_fr: "régularisation"
    definition: A penalty on large model weights during fitting. It trades a little fit on the training rows for steadier predictions on new rows. For example, with few cars and closely related features such as weight and displacement, a penalty keeps their weights from offsetting each other with large opposite values.
  one_hot_encoding:
    term: One-hot encoding
    term_fr: "encodage one-hot"
    definition: Turning a category column into one indicator column per category, set for the rows that have that category. A linear model needs it because categories have no order. For example, the origin of a car is coded as a region number; it becomes one indicator per region instead of a number the model would read as a measurement.
  imputation:
    term: Imputation
    term_fr: "imputation"
    definition: Filling a missing value with a substitute, such as the median of the training rows, before fitting. The substitute is computed on training rows only, and an indicator can record that the value was missing. For example, the cars whose engine power is missing get the median engine power of the training cars, never a figure computed with validation cars.
  standardisation:
    term: Standardisation
    term_fr: "standardisation"
    definition: Rescaling a numeric column to a mean of zero and a standard deviation of one, with both computed on training rows. It puts features on one scale, so their weights and a penalty treat them alike. For example, weight in pounds and acceleration in seconds are rescaled so that the weight given to a car's weight is not tiny only because pounds are large numbers.
  cross_validation:
    term: k-fold cross-validation
    term_fr: "validation croisée à k plis"
    definition: Dividing the development set into k folds; each fold is in turn the validation fold, measured by a model fitted on the other folds, the training folds. Every development row is measured once, so the estimate rests on more rows than one validation set; a choice made with it is still optimistic. For example, with five folds of the cars, each model is fitted five times and its error measured each time on cars it did not see.
  # v0.2b (WP-B6a): the vocabulary of a cross-validated study.
  out_of_fold:
    term: Out-of-fold predictions
    term_fr: "prédictions hors pli"
    definition: The prediction for a development row made by the model fitted on the training folds, the folds other than the row's own validation fold, so by a model that never saw that row. Every development row gets one, and the errors and the model choice are read on them; they are development evidence, because the choice is made on them. For example, a car in the third fold is predicted by the model fitted on the other folds' cars.
  fold_spread:
    term: Fold spread
    term_fr: "dispersion entre plis"
    definition: How much a figure moves from one validation fold to another, given as its lowest and highest fold value. It is not a confidence interval, since it describes the folds of this development set, while a confidence interval describes how a figure could move with another sample. A difference between two models smaller than the spread is not a difference this study can see. For example, if the mean error ranges widely across folds, a small gain of the variant over the candidate says little.
  final_test:
    term: Holdout (final test)
    term_fr: "échantillon de test final (holdout)"
    definition: Rows set apart and sealed before any look at the data, opened once, after the model is chosen, to measure it on rows that played no part in any choice. It is the study's only independent evidence. For example, the cars sealed at the start are predicted once by the chosen model; any change made after that opening is reported as made after the final test.
  development_rows:
    term: Development set (development rows)
    term_fr: "échantillon de développement"
    definition: Every row outside the sealed final test, the rows the study may explore, split into training and validation rows, and use to choose. What they show is development evidence, not final evidence. For example, the cars in the development rows feed the exploration, the model fits, and the comparison of models, while the sealed cars stay unread.
  # v0.2b (WP-B4, R9): the terms of the regression diagnostics.
  heteroscedasticity:
    term: Heteroscedasticity
    term_fr: "hétéroscédasticité"
    definition: Errors whose size changes with the prediction or across groups instead of staying about the same. The mean error stays a fair summary, but one interval width for every row would be wrong. For example, if a model of fuel efficiency errs more for the cars it predicts most efficient, its errors are heteroscedastic.
  qq_plot:
    term: Quantile-quantile plot
    term_fr: "graphique quantile-quantile (QQ plot)"
    definition: The quantiles of the residuals, rescaled, plotted against the same quantiles of a normal distribution; points on the diagonal mean normal residuals. Normality is a question about the residuals after the fit, never about the raw variables, and it matters for prediction intervals rather than for the mean error. For example, a few cars with very large errors bend the ends of the plot away from the diagonal.
  example_errors:
    term: Example errors
    term_fr: "exemples d'erreurs"
    definition: The rows with the largest errors, shown with their values so a person can read what the model saw. They are examples to understand, not a sample to count. For example, the cars the model predicts worst can reveal a group of cars it was not fitted to describe.
  smearing:
    term: Retransformation (smearing)
    term_fr: "retransformation (smearing)"
    definition: When a model predicts the logarithm of the target, turning its predictions back to the original unit underestimates the mean, and a correction such as Duan's smearing is needed. For example, a model of the log of fuel efficiency would need it; this engine does not transform the target, so it does not apply here.
# B6c (M3): the terms of a study evaluated by cross-validation, merged over ``terms`` (and
# ``regression_cv_terms`` over ``regression_terms``). Generic definitions that speak of the
# rows a model is fitted on (overfitting, regularisation, imputation, standardisation)
# stay: within each fold those are the other folds' rows.
cv_terms:
  development_rows:
    definition: Every row outside the sealed final test, the rows the study may explore, divide into folds, and use to choose. What they show is development evidence, not final evidence. For example, the clients in the development rows feed the exploration, the model fits, and the comparison of call lists, while the sealed clients stay unread.
  distribution:
    definition: How the values of one column spread over the rows, read as how often each value occurs or, for a measurement, its range, quartiles, and missing cells. It is read on the development rows; the final test stays unread.
  base_rate:
    cited_example: "In this study's development rows the positive outcome occurs in {{slot:eda.target_rate:rate|pct1}} of rows."
  baseline:
    definition: The simplest reference model, a constant score equal to the base rate of the development rows. Keeping the baseline is a valid conclusion.
    cited_example: "Here the baseline gives every row the base rate of the development rows, {{slot:fit.baseline:train_rate|pct1}}, so it cannot rank the rows."
  precision:
    example: Here the logistic model's rule selects <selected> of the <n> development rows predicted out of fold and <true_positives> of them are positive, a precision of <precision>.
    cited_example: "At <rule>, {{slot:policy.evaluation:rules.[<rule>].models.[fit.logistic].precision|pct1}} of the development rows the logistic model acts on, out of fold, turn out positive."
  recall:
    example: Here the development rows hold <n_positive> positive rows and the rule reaches <true_positives> of them, out of fold, a recall of <recall>. A small capacity keeps recall low even when precision is high.
    cited_example: "At <rule>, the logistic model reaches {{slot:policy.evaluation:rules.[<rule>].models.[fit.logistic].recall|pct1}} of the positive development rows, out of fold."
  paired_bootstrap:
    definition: Resampling the same out-of-fold predictions for both policies at once, within each fold, so the interval describes their difference rather than each one separately.
    example: Here the development rows are drawn again with replacement within each fold <replicates> times, and each draw scores both models on the same rows.
  paired_difference:
    example: Here the logistic model's precision minus the baseline's at <rule> is <delta>, between <low> and <high> on resamples of the out-of-fold predictions. An interval that contains zero does not show that one model is better.
    cited_example: "At <rule>, the logistic model's precision minus the baseline's is {{slot:policy.evaluation:rules.[<rule>].deltas.[fit.logistic].precision.point|pct1}}, between {{slot:policy.evaluation:rules.[<rule>].deltas.[fit.logistic].precision.low|pct1}} and {{slot:policy.evaluation:rules.[<rule>].deltas.[fit.logistic].precision.high|pct1}} on resamples of the out-of-fold predictions."
  confidence_interval:
    definition: A range that shows how much a figure could move if other rows had been drawn. In this study it is a percentile interval of the paired bootstrap, so it describes the variability of these out-of-fold predictions, not a guaranteed range for a future campaign. For example, a precision interval that runs from close to the base rate to well above it says that the call list may barely beat calling clients at random.
    example: Here the logistic model's precision at <rule> ranges from <low> to <high> on resamples of the <n> development rows predicted out of fold; a wide range means the figure is uncertain.
    cited_example: "At <rule>, the logistic model's precision ranges from {{slot:policy.evaluation:rules.[<rule>].intervals.[fit.logistic].precision.low|pct1}} to {{slot:policy.evaluation:rules.[<rule>].intervals.[fit.logistic].precision.high|pct1}} on resamples of the out-of-fold predictions."
  selection_on_validation:
    term: Selection on development evidence
    term_fr: "sélection sur des résultats de développement"
    definition: Choosing a model, a threshold, or a capacity by looking at out-of-fold results. The chosen figures are optimistic for that reason; only the final test, opened once, is independent.
  permutation_null_band:
    definition: The range of a chart's figures after shuffling the outcome among the development rows several times with a fixed seed, which breaks any real link between the variable and the outcome. A pattern that stays inside the band is what chance alone draws; one above every shuffle is unlikely to be chance alone.
  data_contingent_decision:
    definition: A decision chosen after looking at the outcome in the data. It is allowed, but it is recorded with the analyses that motivated it, because a choice adapted to the development rows makes the out-of-fold figures slightly optimistic. For example, capping a variable because a chart of the outcome looked odd at its extremes is a data-contingent preparation.
  single_feature_signal:
    definition: How well one variable alone predicts the outcome, measured out of fold on the development rows. A variable that predicts far better than the others raises a question about when its value becomes known, because a value recorded at or after the outcome would leak it. It never decides which variables to keep.
regression_cv_terms:
  development_rows:
    definition: Every row outside the sealed final test, the rows the study may explore, divide into folds, and use to choose. What they show is development evidence, not final evidence. For example, the cars in the development rows feed the exploration, the model fits, and the comparison of models, while the sealed cars stay unread.
  success_criterion:
    definition: The smallest reduction of the baseline's error that would make the model worth adopting, fixed before any model is fitted, so the result cannot move the bar. The conclusion is read against it. For example, deciding before the models that the linear model must make errors at least a tenth smaller than predicting the mean for every car, and keeping the mean when it does not.
  target_distribution:
    definition: How the values of the target spread, summarised by the mean, the standard deviation, and the quartiles. Any model is compared with the simplest guess, the mean.
    cited_example: "On this study's development rows the target has a mean of {{slot:eda.target_summary:mean|f2}} <unit> and a standard deviation of {{slot:eda.target_summary:sd|f2}} <unit>."
  baseline:
    definition: The simplest reference model, here the mean of the target over the rows it is fitted on, predicted for every row (each fold gets the mean of the other folds). Keeping the baseline is a valid conclusion.
    cited_example: "Here the mean of the development rows is {{slot:fit.baseline:train_mean|f2}} <unit>; each fold is predicted with the mean of the other folds."
  bias:
    cited_example: "Here the mean residual of the linear model out of fold is {{slot:evaluate.regression:models.[fit.linear].mean_residual|f2}} <unit>."
  mae:
    cited_example: "Here the linear model's out-of-fold MAE is {{slot:evaluate.regression:models.[fit.linear].mae|f2}} <unit>, against {{slot:evaluate.regression:models.[fit.baseline].mae|f2}} <unit> for the mean baseline."
  rmse:
    cited_example: "Here the linear model's out-of-fold RMSE is {{slot:evaluate.regression:models.[fit.linear].rmse|f2}} <unit>, against {{slot:evaluate.regression:models.[fit.baseline].rmse|f2}} <unit> for the mean baseline."
  paired_bootstrap:
    definition: Resampling the same out-of-fold predictions for both models at once, so the interval describes their difference rather than each one separately.
    example: Here the development rows are drawn again with replacement <replicates> times, and each draw measures both models on the same out-of-fold predictions.
  paired_difference:
    example: Here the linear model's MAE minus the baseline's is <delta> <unit>, between <low> and <high> on resamples of the out-of-fold predictions. Below zero means the linear model errs less on these rows; an interval that contains zero does not show that one model is better.
    cited_example: "Here the linear model's MAE minus the baseline's is {{slot:evaluate.regression:deltas.[fit.linear].mae.point|f2}} <unit>, between {{slot:evaluate.regression:deltas.[fit.linear].mae.low|f2}} and {{slot:evaluate.regression:deltas.[fit.linear].mae.high|f2}} on resamples of the out-of-fold predictions."
  confidence_interval:
    definition: A range that shows how much a figure could move if other rows had been drawn. In this study it is a percentile interval of the paired bootstrap, so it describes the variability of these out-of-fold predictions, not a guaranteed range for future rows.
    example: Here the linear model's MAE ranges from <low> to <high> <unit> on resamples of the <n> development rows predicted out of fold; a wide range means the error is uncertain.
    cited_example: "Here the linear model's MAE ranges from {{slot:evaluate.regression:intervals.[fit.linear].mae.low|f2}} to {{slot:evaluate.regression:intervals.[fit.linear].mae.high|f2}} <unit> on resamples of the out-of-fold predictions."
  selection_on_validation:
    term: Selection on development evidence
    term_fr: "sélection sur des résultats de développement"
    definition: Choosing a model by looking at out-of-fold results. The chosen model's out-of-fold error is optimistic for that reason; only the final test, opened once, is independent.
  linear_regression:
    definition: A model that predicts the target as a weighted sum of the features, with weights fitted by least squares on the rows it is fitted on (in each fold, the other folds). Its weights are associations, not effects.
