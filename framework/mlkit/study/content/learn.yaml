# "Predict before you look" questions of the learning layer (CLI-CONTRACT-COMPANION §6, C6, C11).
# No digits here: the reveal cites the study's current results ({{slot:...}} templates, see
# mlkit.study.cite). The engine never stores, receives, or grades an answer; the companion
# keeps the junior's choice on their computer only.
#
# Each question has a ``task``, the plan ``step`` it belongs to, two to four ``choices``
# (one is always ``not_sure``), and a ``reveal`` template. Placeholders in a reveal:
# ``<rule>`` is the evaluated rule (the adopted one when it was evaluated), ``<unit>`` the
# unit of the target, and ``<sign>`` the sentence of ``sign`` chosen by the sign of the
# value at ``sign.ref`` (a ``slot:<slot>:<path>`` reference).
schema: hypotrail.content.learn/1
predictions:
  - id: binary.train_eda.rare
    task: binary
    step: train_eda
    question: Is the positive outcome common or rare in the rows explored?
    choices:
      - {id: common, label: Common}
      - {id: rare, label: Rare}
      - {id: not_sure, label: Not sure}
    reveal: "It occurs in {{slot:eda.target_rate:rate|pct1}} of the rows explored. A model has to beat this base rate to be useful."
  - id: binary.policy.beats_baseline
    task: binary
    step: policy
    question: Will the logistic model's selection beat the baseline's precision at the evaluated rule?
    choices:
      - {id: 'yes', label: 'Yes'}
      - {id: 'no', label: 'No'}
      - {id: not_sure, label: Not sure}
    reveal: "At <rule>, the logistic model's precision is {{slot:policy.evaluation:rules.[<rule>].models.[fit.logistic].precision|pct1}} and the baseline's {{slot:policy.evaluation:rules.[<rule>].models.[fit.baseline].precision|pct1}}. The paired difference is {{slot:policy.evaluation:rules.[<rule>].deltas.[fit.logistic].precision.point|pct1}}, between {{slot:policy.evaluation:rules.[<rule>].deltas.[fit.logistic].precision.low|pct1}} and {{slot:policy.evaluation:rules.[<rule>].deltas.[fit.logistic].precision.high|pct1}} on resamples of the evaluated rows."
  - id: regression.models.sign
    task: regression
    step: models
    question: Fitted without the rows it predicts, will the linear model predict them too low or too high on average?
    choices:
      - {id: too_low, label: Too low}
      - {id: too_high, label: Too high}
      - {id: not_sure, label: Not sure}
    reveal: "The mean residual of the linear model on the rows it predicted is {{slot:evaluate.regression:models.[fit.linear].mean_residual|f2}} <unit>: <sign>"
    sign:
      ref: "slot:evaluate.regression:models.[fit.linear].mean_residual"
      positive: on average it predicted too low (observed minus predicted is positive).
      negative: on average it predicted too high (observed minus predicted is negative).
      zero: on average it predicted neither too low nor too high.
  - id: regression.model_choice.beats_mean
    task: regression
    step: model_choice
    question: Will the linear model's error be below the mean baseline's?
    choices:
      - {id: 'yes', label: 'Yes'}
      - {id: 'no', label: 'No'}
      - {id: not_sure, label: Not sure}
    reveal: "The MAE of the evaluated rows is {{slot:evaluate.regression:models.[fit.linear].mae|f2}} <unit> for the linear model and {{slot:evaluate.regression:models.[fit.baseline].mae|f2}} <unit> for the mean baseline. The paired difference is {{slot:evaluate.regression:deltas.[fit.linear].mae.point|f2}} <unit>, between {{slot:evaluate.regression:deltas.[fit.linear].mae.low|f2}} and {{slot:evaluate.regression:deltas.[fit.linear].mae.high|f2}} on resamples of the evaluated rows."
