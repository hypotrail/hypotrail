# <component>
$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: @@yaml:component_train_model@@
display_name: @@yaml:display_train_model@@
version: @@yaml:component_version@@
type: command
inputs:
  hypotrail_data_path:
    type: uri_folder
  partitions_path:
    type: uri_folder
outputs:
  model_path:
    type: uri_folder
code: ./../../
environment: @@yaml:environment_ref@@
command: >-
  python -m src.pipeline.training.main mlflow_tracking=false data_dir=${{inputs.hypotrail_data_path}} train_data.path=${{inputs.partitions_path}} models.path=${{outputs.model_path}}


# </component>
