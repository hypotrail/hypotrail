version: @@yaml:component_version@@
type: command
inputs:
  hypotrail_data_path:
    type: uri_folder
  preprocessed_data_path:
    type: uri_folder
outputs:
  partitions_path:
    type: uri_folder
code: ./../../
environment: @@yaml:environment_ref@@
command: >-
  python -m src.pipeline.data_splitting.main mlflow_tracking=false data_dir=${{inputs.hypotrail_data_path}} preprocessed_data.path=${{inputs.preprocessed_data_path}} train_data.path=${{outputs.partitions_path}}


