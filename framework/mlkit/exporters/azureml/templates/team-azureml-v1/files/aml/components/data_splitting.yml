# <component>
$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: @@text:component_prefix@@_split_data
display_name: SplitData@@text:display_suffix@@
version: @@yaml:component_version@@
type: command
inputs:
  hypotrail_data_path:
    type: uri_folder
  preprocessed_data_path:
    type: uri_folder
outputs:
  partitions_path:
    type: uri_folder
code: ./../../
environment: azureml:@@text:environment_name@@:@@text:environment_version@@
command: >-
  python -m src.pipeline.data_splitting.main mlflow_tracking=@@text:mlflow_tracking_cloud@@ data_dir=${{inputs.hypotrail_data_path}} preprocessed_data.path=${{inputs.preprocessed_data_path}} train_data.path=${{outputs.partitions_path}}


# </component>
