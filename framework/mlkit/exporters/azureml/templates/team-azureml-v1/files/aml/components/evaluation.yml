# <component>
$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: @@yaml:component_evaluate_model@@
display_name: @@yaml:display_evaluate_model@@
version: @@yaml:component_version@@
type: command
inputs:
  hypotrail_data_path:
    type: uri_folder
  model_path:
    type: uri_folder
outputs:
  reports_path:
    type: uri_folder
code: ./../../
environment: @@yaml:environment_ref@@
command: >-
  python -m src.pipeline.evaluation.main mlflow_tracking=false data_dir=${{inputs.hypotrail_data_path}} models.path=${{inputs.model_path}} reports.path=${{outputs.reports_path}}


# </component>
