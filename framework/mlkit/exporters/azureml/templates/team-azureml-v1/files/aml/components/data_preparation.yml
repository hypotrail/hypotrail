command: >-
  python -m src.pipeline.data_preparation.main mlflow_tracking=@@text:mlflow_tracking_cloud@@ data_dir=${{inputs.hypotrail_data_path}} preprocessed_data.path=${{outputs.preprocessed_data_path}}


