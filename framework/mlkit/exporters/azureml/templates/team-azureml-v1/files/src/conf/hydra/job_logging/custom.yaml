version: 1
formatters:
  simple:
    format: "[%(asctime)s] - [%(levelname)-2s] - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
handlers:
  console:
    class: logging.StreamHandler
    formatter: simple
    stream: ext://sys.stdout
  file:
    class: logging.FileHandler
    formatter: simple
    filename: output.log
    mode: a
root:
  handlers: [console, file]
  level: INFO

disable_existing_loggers: false
