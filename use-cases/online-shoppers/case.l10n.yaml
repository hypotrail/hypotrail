  sha256: 86f394c70c3c14380a96ebc594b2b5e41c52e6fc82c6dd7ce9c1cd23d34ad3a0
facts:
  target:
    fr: 'Revenue : la session s''est-elle terminée par un achat (True/False ; le fichier écrit TRUE/FALSE,
      lus comme des booléens)'
  observation_unit:
    fr: Une session de navigation d'un visiteur sur une boutique en ligne
  intended_use:
    fr: 'Simulation pédagogique : choisir quelles sessions terminées relancer (un e-mail ou une publicité
      de reciblage) quand le budget n''en couvre qu''une partie'
  decision:
    fr: Sélectionner les sessions terminées à relancer en premier
  prediction_time:
    fr: Quand la session se termine
  target_as_proxy:
    fr: 'Revenue est l''achat de la même session. La relance vise un achat ultérieur, que les données
      n''enregistrent pas : le score classe les sessions selon leur ressemblance avec les sessions qui
      ont acheté, un indicateur indirect de l''intention d''achat, pas l''effet d''une relance.'
  repeated_observations:
    fr: La description UCI dit que chaque session appartient à un utilisateur différent sur une année
      (rappelé, non vérifié ici). Le fichier n'a aucun identifiant d'utilisateur ni de session ; 125 lignes
      répètent exactement une ligne antérieure.
  row_order:
    fr: 'Aucun ordre n''est documenté, et le fichier ne contient aucune date : seulement le mois, sans
      l''année. Le test final est donc un échantillon aléatoire stratifié, pas les sessions les plus récentes.'
  data_rows_columns:
    fr: 12330 lignes de données et 18 colonnes, comme UCI le publie (12330 sessions, 18 attributs)
  data_class_counts:
    fr: Revenue vaut TRUE dans 1908 lignes et FALSE dans 10422, comme UCI le publie (1908 et 10422). Un
      comptage structurel des étiquettes sur toutes les lignes, pas un taux étudié sur les lignes d'entraînement.
  data_mirror:
    fr: Obtenu le 2026-10-19 du miroir public https://raw.githubusercontent.com/fenago/datasets/main/online_shoppers_intention.csv
      (UCI était inaccessible depuis l'environnement de préparation) ; sha256 b3055ee355f59134d851d32641183cb4a8b45def7124d2f50442a042f358e0d9
      ; fins de ligne CRLF.
  causal_effect:
    fr: 'Non mesuré : les données n''enregistrent ni relance ni achat ultérieur.'
