    Specifications table, "Experimental factors": "The data point time for each observation was defined
    as the day prior to each booking''s arrival"; section 1: values were taken from the bookings change
    log "with a timestamp relative to the day prior to arrival date"; Antonio, de Almeida & Nunes (2019),
    Data in Brief 22:41-49, doi:10.1016/j.dib.2018.11.126, section 2: "it is quite common for customers
    to change their booking''s attributes, like the number of persons, staying duration, or room type
    preferences, either at the time of their check-in or during their stay. It is also common for hotels
    not to know the correct nationality of the customer until the moment of check-in."'
