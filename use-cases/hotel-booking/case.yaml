- id: prediction_time
  value: 'When the booking is entered in the hotel''s property management system (the start of lead_time).
    Known then: what the customer asks (arrival date, nights, persons, meal, room type), how the booking
    is sold (segment, channel, agent, company, customer type) and the guest''s history (repeated guest,
    previous bookings). Not known then: the outcome (is_canceled, reservation_status and its date), what
    the hotel does later (assigned_room_type, booking_changes, days_in_waiting_list). Uncertain: country,
