schema: hypotrail.case_l10n/1
case:
  id: hotel-booking-resort-v1
  sha256: 778738a4cf5d068fe05248f0c0cc7e735f38640c7668dd2c72d27853f6aaaaef
facts:
  target:
    fr: 'is_canceled : la réservation a-t-elle été annulée (1) ou non (0)'
  observation_unit:
    fr: Une réservation du Resort Hotel (H1)
  period:
    fr: Les réservations dont l'arrivée était prévue entre le 1er juillet 2015 et le 31 août 2017, celles
      qui sont arrivées et celles qui ont été annulées
  hotel:
    fr: H1 est un hôtel de villégiature en Algarve, au Portugal ; l'identification des clients et de l'hôtel
      a été supprimée
  data_snapshot:
    fr: 'Chaque valeur est celle de la veille de l''arrivée, tirée du journal des modifications des réservations,
      pas la valeur à la réservation. Pour une réservation annulée, c''est la dernière valeur avant l''annulation
      (une inférence : rien ne modifie une réservation annulée). Les clients changent souvent le nombre
      de personnes, la durée et le type de chambre, et la nationalité n''est souvent connue qu''à l''arrivée.'
  intended_use:
    fr: 'Simulation pédagogique : avec un personnel limité, choisir quelles nouvelles réservations contacter
      en premier (un appel pour les reconfirmer, ou une demande d''acompte), classées selon leur risque
      d''annulation'
  decision:
    fr: Sélectionner les nouvelles réservations au plus fort risque d'annulation, dans la limite de la
      capacité de l'équipe, pour un contact ou une demande d'acompte
  prediction_time:
    fr: 'Quand la réservation est saisie dans le logiciel de gestion de l''hôtel (le début de lead_time).
      Connu à ce moment : ce que demande le client (date d''arrivée, nuits, personnes, repas, type de
      chambre), la façon dont la réservation est vendue (segment, canal, agence, entreprise, type de client)
      et l''historique du client (client déjà venu, réservations précédentes). Pas connu à ce moment :
      le résultat (is_canceled, reservation_status et sa date), ce que l''hôtel fait ensuite (assigned_room_type,
      booking_changes, days_in_waiting_list). Incertain : country, deposit_type, adr et les demandes du
      client'
  snapshot_limit:
    fr: 'Le fichier ne contient pas les valeurs telles qu''elles étaient à la réservation : une modification
      faite entre la réservation et la veille de l''arrivée est incluse (fait data_snapshot). Un modèle
      ajusté ici peut paraître meilleur qu''un modèle alimenté avec les valeurs à la réservation.'
  repeated_observations:
    fr: Pas d'identifiant client (supprimé par les auteurs) ; previous_cancellations et previous_bookings_not_canceled
      montrent qu'un client peut avoir plusieurs réservations. 6092 lignes répètent exactement une ligne
      antérieure (2325 groupes, 8417 lignes).
  row_order:
    fr: 'Les lignes sont dans l''ordre des arrivées, du 2015-07-01 au 2017-08-31 : build_case.py trie
      les lignes du Resort Hotel par date d''arrivée (année, mois, jour du mois), en gardant l''ordre
      du miroir pour une même date. Le dernier cinquième des lignes commence aux arrivées du 2017-04-13
      ; une réservation qui s''y trouve a pu être saisie avant l''arrivée de certaines réservations de
      développement (lead_time atteint deux ans) : le test final est dans le futur selon la date d''arrivée,
      pas selon la date de réservation.'
  data_rows_columns:
    fr: 40060 lignes de données et 31 colonnes, comme l'article le publie pour H1 (40060 observations,
      31 variables)
  data_class_counts:
    fr: is_canceled vaut 1 dans 11122 lignes et 0 dans 28938. Un comptage structurel sur toutes les lignes,
      pas un taux étudié sur les lignes d'entraînement ; l'article ne publie aucun nombre d'annulations.
  data_mirror:
    fr: 'Obtenu le 2026-10-20 du miroir public https://raw.githubusercontent.com/rfordatascience/tidytuesday/master/data/2020/2020-02-11/hotels.csv
      (sha256 7c2ae42a7353905ea136e5c2287f17c92c5435826598bfbb8491c6f0c7b1fc06 ; 119390 lignes : 40060
      du Resort Hotel et 79330 du City Hotel, comme l''article le publie). data/hotel-resort.csv est dérivé
      du fichier miroir par build_case.py --derive : les 40060 lignes du Resort Hotel, sans la colonne
      constante hotel, triées par date d''arrivée (tri stable, donc l''ordre du miroir est gardé pour
      une même date) ; chaque cellule est copiée comme texte, inchangée. sha256 de data/hotel-resort.csv
      : cad1f2500c152b5733f1dc26023ae2975f76c186da18c057ab85732f18d00782.'
  causal_effect:
    fr: 'Non mesuré : les données n''enregistrent aucun contact ni aucune demande d''acompte faits à cause
      d''un score, donc elles ne disent rien de l''effet d''un contact ou d''un acompte sur une annulation.'
