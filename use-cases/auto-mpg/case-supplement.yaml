schema: hypotrail.case-supplement/1
analysis_contract:
  schema: hypotrail.analysis/1
  scenario_id: auto-mpg-retrospective-v1
  intended_use: retrospective_comparison
  row_unit: car model
  population: Vehicles in the published Auto MPG extract
  prediction_statement: Estimate mpg retrospectively from vehicle characteristics
  timing:
    prediction_order: null
    outcome_available_order: null
    scale: ordinal
  dependencies:
    kind: unknown
    group_column: null
    group_goal: null
    status: unknown
    source: No independent sampling or prospective availability guarantee is documented
  permitted_claims: [retrospective_association]
purpose: >-
  Input of mlkit.study.migrate, next to project.json. It adds what the companion tutorial
  contract does not carry: how to read auto-mpg.data (whitespace-separated, no header, "?"
  for missing horsepower), line-cited documentation, and structural observations that
  replace companion template placeholders. Edit this file and regenerate case.yaml; never
  edit case.yaml.
dataset:
  sep: whitespace
  header: false
  quotechar: '"'
  na_values: ['?']
  column_names: [mpg, cylinders, displacement, horsepower, weight, acceleration, model_year,
                 origin, car_name]
target:
  positive_label: null
facts:
  target:
    source: 'data/auto-mpg.names:24-26,34'
  repeated_observations:
    value: >-
      Model years 70 to 82 (read as 1970 to 1982). The 398 rows carry 305 distinct car names:
      some names occur in several rows, including across model years.
    status: observed
    source: 'Structural inspection of data/auto-mpg.data'
variables:
  horsepower:
    group: Engine
    labels:
      fr: 'Puissance du moteur.'
    special_values:
      - value: '?'
        meaning: Missing value.
        status: observed
        source: >-
          data/auto-mpg.names:44 documents 6 missing horsepower values; structural inspection of
          data/auto-mpg.data shows that they are written "?"
  model_year:
    group: Model
    labels:
      fr: 'Année du modèle, codée de 70 à 82 (lue comme 1970 à 1982).'
    description: Model year, coded 70 to 82 (read as 1970 to 1982).
    source: 'data/auto-mpg.names:40'
  car_name:
    group: Model
    labels:
      fr: 'Nom du modèle de voiture. La documentation indique qu''il est unique pour chaque ligne, mais certains noms apparaissent sur plusieurs lignes.'
    type: string
    role: group_id
    description: >-
      Car model name. The documentation states that it is unique for each instance, but some
      names occur in several rows.
    status: observed
    source: 'data/auto-mpg.names:42; structural inspection of data/auto-mpg.data'
  mpg:
    group: Outcome
    labels:
      fr: 'Miles par gallon : une valeur plus élevée signifie une consommation de carburant plus faible.'
    source: 'data/auto-mpg.names:24-26,34'
  cylinders:
    group: Engine
    labels:
      fr: 'Nombre de cylindres.'
    source: 'data/auto-mpg.names:35'
  displacement:
    group: Engine
    labels:
      fr: 'Cylindrée du moteur.'
  weight:
    group: Body and performance
    labels:
      fr: 'Poids du véhicule.'
  acceleration:
    group: Body and performance
    labels:
      fr: 'Temps d''accélération ; non utilisé par les modèles dans cet exercice.'
  origin:
    group: Model
    labels:
      fr: 'Code d''origine 1, 2 ou 3.'
structure:
  group_column:
    value: car_name
    status: observed
    source: 'Structural inspection of data/auto-mpg.data: 305 distinct car names for 398 rows'
  duplicates:
    value: 0
    status: observed
    source: 'Structural inspection of data/auto-mpg.data: no exact duplicate rows'
