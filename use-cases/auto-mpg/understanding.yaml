# Understanding and handover task bank (ADR 0008, SPEC-COMPREHENSION §08).
# Drafted by the implementation agent from this case's contract; NOT yet reviewed by a person.
# qualification.status stays to_qualify until an ML referent and a person in charge of the
# handover have reviewed the rubrics and recorded their review; until then this bank never
# produces a required result. Prompts cite the study through {decision:...}, {fact:...} and
# {case:...} references resolved at capture: no figure is written here.
schema: hypotrail.understanding-tasks/1
taskset_id: autompg-understanding
taskset_version: 1
case_id: uci-auto-mpg-v1
case_contract_version: hypotrail.case/1
locale: en
qualification:
  status: to_qualify
  reviews: []
rubrics:
- rubric_id: autompg-d1
  version: 1
  dimension_id: D1
  criteria:
  - criterion_id: unit_population
    text: Names the unit of observation and the population the study covers, in the case terms.
    mandatory: true
    not_applicable_allowed: false
  - criterion_id: decision_moment
    text: Says what decision the prediction supports and at which moment the prediction is made, and why
      that moment matters for the inputs.
    mandatory: true
    not_applicable_allowed: false
  error_signs:
  - Describes the target only, without the decision it supports.
  - Places the prediction after the information it needs is known.
  acceptable_evidence:
  - A reference to the case facts or to the confirmed prediction moment.
  uncertain_cases:
  - The case leaves part of the population unspecified; saying so is correct.
  demonstrated_when: Both mandatory criteria are met with the case terms, by a paraphrase or not.
  dependency_keys:
  - study:decision:prediction_time
  - case:contract
  hints:
  - 'Start from the row: what does one line of the data describe?'
  - Who acts on the prediction, and what do they know at that moment?
- rubric_id: autompg-d2
  version: 1
  dimension_id: D2
  criteria:
  - criterion_id: availability_rule
    text: Links the inclusion of an input to its availability at the prediction moment, with the rule
      or decision that applies.
    mandatory: true
    not_applicable_allowed: false
  - criterion_id: effect_on_validity
    text: Explains what an input known only later does to the measured performance and to the conclusion.
    mandatory: true
    not_applicable_allowed: false
  - criterion_id: where_to_change
    text: Points to where the input selection is decided or changed.
    mandatory: false
    not_applicable_allowed: false
  error_signs:
  - Says only "leakage" without linking it to the prediction moment.
  - Proposes to keep the input because it improves the score.
  acceptable_evidence:
  - The confirmed availability decision, the data card, or the mapped selection code.
  uncertain_cases:
  - An input whose timing the case documents as uncertain; asking the owner is correct.
  demonstrated_when: The two mandatory criteria are met; the location is a bonus.
  dependency_keys:
  - study:decision:feature_availability
  - study:decision:prediction_time
  - case:contract
  - data:dataset
  hints:
  - Ask when each value is recorded relative to the prediction moment.
  - What would the model be able to use in production, and what only in this file?
- rubric_id: autompg-d3
  version: 1
  dimension_id: D3
  criteria:
  - criterion_id: partition_role
    text: Explains the role of each partition (development folds or validation, final test) and why the
      final test is looked at once.
    mandatory: true
    not_applicable_allowed: false
  - criterion_id: exposure_kept
    text: States that changing the split after looking at results does not make the seen rows unseen,
      and that the exposure history is kept.
    mandatory: true
    not_applicable_allowed: false
  error_signs:
  - Proposes to re-split and present a new test as independent.
  - Treats validation results as final evidence.
  acceptable_evidence:
  - The confirmed split decision and the exposure ledger of the report.
  uncertain_cases:
  - A temporal split whose time column has gaps; naming the limit is correct.
  demonstrated_when: Both mandatory criteria are met.
  dependency_keys:
  - study:decision:split
  - study:partition
  hints:
  - Which rows has anyone already looked at, and how is that recorded?
  - What makes a test independent of the choices made on it?
- rubric_id: autompg-d4
  version: 1
  dimension_id: D4
  criteria:
  - criterion_id: error_in_unit
    text: Reads the error of the model against the baseline in the unit of the target, with its uncertainty.
    mandatory: true
    not_applicable_allowed: false
  - criterion_id: scope
    text: Says what the error allows and does not allow to conclude for the decision of the case; no positive
      class is involved.
    mandatory: true
    not_applicable_allowed: false
  error_signs:
  - Speaks of precision, recall or a positive class for a numeric target.
  - Reports an error without its unit.
  acceptable_evidence:
  - The confirmed success criterion and the cited results of the report.
  uncertain_cases:
  - 'The final test is not opened yet: development evidence only, which is correct to say.'
  demonstrated_when: Both mandatory criteria are met in the unit of the target.
  dependency_keys:
  - study:decision:success_criterion
  - role:result
  hints:
  - In which unit is the error expressed?
  - Is a smaller error enough for the decision the case describes?
- rubric_id: autompg-d5
  version: 1
  dimension_id: D5
  criteria:
  - criterion_id: learned_where
    text: Names what each transformation learns and on which rows it is fitted (within each fold, not
      on all rows).
    mandatory: true
    not_applicable_allowed: false
  - criterion_id: train_predict_consistency
    text: Explains how the same fitted transformation is applied at prediction time.
    mandatory: true
    not_applicable_allowed: false
  error_signs:
  - Fits an imputation or a scaling on all rows before splitting.
  - Recomputes the transformation on the rows to predict.
  acceptable_evidence:
  - The confirmed preprocessing decision or the mapped transformation code.
  uncertain_cases:
  - A transformation with no learned parameter; saying so is correct.
  demonstrated_when: Both mandatory criteria are met.
  dependency_keys:
  - study:decision:preprocessing
  - role:transform_recipe
  hints:
  - For each step, what number does it learn from data?
  - Which rows exist when that number is learned?
- rubric_id: autompg-d6
  version: 1
  dimension_id: D6
  criteria:
  - criterion_id: path_in_out
    text: Follows the path from an input row to the output through the mapped code, naming the files.
    mandatory: true
    not_applicable_allowed: false
  - criterion_id: locate_control
    text: Locates where a given control (availability check, partition guard) is implemented, or says
      it is absent.
    mandatory: true
    not_applicable_allowed: false
  - criterion_id: diagnose
    text: Proposes how to diagnose an anomaly without changing the reference study.
    mandatory: false
    not_applicable_allowed: false
  error_signs:
  - Describes the code from memory without a file reference.
  - Proposes to edit the reference study to reproduce a defect.
  acceptable_evidence:
  - Paths of the mapped code files.
  uncertain_cases:
  - A control implemented by the engine rather than the project code; saying so is correct.
  demonstrated_when: Both mandatory criteria are met with file references.
  dependency_keys:
  - role:code
  - engine:code
  hints:
  - Open the mapped files and follow one row.
  - Search for where the input list is built.
- rubric_id: autompg-d7
  version: 1
  dimension_id: D7
  criteria:
  - criterion_id: assumptions
    text: States the assumptions the conclusion rests on and the uses it does not cover.
    mandatory: true
    not_applicable_allowed: false
  - criterion_id: blocking_conditions
    text: Names conditions that would forbid a conclusion (a criterion not met, a stale result, a leakage
      doubt).
    mandatory: true
    not_applicable_allowed: false
  error_signs:
  - Turns a retrospective association into a promise about future cases.
  - Claims a causal effect.
  acceptable_evidence:
  - The "not yet defensible" section and the case facts.
  uncertain_cases:
  - A limit the case documents as unknown; naming it is correct.
  demonstrated_when: Both mandatory criteria are met.
  dependency_keys:
  - case:contract
  - study:decision:success_criterion
  hints:
  - What would have to be true for the conclusion to hold next year?
  - Read the "not yet defensible" list.
- rubric_id: autompg-d8
  version: 1
  dimension_id: D8
  criteria:
  - criterion_id: dependencies_env
    text: Says where the dependency versions and the environment are pinned and how to reproduce the study
      safely.
    mandatory: true
    not_applicable_allowed: false
  - criterion_id: security_rules
    text: Names the security and data rules that apply before adopting generated code, and what to do
      when provenance or behaviour cannot be established.
    mandatory: true
    not_applicable_allowed: false
  - criterion_id: rollback
    text: Names a point of return and the change that a reviewer must verify.
    mandatory: false
    not_applicable_allowed: false
  error_signs:
  - Says the code is safe because it passed a questionnaire.
  - Adopts a dependency without checking its provenance.
  acceptable_evidence:
  - The dependency lock, the mapped security rules, the environment commands.
  uncertain_cases:
  - No security rule is mapped; escalating is the expected answer.
  demonstrated_when: Both mandatory criteria are met; a correct answer certifies nothing about the dependency.
  dependency_keys:
  - engine:dependency_lock
  - role:security_rule
  hints:
  - Where is the lock file, and who reviews a change to it?
  - What do you do when you cannot tell where a snippet comes from?
