# The French form of the case statements the junior reads (hypotrail.case_l10n/1,
# docs/specs/CASE-CONTRACT.md, "Translations"; owner session 2026-10-26, L3). Written by hand:
# case.yaml is generated by mlkit.study.migrate, and this file names the sha256 of the exact
# case.yaml it translates. A new case.yaml needs this file updated (test_case_l10n.py checks it).
# bank-marketing-full/build_case.py builds its own sidecar from this one.
schema: hypotrail.case_l10n/1
case:
  id: uci-bank-marketing-v1
  sha256: c403c79c0f056cb5bcd53f68b05e59b9624fe1b18c8689e0cb979b7c5779121b
facts:
  target:
    fr: 'y : souscription observée à un dépôt à terme (yes/no)'
  observation_unit:
    fr: Un client contacté pendant une campagne téléphonique
  intended_use:
    fr: 'Simulation pédagogique : prioriser les contacts quand la capacité d''appel est limitée'
  decision:
    fr: Sélectionner les contacts à appeler en premier
  prediction_time:
    fr: Avant l'appel
  repeated_observations:
    fr: 'Impossible à vérifier : l''extrait n''a ni identifiant client ni date complète.'
  causal_effect:
    fr: Non mesuré par ces observations historiques.
structure:
  row_unit:
    fr: Un client contacté pendant une campagne téléphonique
special_values:
- column: job
  value: unknown
  meaning: &unknown_category
    fr: 'Une catégorie listée par la documentation ; ce qu''elle recouvre n''est pas documenté.'
- column: education
  value: unknown
  meaning: *unknown_category
- column: contact
  value: unknown
  meaning: *unknown_category
- column: pdays
  value: -1
  meaning:
    fr: Le client n'avait pas été contacté auparavant.
- column: poutcome
  value: unknown
  meaning: *unknown_category
variables:
  age: &client_undocumented
    group: &client
      fr: Client
    availability: &undocumented
      source:
        fr: La disponibilité au moment de la prédiction n'est pas documentée
  job: *client_undocumented
  marital: *client_undocumented
  education: *client_undocumented
  default: *client_undocumented
  balance:
    group: *client
    availability: &scenario
      source:
        fr: Hypothèse du scénario pédagogique ; la documentation des données n'établit pas la
          disponibilité au moment de la prédiction
  housing: *client_undocumented
  loan: *client_undocumented
  contact: &contact_undocumented
    group: &contact
      fr: Dernier contact de cette campagne
    availability: *undocumented
  day: *contact_undocumented
  month: *contact_undocumented
  duration:
    group: *contact
    availability:
      source:
        fr: 'data/bank-names.txt:56,60 : durée du dernier contact de la campagne en cours, qui
          n''est connue qu''une fois ce contact terminé'
  campaign:
    group: &campaigns
      fr: Cette campagne et les précédentes
    availability: *undocumented
  pdays: &campaigns_scenario
    group: *campaigns
    availability: *scenario
  previous: *campaigns_scenario
  poutcome: *campaigns_scenario
  y:
    group:
      fr: Résultat
    availability:
      source:
        fr: Hypothèse du scénario pédagogique ; non établi par la documentation des données
